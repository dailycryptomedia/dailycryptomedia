# =============================================================================
#  DIAGNOSA — alat periksa, bukan alat produksi
#  ---------------------------------------------------------------------------
#  Menggantikan perintah yang dulu dijalankan dari CMD di laptop. Alur kerja
#  ini HANYA MEMBACA: tidak menulis ke basis data, tidak menyentuh docs/,
#  tidak melakukan commit, dan tidak menerbitkan apa pun ke situs. Karena itu
#  aman dijalankan kapan saja, sesering apa pun, tanpa risiko merusak keadaan.
#
#  Tidak ada jadwal. Hanya berjalan saat tombol "Run workflow" ditekan.
#
#  Kolom "url" bersifat opsional. Isi dengan alamat feed yang dicurigai atau
#  alamat beranda sebuah situs; bila yang diberikan bukan feed, skrip akan
#  membaca tag autodiscovery pada halaman itu dan melaporkan kandidat feed
#  yang tercantum di sana.
# =============================================================================

name: Diagnosa

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL feed atau beranda yang ingin diuji (boleh dikosongkan)"
        required: false
        default: ""

permissions:
  contents: read            # hanya membaca; tidak ada yang ditulis balik

jobs:
  periksa:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Siapkan Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dcm-ingest/requirements.txt

      - name: Pasang dependensi
        working-directory: dcm-ingest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Periksa semua endpoint feed
        working-directory: dcm-ingest
        run: python -m dcm.cli verify

      - name: Ringkasan isi basis data
        working-directory: dcm-ingest
        env:
          DCM_DATABASE_URL: sqlite:///dcm.db
        run: python -m dcm.cli status

      - name: Uji satu URL
        working-directory: dcm-ingest
        env:
          URL: ${{ inputs.url }}
        run: |
          python - <<'PY'
          import os, re, sys
          import httpx

          url = os.environ.get("URL", "").strip()
          if not url:
              print("Kolom url dikosongkan, langkah ini dilewati.")
              sys.exit(0)

          UA = ("DailyCryptoMediaBot/1.0 (+https://dailycryptomedia.com/bot; "
                "redaksi@dailycryptomedia.com)")

          print(f"Menguji: {url}\n" + "-" * 70)
          try:
              r = httpx.get(url, headers={"User-Agent": UA},
                            timeout=20, follow_redirects=True)
          except Exception as e:
              print(f"GAGAL TERSAMBUNG. {type(e).__name__}: {e}")
              sys.exit(0)

          tipe = r.headers.get("content-type", "?").split(";")[0]
          print(f"Kode   : {r.status_code}")
          print(f"Tipe   : {tipe}")
          print(f"Ukuran : {len(r.content)} bita")
          if str(r.url) != url:
              print(f"Dialihkan ke: {r.url}")
          print("-" * 70)

          if r.status_code >= 400:
              print("Server menolak. URL ini tidak bisa dipakai.")
              sys.exit(0)

          teks = r.text
          awal = teks[:3000].lower()

          if "<rss" in awal or "<feed" in awal:
              jumlah = len(re.findall(r"<item[ >]|<entry[ >]", teks, re.I))
              print(f"INI FEED YANG SAH. {jumlah} item terdeteksi.\n")
              judul = re.findall(r"<title[^>]*>(.*?)</title>", teks, re.S | re.I)
              for j in judul[1:6]:
                  bersih = re.sub(r"<!\[CDATA\[|\]\]>|\s+", " ", j).strip()
                  print(f"  - {bersih[:78]}")
              print("\nSalin URL ini ke feed_candidates pada config/sources.yaml.")
          else:
              print("Bukan feed. Mencari tautan feed di dalam halaman.\n")
              tag = re.findall(
                  r'<link[^>]+type=["\']application/(?:rss|atom)\+xml["\'][^>]*>',
                  teks, re.I)
              alamat = []
              for t in tag:
                  m = re.search(r'href=["\']([^"\']+)["\']', t, re.I)
                  if m:
                      alamat.append(m.group(1))
              if alamat:
                  print("Kandidat feed yang diumumkan halaman ini:")
                  for a in alamat:
                      print(f"  {a}")
                  print("\nJalankan ulang Diagnosa dengan salah satu alamat di atas.")
              else:
                  print("Halaman tidak mengumumkan feed apa pun.")
                  print("Pola yang lazim dicoba manual: /feed/, /rss/, /feed/rss/,")
                  print("/atom.xml, /index.xml, /?feed=rss2")
          PY
