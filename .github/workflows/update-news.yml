# =============================================================================
#  PENARIK BERITA + PENERBIT SITUS
#  ---------------------------------------------------------------------------
#  Alur kerja ini menggantikan jendela CMD "3-penarik.bat" di komputer lokal.
#  Setiap 30 menit GitHub menjalankan pipeline, menulis ulang berkas JSON di
#  docs/data/api/, meng-commit hasilnya, lalu MENERBITKAN SENDIRI folder docs
#  ke GitHub Pages.
#
#  Kenapa menerbitkan sendiri, bukan memakai mode "Deploy from a branch"?
#  Karena commit yang didorong oleh Actions memakai GITHUB_TOKEN tidak memicu
#  pembangunan ulang Pages. Dengan mode branch, berita baru akan masuk ke repo
#  tetapi situs tetap menampilkan data lama selamanya. Pekerjaan "terbitkan"
#  di bawah memutus masalah itu.
#
#  Basis data dcm.db ikut di-commit dengan sengaja. Di dalamnya tersimpan
#  keadaan deduplikasi dan hasil terjemahan; tanpa itu, setiap putaran akan
#  mulai dari nol dan artikel lama muncul lagi sebagai "baru" — sekaligus
#  membayar ulang terjemahan yang sudah pernah dibayar.
# =============================================================================

name: Perbarui berita

on:
  schedule:
    # Setiap 30 menit. Jadwal GitHub kerap meleset 5-15 menit saat sedang
    # ramai; itu perilaku normal, bukan kegagalan.
    - cron: "*/30 * * * *"
  workflow_dispatch:        # tombol "Run workflow" untuk menjalankan manual
  push:
    branches: [main]
    # Supaya perubahan tampilan yang kamu kirim dari komputer langsung terbit,
    # tanpa menunggu putaran terjadwal berikutnya.
    paths:
      - "docs/**"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write           # untuk meng-commit JSON dan dcm.db
  pages: write              # untuk menerbitkan ke GitHub Pages
  id-token: write           # dibutuhkan mekanisme penerbitan Pages

concurrency:
  # Mencegah dua putaran menulis dcm.db bersamaan, yang akan berakhir dengan
  # konflik push. Putaran yang menunggu tidak dibatalkan, hanya mengantre.
  group: perbarui-berita
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  #  1. Tarik berita, ekspor JSON, simpan ke repo
  # ---------------------------------------------------------------------------
  perbarui:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil repo
        uses: actions/checkout@v4

      - name: Siapkan Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dcm-ingest/requirements.txt

      - name: Pasang dependensi
        working-directory: dcm-ingest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan pipeline
        working-directory: dcm-ingest
        env:
          DCM_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DCM_DATABASE_URL: sqlite:///dcm.db
          DCM_COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          python -m dcm.cli init
          # Tanpa kunci API, tahap terjemahan dilewati dan situs tetap terbit
          # dengan artikel berbahasa Indonesia saja. Situs tidak boleh mati
          # hanya karena satu secret belum diisi.
          if [ -n "$DCM_ANTHROPIC_API_KEY" ]; then
            python -m dcm.cli run
          else
            echo "::warning::ANTHROPIC_API_KEY kosong, terjemahan dilewati"
            python -m dcm.cli run --skip-translate
          fi
          python -m dcm.cli export
          # Data pasar diambil terpisah. Kegagalannya tidak boleh
          # menggagalkan penerbitan berita, jadi errornya ditelan di sini.
          python -m dcm.cli pasar || echo "::warning::data pasar gagal diambil, memakai berkas lama"

      - name: Ringkasan isi basis data
        working-directory: dcm-ingest
        env:
          DCM_DATABASE_URL: sqlite:///dcm.db
        run: python -m dcm.cli status

      - name: Commit hasil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data dcm-ingest/dcm.db
          # Bila tidak ada berita baru, tidak ada yang berubah. Keluar dengan
          # tenang alih-alih menggagalkan seluruh putaran.
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan, tidak ada yang perlu di-commit."
          else
            git commit -m "berita: perbarui $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi

      # Folder docs dibungkus APA ADANYA dari cakram kerja, jadi berkas JSON
      # yang baru saja ditulis ikut terbawa, bukan versi yang tersimpan di
      # repo sebelum putaran ini.
      - name: Bungkus folder docs
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  # ---------------------------------------------------------------------------
  #  2. Terbitkan ke GitHub Pages
  # ---------------------------------------------------------------------------
  terbitkan:
    needs: perbarui
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.penerbitan.outputs.page_url }}

    steps:
      - name: Terbitkan
        id: penerbitan
        uses: actions/deploy-pages@v4
