# =============================================================================
#  PENARIK BERITA + PENERBIT SITUS
#  ---------------------------------------------------------------------------
#  Alur kerja ini menggantikan jendela CMD "3-penarik.bat" di komputer lokal.
#  Setiap 30 menit GitHub menjalankan pipeline, menulis ulang berkas JSON di
#  docs/data/api/, meng-commit hasilnya, lalu MENERBITKAN SENDIRI folder docs
#  ke GitHub Pages.
#
#  Kenapa menerbitkan sendiri, bukan memakai mode "Deploy from a branch"?
#  Karena commit yang didorong oleh Actions memakai GITHUB_TOKEN tidak memicu
#  pembangunan ulang Pages. Dengan mode branch, berita baru akan masuk ke repo
#  tetapi situs tetap menampilkan data lama selamanya. Pekerjaan "terbitkan"
#  di bawah memutus masalah itu.
#
#  Basis data dcm.db ikut di-commit dengan sengaja. Di dalamnya tersimpan
#  keadaan deduplikasi dan hasil terjemahan; tanpa itu, setiap putaran akan
#  mulai dari nol dan artikel lama muncul lagi sebagai "baru".
#
#  BATAS UMUR 1 HARI. DCM_MAX_ARTICLE_AGE_DAYS menahan item yang tanggal
#  terbitnya lebih tua dari 24 jam agar tidak masuk basis data sama sekali.
#  Ini penghemat kuota terbesar: yang tidak pernah masuk tidak pernah
#  diterjemahkan. Bila halaman depan terasa terlalu sepi, longgarkan ke "2".
#
#  Untuk memeriksa keadaan tanpa mengubah apa pun, pakai alur kerja Diagnosa.
#  Alur kerja itu hanya membaca dan aman dijalankan kapan saja.
# =============================================================================

