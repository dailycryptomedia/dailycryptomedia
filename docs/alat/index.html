/* ============================================================
   22 — KATEGORI: KEUANGAN PERSONAL
   ============================================================ */
const KAT_PERSONAL = [

/* ---------------------------------------------------------- P1 */
{
  id: 'p1-aruskas', kat: 'personal', kode: 'P1', ikon: '⇄',
  nama: 'Arus Kas & Savings Rate',
  ringkas: 'Surplus bulanan, komposisi pengeluaran, dan deteksi kebocoran.',
  intro: 'Savings rate adalah variabel nomor satu penentu hasil investasi — di atas perilaku, dan jauh di atas pemilihan instrumen. Kalkulator ini mengukurnya dan menunjukkan pos mana yang paling menekannya.',
  input: [
    { k: 'gaji', label: 'Gaji / penghasilan tetap', tipe: 'rupiah', awal: 32000000, grup: 'Pemasukan' },
    { k: 'usahaLain', label: 'Distribusi usaha / freelance', tipe: 'rupiah', awal: 6000000, grup: 'Pemasukan' },
    { k: 'sewa', label: 'Pendapatan sewa', tipe: 'rupiah', awal: 0, grup: 'Pemasukan' },
    { k: 'investasi', label: 'Pendapatan investasi', tipe: 'rupiah', awal: 1500000, grup: 'Pemasukan' },
    { k: 'pokok', label: 'Kebutuhan pokok', tipe: 'rupiah', awal: 9000000, hint: 'Makan, listrik, air, transportasi kerja', grup: 'Pengeluaran' },
    { k: 'gayaHidup', label: 'Gaya hidup', tipe: 'rupiah', awal: 5500000, hint: 'Hiburan, makan di luar, langganan', grup: 'Pengeluaran' },
    { k: 'keluarga', label: 'Dukungan keluarga', tipe: 'rupiah', awal: 3000000, grup: 'Pengeluaran' },
    { k: 'cicilan', label: 'Cicilan hutang', tipe: 'rupiah', awal: 9000000, grup: 'Pengeluaran' },
    { k: 'asuransi', label: 'Premi asuransi', tipe: 'rupiah', awal: 1800000, grup: 'Pengeluaran' },
    { k: 'pendidikan', label: 'Pendidikan', tipe: 'rupiah', awal: 4000000, grup: 'Pengeluaran' },
    { k: 'tahunanBesar', label: 'Pengeluaran tahunan besar', tipe: 'rupiah', awal: 42000000, hint: 'Mudik, liburan, pajak kendaraan, perawatan rumah — dibagi 12 secara otomatis', grup: 'Pengeluaran' }
  ],
  hitung(v) {
    const masuk = v.gaji + v.usahaLain + v.sewa + v.investasi;
    const tahunanBulanan = v.tahunanBesar / 12;
    const pos = [
      { nama: 'Kebutuhan pokok', n: v.pokok, esensial: true },
      { nama: 'Gaya hidup', n: v.gayaHidup, esensial: false },
      { nama: 'Dukungan keluarga', n: v.keluarga, esensial: true },
      { nama: 'Cicilan hutang', n: v.cicilan, esensial: true },
      { nama: 'Premi asuransi', n: v.asuransi, esensial: true },
      { nama: 'Pendidikan', n: v.pendidikan, esensial: true },
      { nama: 'Alokasi pengeluaran tahunan', n: tahunanBulanan, esensial: false }
    ];
    const keluar = pos.reduce((s, p) => s + p.n, 0);
    const esensial = pos.filter(p => p.esensial).reduce((s, p) => s + p.n, 0);
    const surplus = masuk - keluar;
    const sr = M.bagi(surplus, masuk);
    const rasioEsensial = M.bagi(esensial, masuk);
    const level = sr === null ? '' : sr >= K.ambang.savingsRate.baik ? 'sehat'
      : sr >= K.ambang.savingsRate.wajar ? 'sehat' : sr >= K.ambang.savingsRate.kurang ? 'waspada' : 'kritis';
    const label = sr === null ? '—' : sr >= .6 ? 'Sangat baik' : sr >= .4 ? 'Baik' : sr >= .2 ? 'Wajar' : 'Kurang';

    Object.assign(PROFIL, { penghasilanBulanan: masuk, pengeluaranBulanan: keluar, cicilanBulanan: v.cicilan });

    const pesan = [];
    if (surplus <= 0) pesan.push({ nada: 'kritis', judul: 'Arus kas negatif',
      teks: 'Pengeluaran melampaui pemasukan. Tidak ada strategi investasi yang bisa memperbaiki ini — hanya kenaikan penghasilan atau pemangkasan pengeluaran.' });
    if (v.tahunanBesar > 0) pesan.push({ nada: 'info', judul: 'Pengeluaran tahunan sering terlupa',
      teks: `${F.rpRingkas(v.tahunanBesar)} per tahun setara ${F.rpRingkas(tahunanBulanan)} per bulan. Pos ini yang paling sering membuat orang merasa "surplus tetapi uangnya tidak ada".` });
    const sisipan = M.bagi(v.gayaHidup, masuk);
    if (sisipan !== null && sisipan > 0.25) pesan.push({ nada: 'waspada', judul: 'Gaya hidup menekan surplus',
      teks: `${F.persen(sisipan)} dari penghasilan masuk ke pos gaya hidup. Ini pos paling elastis — memangkasnya 30% menambah surplus ${F.rpRingkas(v.gayaHidup * 0.3)} per bulan.` });

    // Dampak kenaikan savings rate terhadap waktu ke kebebasan finansial
    const ff = M.ffNominal(keluar);
    const skenario = [
      { l: 'Surplus saat ini', pmt: Math.max(0, surplus) },
      { l: 'Surplus +25%', pmt: Math.max(0, surplus * 1.25) },
      { l: 'Surplus +50%', pmt: Math.max(0, surplus * 1.5) },
      { l: 'Penghasilan +20%', pmt: Math.max(0, surplus + masuk * 0.2) }
    ].map(s => ({ ...s, tahun: M.waktuKeTarget(PROFIL.asetInvestasi || 0, s.pmt, 0.09, ff) }));

    return {
      metrik: [
        { label: 'Total pemasukan', nilai: masuk, format: 'rupiah' },
        { label: 'Total pengeluaran', nilai: keluar, format: 'rupiah' },
        { label: 'Surplus bulanan', nilai: surplus, format: 'rupiah', sorot: true },
        { label: 'Savings rate', nilai: sr, format: 'persen', nada: level, ket: label },
        { label: 'Rasio pengeluaran esensial', nilai: rasioEsensial, format: 'persen', ket: 'Bagian yang sulit dipangkas' },
        { label: 'Surplus tahunan', nilai: surplus * 12, format: 'rupiah-ringkas' }
      ],
      pesan,
      tabel: { judul: 'Komposisi pengeluaran', kolom: [
          { k: 'nama', label: 'Pos' }, { k: 'n', label: 'Per bulan', n: true, format: 'rupiah' },
          { k: 'porsiMasuk', label: '% pemasukan', n: true, format: 'persen' },
          { k: 'sifat', label: 'Sifat' }
        ], baris: pos.map(p => ({ ...p, porsiMasuk: M.bagi(p.n, masuk), sifat: p.esensial ? 'Esensial' : 'Elastis' }))
          .concat([{ nama: 'Total', n: keluar, porsiMasuk: M.bagi(keluar, masuk), sifat: '—', _tekan: true }]) },
      grafikHtml: C.batang(skenario.map(s => ({
        label: s.l, nilai: s.tahun ?? 60, teks: F.durasi(s.tahun),
        warna: s.l === 'Surplus saat ini' ? 'var(--netral)' : 'var(--giok)'
      })), {}),
      grafikJudul: `Waktu menuju kebebasan finansial (target ${F.rpRingkas(ff)}, asumsi return 9%)`,
      narasi: '<p>Perhatikan mana yang paling memendekkan waktu: menaikkan surplus atau menaikkan penghasilan. Untuk portofolio di bawah skala kritis, jawabannya hampir selalu penghasilan.</p>'
    };
  }
},

/* ---------------------------------------------------------- P2 */
{
  id: 'p2-darurat', kat: 'personal', kode: 'P2', ikon: '⛨',
  nama: 'Dana Darurat',
  ringkas: 'Target dana darurat berdasarkan profil risiko penghasilan, bukan angka tunggal.',
  intro: 'Jumlah bulan tidak boleh diseragamkan. Pengusaha dengan penghasilan fluktuatif membutuhkan cadangan jauh lebih tebal daripada karyawan tetap tanpa tanggungan.',
  input: [
    { k: 'pengeluaranEsensial', label: 'Pengeluaran esensial per bulan', tipe: 'rupiah', awal: 16000000,
      hint: 'Hanya yang benar-benar harus dibayar bila penghasilan berhenti' },
    { k: 'profil', label: 'Profil penghasilan', tipe: 'pilih', awal: 'menikah-stabil',
      opsi: K.bulanDarurat.map(b => ({ v: b.kode, l: b.label })) },
    { k: 'tersedia', label: 'Dana darurat saat ini', tipe: 'rupiah', awal: 72000000 },
    { k: 'tabunganBulanan', label: 'Kemampuan menabung per bulan', tipe: 'rupiah', awal: 8000000 },
    { k: 'tercampur', label: 'Apakah dana darurat tercampur portofolio investasi?', tipe: 'pilih', awal: 'tidak',
      opsi: [{ v: 'tidak', l: 'Tidak — rekening terpisah' }, { v: 'ya', l: 'Ya — masih menyatu dengan investasi' }] }
  ],
  hitung(v) {
    const baris = K.bulanDarurat.find(b => b.kode === v.profil) || K.bulanDarurat[1];
    const target = v.pengeluaranEsensial * baris.bulan;
    const kekurangan = Math.max(0, target - v.tersedia);
    const bulanTerpenuhi = M.bagi(v.tersedia, v.pengeluaranEsensial);
    const waktuIsi = kekurangan > 0 && v.tabunganBulanan > 0 ? kekurangan / v.tabunganBulanan : 0;
    const cukup = v.tersedia >= target;
    PROFIL.danaDaruratCukup = cukup;

    const pesan = [];
    if (!cukup) pesan.push({ nada: bulanTerpenuhi < 3 ? 'kritis' : 'waspada', judul: 'Dana darurat belum memadai',
      teks: `Tersedia ${F.bulan(bulanTerpenuhi)} pengeluaran esensial dari target ${baris.bulan} bulan. Sebelum ini terpenuhi, rekomendasi investasi agresif diblokir — bukan karena investasi buruk, tetapi karena likuidasi paksa di waktu yang salah menghapus lebih banyak nilai daripada return yang dikejar.` });
    else pesan.push({ nada: 'sehat', judul: 'Fondasi aman', teks: `Dana darurat memenuhi target ${baris.bulan} bulan. Kelebihan di atas target sebaiknya dipindahkan ke instrumen berimbal hasil agar tidak menjadi cash drag.` });
    if (v.tercampur === 'ya') pesan.push({ nada: 'kritis', judul: 'Dana darurat tercampur investasi',
      teks: 'Ini kesalahan yang mahal. Ketika keadaan darurat datang bersamaan dengan pasar turun, Anda terpaksa menjual di harga terburuk. Pisahkan ke rekening atau instrumen pasar uang tersendiri.' });
    pesan.push({ nada: 'info', judul: 'Penempatan', teks: 'Simpan di instrumen pasar uang atau setara kas — bukan rekening tanpa imbal hasil, bukan pula aset volatil. Dana darurat harus tetap menghasilkan sekitar tingkat pasar uang tanpa risiko nilai pokok.' });

    return {
      metrik: [
        { label: 'Target dana darurat', nilai: target, format: 'rupiah', sorot: true, ket: `${baris.bulan} bulan pengeluaran esensial` },
        { label: 'Tersedia saat ini', nilai: v.tersedia, format: 'rupiah', nada: cukup ? 'sehat' : 'waspada' },
        { label: 'Setara', nilai: bulanTerpenuhi, format: 'bulan' },
        { label: 'Kekurangan', nilai: kekurangan, format: 'rupiah', nada: kekurangan > 0 ? 'waspada' : 'sehat' },
        { label: 'Waktu memenuhi', teks: kekurangan > 0 ? F.durasi(waktuIsi / 12) : 'Sudah terpenuhi' },
        { label: 'Imbal hasil bila di pasar uang', nilai: target * K.makro.pasarUang, format: 'rupiah', ket: 'Per tahun' }
      ],
      pesan,
      bilah: { nilai: bulanTerpenuhi, ambang: baris.bulan, naik: true, format: 'bulan' }
    };
  }
},

/* ---------------------------------------------------------- P3 */
{
  id: 'p3-ff', kat: 'personal', kode: 'P3', ikon: '◆',
  nama: 'Angka Kebebasan Finansial',
  ringkas: 'Target nominal, riil setelah inflasi, dan setelah offset arus kas pasif.',
  intro: 'Versi nominal hanya valid bila diperbarui setiap tahun. Dipakai sebagai target statis untuk belasan tahun ke depan, ia menghasilkan kekurangan dana yang besar — sering di atas 60%.',
  input: [
    { k: 'pengeluaranBulanan', label: 'Pengeluaran bulanan saat ini', tipe: 'rupiah', awal: 30000000 },
    { k: 'tahunKeTarget', label: 'Berapa tahun lagi ingin bebas finansial', tipe: 'angka', awal: 13, satuan: 'tahun' },
    { k: 'inflasi', label: 'Asumsi inflasi', tipe: 'persen', awal: 0.04 },
    { k: 'usiaPensiun', label: 'Usia saat mulai menarik dana', tipe: 'angka', awal: 50, satuan: 'tahun' },
    { k: 'penarikanKustom', label: 'Tingkat penarikan', tipe: 'pilih', awal: 'auto', opsi: [
      { v: 'auto', l: 'Otomatis dari usia pensiun' }, { v: '0.03', l: '3,0% — horizon 50+ tahun' },
      { v: '0.035', l: '3,5% — horizon ±35 tahun' }, { v: '0.04', l: '4,0% — horizon ±25 tahun' },
      { v: '0.045', l: '4,5% — agresif' } ]},
    { k: 'pasifBulanan', label: 'Arus kas pasif yang sudah pasti', tipe: 'rupiah', awal: 4000000,
      hint: 'Pensiun, sewa, anuitas — yang berlanjut tanpa Anda bekerja' },
    { k: 'portofolio', label: 'Portofolio investasi saat ini', tipe: 'rupiah', awal: 800000000 }
  ],
  hitung(v) {
    const pr = M.tingkatPenarikan(v.usiaPensiun);
    const wr = v.penarikanKustom === 'auto' ? pr.rate : parseFloat(v.penarikanKustom);
    const nominal = M.ffNominal(v.pengeluaranBulanan, wr);
    const riil = M.ffRiil(v.pengeluaranBulanan, v.tahunKeTarget, v.inflasi, wr);
    const offset = M.offsetAnuitas(v.pasifBulanan, wr);
    const disesuaikan = Math.max(0, riil - offset);
    const aspirasi = riil * 3;
    const selisih = M.bagi(riil - nominal, nominal);
    const progres = M.bagi(v.portofolio, disesuaikan);
    const pengeluaranMasaDepan = v.pengeluaranBulanan * Math.pow(1 + v.inflasi, v.tahunKeTarget);

    return {
      metrik: [
        { label: 'FF nominal', nilai: nominal, format: 'rupiah-ringkas', ket: 'Valid hanya jika diperbarui tiap tahun' },
        { label: 'FF riil (default)', nilai: riil, format: 'rupiah-ringkas', sorot: true, ket: `Pengeluaran ${v.tahunKeTarget} tahun lagi` },
        { label: 'Setelah offset arus kas pasif', nilai: disesuaikan, format: 'rupiah-ringkas', nada: 'sehat' },
        { label: 'Kapitalisasi arus kas pasif', nilai: offset, format: 'rupiah-ringkas', ket: `${F.rpRingkas(v.pasifBulanan)}/bln setara modal ini` },
        { label: 'Target aspirasi (3×)', nilai: aspirasi, format: 'rupiah-ringkas' },
        { label: 'Progres saat ini', nilai: progres, format: 'persen', nada: progres >= .5 ? 'sehat' : progres >= .25 ? 'waspada' : 'kritis' }
      ],
      pesan: [
        { nada: 'waspada', judul: 'Selisih nominal versus riil',
          teks: `Target riil ${F.persen(selisih, 0)} lebih besar daripada nominal. Pengeluaran ${F.rpRingkas(v.pengeluaranBulanan)}/bulan hari ini menjadi ${F.rpRingkas(pengeluaranMasaDepan)}/bulan dalam ${v.tahunKeTarget} tahun pada inflasi ${F.persen(v.inflasi)}. Gunakan angka riil sebagai target kerja.` },
        { nada: 'info', judul: 'Arus kas pasif sering terlewat',
          teks: `Pensiun atau sewa ${F.rpRingkas(v.pasifBulanan)}/bulan setara modal ${F.rpRingkas(offset)}. Mengabaikannya membuat target terlihat jauh lebih berat dari kenyataan — dan bisa mengubah keputusan besar, misalnya apakah meninggalkan pekerjaan bergaransi pensiun.` },
        { nada: 'info', judul: 'Yang tidak tercakup',
          teks: 'Angka ini <b>tidak</b> mencakup dana pendidikan anak, dana kesehatan, haji/umrah, atau pengeluaran tahunan besar. Horizon dan instrumennya berbeda — hitung terpisah di modul Dana Tujuan.' }
      ],
      tabel: { judul: 'Perbandingan varian target', kolom: [
          { k: 'varian', label: 'Varian' }, { k: 'nilai', label: 'Nilai target', n: true, format: 'rupiah' },
          { k: 'ket', label: 'Kapan dipakai' }
        ], baris: [
          { varian: 'FF nominal', nilai: nominal, ket: 'Hanya bila diperbarui setiap tahun' },
          { varian: 'FF riil', nilai: riil, ket: 'Target kerja untuk horizon di atas 5 tahun', _tekan: true },
          { varian: 'FF setelah offset', nilai: disesuaikan, ket: 'Bila arus kas pasif benar-benar pasti berlanjut' },
          { varian: 'FF aspirasi (3×)', nilai: aspirasi, ket: 'Menetapkan target tinggi agar meleset pun tetap di atas kebutuhan' }
        ] },
      narasi: `<p>Tingkat penarikan ${F.persen(wr, 2)} dipilih untuk horizon ${pr.horizon}. Semakin muda Anda mulai menarik, semakin rendah tingkat penarikan yang aman — bukan karena kehati-hatian berlebih, tetapi karena portofolio harus bertahan lebih lama.</p>`
    };
  }
},

/* ---------------------------------------------------------- P4 */
{
  id: 'p4-waktu', kat: 'personal', kode: 'P4', ikon: '◷',
  nama: 'Waktu Menuju Kebebasan Finansial',
  ringkas: 'Proyeksi dengan anuitas yang dikompaunkan benar, lengkap tabel sensitivitas.',
  intro: 'Kesalahan paling sering dan paling mahal di sini: menghitung pertumbuhan modal awal secara majemuk, lalu menambahkan tabungan bulanan begitu saja tanpa dibungakan. Deviasinya mencapai 25–50% pada horizon sepuluh tahun.',
  input: [
    { k: 'portofolio', label: 'Portofolio investasi saat ini', tipe: 'rupiah', awal: 800000000 },
    { k: 'kontribusi', label: 'Investasi rutin per bulan', tipe: 'rupiah', awal: 15000000 },
    { k: 'kenaikanKontribusi', label: 'Kenaikan kontribusi per tahun', tipe: 'persen', awal: 0.05,
      hint: 'Seiring kenaikan penghasilan. Isi 0 bila datar.' },
    { k: 'returnAsumsi', label: 'Asumsi return tahunan', tipe: 'persen', awal: 0.09 },
    { k: 'target', label: 'Target kekayaan', tipe: 'rupiah', awal: 15000000000 }
  ],
  hitung(v) {
    const dasar = M.waktuKeTarget(v.portofolio, v.kontribusi, v.returnAsumsi, v.target);
    // Proyeksi dengan kontribusi menaik
    const rb = M.bulanan(v.returnAsumsi);
    let saldo = v.portofolio, pmt = v.kontribusi, tahunNaik = null;
    const jalur = [{ x: 0, y: saldo }], jalurDatar = [{ x: 0, y: v.portofolio }];
    let saldoDatar = v.portofolio;
    for (let b = 1; b <= 600; b++) {
      saldo = saldo * (1 + rb) + pmt;
      saldoDatar = saldoDatar * (1 + rb) + v.kontribusi;
      if (b % 12 === 0) { pmt *= (1 + v.kenaikanKontribusi); jalur.push({ x: b / 12, y: saldo }); jalurDatar.push({ x: b / 12, y: saldoDatar }); }
      if (tahunNaik === null && saldo >= v.target) tahunNaik = b / 12;
      if (b / 12 > (dasar || 30) + 4 && tahunNaik !== null) break;
    }
    const potong = Math.ceil(Math.max(dasar || 20, tahunNaik || 20)) + 1;
    const sensitif = M.sensitivitasWaktu(v.portofolio, v.kontribusi, v.target);
    const keliru = v.portofolio * Math.pow(1 + v.returnAsumsi, dasar || 10) + v.kontribusi * 12 * (dasar || 10);
    const benar = M.nilaiMasaDepan(v.portofolio, v.kontribusi, rb, Math.round((dasar || 10) * 12));

    const pesan = [];
    if (dasar === null) pesan.push({ nada: 'kritis', judul: 'Target tidak tercapai dalam 60 tahun',
      teks: 'Dengan kombinasi modal, kontribusi, dan return ini, target tidak pernah tercapai. Naikkan kontribusi, turunkan target, atau perpanjang horizon.' });
    const perluCagr = M.cagrDibutuhkan(v.portofolio, v.target, dasar || 15);
    if (sensitif.find(s => s.asumsi === 0.10)?.tahun === null) pesan.push({ nada: 'waspada',
      judul: 'Rentan terhadap asumsi return', teks: 'Target hanya tercapai pada asumsi return tinggi. Rencana yang bergantung pada return di atas rata-rata bukan rencana — itu harapan.' });
    pesan.push({ nada: 'info', judul: 'Kontribusi menaik mengubah banyak hal',
      teks: `Dengan kenaikan kontribusi ${F.persen(v.kenaikanKontribusi)} per tahun, target tercapai dalam ${F.durasi(tahunNaik)} — lebih cepat ${F.durasi((dasar || 0) - (tahunNaik || 0))} dibanding kontribusi datar.` });

    return {
      metrik: [
        { label: 'Kontribusi datar', teks: F.durasi(dasar), sorot: true },
        { label: 'Kontribusi menaik', teks: F.durasi(tahunNaik), nada: 'sehat' },
        { label: 'Target', nilai: v.target, format: 'rupiah-ringkas' },
        { label: 'Return dibutuhkan tanpa tambahan modal', nilai: perluCagr, format: 'persen',
          nada: M.klasifikasiCAGR(perluCagr).nada === 'kritis' ? 'kritis' : '' }
      ],
      pesan,
      grafikHtml: C.garis([
        { nama: 'Kontribusi menaik', titik: jalur.filter(t => t.x <= potong), warna: 'var(--giok)' },
        { nama: 'Kontribusi datar', titik: jalurDatar.filter(t => t.x <= potong), warna: 'var(--kuningan)', putus: true },
        { nama: 'Target', titik: [{ x: 0, y: v.target }, { x: potong, y: v.target }], warna: 'var(--kritis)', tebal: 1.5, putus: true }
      ]),
      grafikJudul: 'Proyeksi pertumbuhan portofolio',
      tabel: { judul: 'Sensitivitas terhadap asumsi return', kolom: [
          { k: 'asumsi', label: 'Asumsi return', n: true, format: 'persen' },
          { k: 'waktu', label: 'Waktu tercapai', n: true },
          { k: 'ket', label: 'Penilaian' }
        ], baris: sensitif.map(s => ({
          asumsi: s.asumsi, waktu: F.durasi(s.tahun),
          ket: s.asumsi === 0 ? 'Tanpa investasi sama sekali'
            : s.asumsi <= 0.08 ? 'Konservatif — layak dijadikan dasar rencana'
            : s.asumsi <= 0.10 ? 'Sesuai rata-rata jangka panjang'
            : 'Optimistis — jangan dijadikan asumsi tunggal',
          _tekan: Math.abs(s.asumsi - v.returnAsumsi) < 0.005
        })) },
      narasi: `<div class="pesan p-info"><span class="ikon">i</span><div><b>Verifikasi metode</b> — Pada horizon ${F.durasi(dasar)}, formula yang benar menghasilkan ${F.rpRingkas(benar)}. Metode keliru yang menambahkan kontribusi tanpa dibungakan menghasilkan ${F.rpRingkas(keliru)} — selisih ${F.persen(Math.abs(benar - keliru) / keliru, 0)}. Sistem ini memakai formula anuitas penuh: FV = PV(1+r)ⁿ + PMT[((1+r)ⁿ − 1)/r].</div></div>`
    };
  }
},

/* ---------------------------------------------------------- P5 */
{
  id: 'p5-kontribusi', kat: 'personal', kode: 'P5', ikon: '↥',
  nama: 'Tabungan Bulanan yang Dibutuhkan',
  ringkas: 'Kebalikan dari proyeksi: target dan horizon ditetapkan, sistem menghitung setoran.',
  intro: 'Angka setoran bulanan jauh lebih dapat ditindaklanjuti daripada target CAGR. Ini yang benar-benar bisa Anda kendalikan.',
  input: [
    { k: 'portofolio', label: 'Modal awal', tipe: 'rupiah', awal: 800000000 },
    { k: 'target', label: 'Target kekayaan', tipe: 'rupiah', awal: 15000000000 },
    { k: 'tahun', label: 'Horizon', tipe: 'angka', awal: 13, satuan: 'tahun' },
    { k: 'returnAsumsi', label: 'Asumsi return tahunan', tipe: 'persen', awal: 0.09 },
    { k: 'penghasilanBulanan', label: 'Penghasilan bulanan', tipe: 'rupiah', awal: 39500000 },
    { k: 'kontribusiSaatIni', label: 'Kontribusi saat ini', tipe: 'rupiah', awal: 15000000 }
  ],
  hitung(v) {
    const perlu = M.kontribusiDibutuhkan(v.portofolio, v.target, v.returnAsumsi, v.tahun);
    const rate = M.bagi(perlu, v.penghasilanBulanan);
    const gap = perlu - v.kontribusiSaatIni;
    const kelipatanPenghasilan = M.bagi(perlu + (PROFIL.pengeluaranBulanan || v.penghasilanBulanan * 0.6), v.penghasilanBulanan);

    const pesan = [];
    if (rate !== null && rate > K.ambang.savingsRateBlokir) pesan.push({ nada: 'kritis',
      judul: 'Savings rate yang dibutuhkan tidak masuk akal',
      teks: `Target ini menuntut ${F.persen(rate)} dari penghasilan Anda disisihkan setiap bulan. Di atas 70%, kombinasi target dan horizon perlu direvisi — atau penghasilan yang harus naik. Rencana yang menuntut hidup dengan ${F.persen(1 - rate)} penghasilan biasanya gagal di bulan ketiga.` });
    else if (rate !== null && rate > 0.5) pesan.push({ nada: 'waspada', judul: 'Sangat menuntut',
      teks: `${F.persen(rate)} dari penghasilan. Mungkin bagi sebagian orang, tetapi periksa apakah horizonnya bisa diperpanjang.` });
    if (gap > 0) pesan.push({ nada: 'info', judul: 'Selisih yang harus ditutup',
      teks: `Anda perlu menambah ${F.rpRingkas(gap)} per bulan dari kontribusi saat ini. Ini bisa datang dari pemangkasan pengeluaran, kenaikan penghasilan, atau kombinasi keduanya — dan hampir selalu lebih mudah dari sisi penghasilan.` });
    else pesan.push({ nada: 'sehat', judul: 'Kontribusi sudah memadai',
      teks: 'Setoran Anda saat ini sudah melampaui yang dibutuhkan. Kelebihan dapat dipakai memperpendek horizon atau menaikkan target.' });

    // Alternatif horizon
    const alt = [8, 10, 13, 15, 20, 25].map(t => ({ t, pmt: M.kontribusiDibutuhkan(v.portofolio, v.target, v.returnAsumsi, t) }));

    return {
      metrik: [
        { label: 'Setoran bulanan dibutuhkan', nilai: perlu, format: 'rupiah', sorot: true },
        { label: 'Savings rate dibutuhkan', nilai: rate, format: 'persen',
          nada: rate === null ? '' : rate > .7 ? 'kritis' : rate > .5 ? 'waspada' : 'sehat' },
        { label: 'Selisih dari sekarang', nilai: gap, format: 'rupiah', nada: gap > 0 ? 'waspada' : 'sehat' },
        { label: 'Penghasilan minimum diperlukan', nilai: v.penghasilanBulanan * (kelipatanPenghasilan || 1), format: 'rupiah',
          ket: 'Agar setoran + biaya hidup tertutup' }
      ],
      pesan,
      tabel: { judul: 'Setoran bulanan menurut horizon', kolom: [
          { k: 't', label: 'Horizon (tahun)', n: true }, { k: 'pmt', label: 'Setoran bulanan', n: true, format: 'rupiah' },
          { k: 'sr', label: '% penghasilan', n: true, format: 'persen' }
        ], baris: alt.map(a => ({ t: a.t, pmt: a.pmt, sr: M.bagi(a.pmt, v.penghasilanBulanan), _tekan: a.t === v.tahun })) },
      narasi: '<p>Perhatikan bagaimana memperpanjang horizon lima tahun sering memangkas setoran bulanan lebih besar daripada menaikkan asumsi return dua poin. Waktu adalah variabel yang paling murah — dan satu-satunya yang benar-benar Anda kendalikan.</p>'
    };
  }
},

/* ---------------------------------------------------------- P6 */
{
  id: 'p6-cagr', kat: 'personal', kode: 'P6', ikon: '⚑',
  nama: 'Return yang Dibutuhkan & Pemeriksa Realitas',
  ringkas: 'Menghitung CAGR yang dituntut target Anda, lalu membandingkannya dengan rekor historis nyata.',
  intro: 'Ekspektasi return sering dibentuk oleh angka yang tidak pernah dicapai siapa pun secara konsisten. Modul ini menolak menyetujui target yang tidak tersedia di pasar mana pun.',
  input: [
    { k: 'nilaiSekarang', label: 'Nilai portofolio saat ini', tipe: 'rupiah', awal: 800000000 },
    { k: 'target', label: 'Target nilai', tipe: 'rupiah', awal: 10000000000 },
    { k: 'tahun', label: 'Horizon', tipe: 'angka', awal: 10, satuan: 'tahun' },
    { k: 'kontribusi', label: 'Setoran rutin bulanan', tipe: 'rupiah', awal: 10000000 }
  ],
  hitung(v) {
    const tanpaSetor = M.cagrDibutuhkan(v.nilaiSekarang, v.target, v.tahun);
    // CAGR dibutuhkan bila ada setoran rutin — cari r yang membuat FV = target
    let lo = -0.5, hi = 2.0, dengan = null;
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2;
      const fv = M.nilaiMasaDepan(v.nilaiSekarang, v.kontribusi, M.bulanan(mid), v.tahun * 12);
      if (fv < v.target) lo = mid; else hi = mid;
    }
    dengan = (lo + hi) / 2;
    const kls = M.klasifikasiCAGR(dengan);
    const B = K.benchmarkReturn;

    const pesan = [{ nada: kls.nada, judul: kls.label, teks: kls.pesan }];
    if (kls.kode === 'blokir' || kls.kode === 'sulit') {
      const horizonBaru = (() => { for (let t = v.tahun; t <= 45; t++) {
        const r = (() => { let a = -0.5, b = 2; for (let i = 0; i < 120; i++) { const m = (a + b) / 2;
          M.nilaiMasaDepan(v.nilaiSekarang, v.kontribusi, M.bulanan(m), t * 12) < v.target ? a = m : b = m; } return (a + b) / 2; })();
        if (r <= 0.10) return t; } return null; })();
      const setoranBaru = M.kontribusiDibutuhkan(v.nilaiSekarang, v.target, 0.10, v.tahun);
      pesan.push({ nada: 'kritis', judul: 'Tiga jalan keluar yang nyata', teks:
        `<b>(a)</b> Perpanjang horizon menjadi ${horizonBaru ? horizonBaru + ' tahun' : 'lebih dari 45 tahun'} pada return wajar 10%. ` +
        `<b>(b)</b> Naikkan setoran menjadi ${F.rpRingkas(setoranBaru)} per bulan. ` +
        `<b>(c)</b> Bangun sumber penghasilan aktif baru — return di atas 15% berkelanjutan hanya datang dari membangun usaha, bukan dari memilih instrumen.` });
    }

    return {
      metrik: [
        { label: 'Return dibutuhkan (dengan setoran)', nilai: dengan, format: 'persen2', sorot: true },
        { label: 'Return dibutuhkan (tanpa setoran)', nilai: tanpaSetor, format: 'persen2' },
        { label: 'Klasifikasi', teks: kls.label, nada: kls.nada },
        { label: 'Kelipatan target', nilai: M.bagi(v.target, v.nilaiSekarang), format: 'kali' }
      ],
      pesan,
      tabel: { judul: 'Perbandingan dengan rekor nyata', kolom: [
          { k: 'sumber', label: 'Sumber return' }, { k: 'rentang', label: 'Rentang tahunan', n: true },
          { k: 'nilai', label: 'Posisi target Anda', html: true }
        ], baris: [
          { sumber: B.indeksGlobal.label, rentang: `${F.persen(B.indeksGlobal.min, 0)}–${F.persen(B.indeksGlobal.max, 0)}`,
            nilai: dengan <= B.indeksGlobal.max ? C.lencana('sehat', 'Tercakup') : C.lencana('netral', 'Di atas ini') },
          { sumber: B.portofolioCampuran.label, rentang: `${F.persen(B.portofolioCampuran.min, 0)}–${F.persen(B.portofolioCampuran.max, 0)}`,
            nilai: dengan <= B.portofolioCampuran.max ? C.lencana('sehat', 'Tercakup') : C.lencana('netral', 'Di atas ini') },
          { sumber: B.praktisiAktif.label, rentang: F.persen(B.praktisiAktif.nilai),
            nilai: dengan <= B.praktisiAktif.nilai ? C.lencana('waspada', 'Setara praktisi terbaik') : C.lencana('netral', 'Di atas ini') },
          { sumber: B.rekorLegendaris.label, rentang: F.persen(B.rekorLegendaris.nilai),
            nilai: dengan <= B.rekorLegendaris.nilai ? C.lencana('kritis', 'Setara rekor legendaris') : C.lencana('kritis', 'Melampaui rekor mana pun') }
        ] },
      narasi: '<p>Jika target Anda menuntut return di atas rekor jangka panjang terbaik yang pernah tercatat, masalahnya bukan pada pemilihan instrumen — melainkan pada targetnya. Menurunkan target atau memperpanjang horizon bukan menyerah; itu membuat rencananya bisa dijalankan.</p>'
    };
  }
},

/* ---------------------------------------------------------- P7 */
{
  id: 'p7-tujuan', kat: 'personal', kode: 'P7', ikon: '◱',
  nama: 'Dana Tujuan & Pencocokan Instrumen',
  ringkas: 'Menghitung biaya masa depan tiap tujuan dan mencocokkan horizon dengan kelas instrumen.',
  intro: 'Kesalahan yang berulang: dana pendidikan berhorizon 16 tahun disimpan di instrumen pasar uang, dan dana kebutuhan 6 bulan disimpan di aset volatil. Keduanya mahal, dengan cara yang berbeda.',
  input: [
    { k: 'daftar', label: 'Daftar tujuan', tipe: 'daftar', kolom: [
        { k: 'nama', label: 'Tujuan', tipe: 'teks', lebar: '2fr' },
        { k: 'biaya', label: 'Biaya hari ini', tipe: 'rupiah' },
        { k: 'tahun', label: 'Tahun lagi', tipe: 'angka' },
        { k: 'terkumpul', label: 'Sudah terkumpul', tipe: 'rupiah' }
      ], awal: [
        { nama: 'Pendidikan anak — S1', biaya: 450000000, tahun: 12, terkumpul: 60000000 },
        { nama: 'Renovasi rumah', biaya: 300000000, tahun: 3, terkumpul: 40000000 },
        { nama: 'Umrah keluarga', biaya: 120000000, tahun: 2, terkumpul: 30000000 },
        { nama: 'Ganti kendaraan', biaya: 350000000, tahun: 6, terkumpul: 0 }
      ] },
    { k: 'inflasi', label: 'Asumsi inflasi umum', tipe: 'persen', awal: 0.04 },
    { k: 'inflasiPendidikan', label: 'Inflasi biaya pendidikan', tipe: 'persen', awal: 0.10,
      hint: 'Berlaku untuk tujuan yang namanya memuat kata "pendidikan" atau "sekolah"' }
  ],
  hitung(v) {
    const baris = (v.daftar || []).map(t => {
      const pakaiPendidikan = /pendidik|sekolah|kuliah|s1|s2/i.test(t.nama || '');
      const inf = pakaiPendidikan ? v.inflasiPendidikan : v.inflasi;
      const biayaDepan = t.biaya * Math.pow(1 + inf, t.tahun);
      const cocok = K.horizon.find(h => t.tahun <= h.maks);
      const pmt = M.kontribusiDibutuhkan(t.terkumpul, biayaDepan, cocok.r, t.tahun);
      const progres = M.bagi(t.terkumpul, biayaDepan);
      return { ...t, inf, biayaDepan, kelas: cocok.kelas, r: cocok.r, pmt, progres };
    });
    const totalPmt = baris.reduce((s, b) => s + (b.pmt || 0), 0);
    const totalDepan = baris.reduce((s, b) => s + b.biayaDepan, 0);
    const totalTerkumpul = baris.reduce((s, b) => s + b.terkumpul, 0);

    const pesan = [{ nada: 'info', judul: 'Total komitmen bulanan',
      teks: `Seluruh tujuan menuntut ${F.rpRingkas(totalPmt)} per bulan. Bandingkan dengan surplus Anda; bila melebihi, prioritaskan tujuan berdasarkan konsekuensi bila gagal — bukan berdasarkan yang paling menarik.` }];
    const panjang = baris.filter(b => b.tahun >= 10);
    if (panjang.length) pesan.push({ nada: 'waspada', judul: 'Waspadai cash drag',
      teks: `${panjang.map(b => `<b>${F.esc(b.nama)}</b>`).join(', ')} berhorizon 10 tahun atau lebih. Menyimpannya di instrumen pasar uang berarti membuang selisih return sekitar ${F.persen(0.10 - 0.045, 1)} per tahun — pada horizon panjang, itu menjadi angka yang besar.` });
    const pendek = baris.filter(b => b.tahun <= 2);
    if (pendek.length) pesan.push({ nada: 'waspada', judul: 'Jangan volatil untuk horizon pendek',
      teks: `${pendek.map(b => `<b>${F.esc(b.nama)}</b>`).join(', ')} dibutuhkan dalam 2 tahun atau kurang. Aset volatil di sini berisiko memaksa Anda menjual di harga terburuk tepat saat dana dibutuhkan.` });

    return {
      metrik: [
        { label: 'Total biaya masa depan', nilai: totalDepan, format: 'rupiah-ringkas', sorot: true },
        { label: 'Sudah terkumpul', nilai: totalTerkumpul, format: 'rupiah-ringkas' },
        { label: 'Setoran bulanan total', nilai: totalPmt, format: 'rupiah' },
        { label: 'Progres keseluruhan', nilai: M.bagi(totalTerkumpul, totalDepan), format: 'persen' }
      ],
      pesan,
      tabel: { judul: 'Rincian per tujuan', kolom: [
          { k: 'nama', label: 'Tujuan' }, { k: 'tahun', label: 'Horizon', n: true },
          { k: 'biaya', label: 'Biaya kini', n: true, format: 'rupiah-ringkas' },
          { k: 'biayaDepan', label: 'Biaya nanti', n: true, format: 'rupiah-ringkas' },
          { k: 'kelas', label: 'Instrumen sesuai' },
          { k: 'pmt', label: 'Setoran / bulan', n: true, format: 'rupiah' },
          { k: 'progres', label: 'Progres', n: true, format: 'persen' }
        ], baris }
    };
  }
},

/* ---------------------------------------------------------- P8 */
{
  id: 'p8-kebocoran', kat: 'personal', kode: 'P8', ikon: '⌁',
  nama: 'Dampak Pengeluaran Besar',
  ringkas: 'Biaya majemuk dari satu pengeluaran besar, plus simulasi pemecahan bertahap.',
  intro: 'Satu kebocoran besar bisa menghapus bertahun-tahun disiplin menabung. Modul ini menunjukkan biaya ekonomi sesungguhnya — bukan hanya angka yang keluar hari ini.',
  input: [
    { k: 'jumlah', label: 'Rencana pengeluaran', tipe: 'rupiah', awal: 300000000 },
    { k: 'sisaHorizon', label: 'Sisa horizon investasi', tipe: 'angka', awal: 15, satuan: 'tahun' },
    { k: 'returnAsumsi', label: 'Asumsi return', tipe: 'persen', awal: 0.09 },
    { k: 'kekayaanBersih', label: 'Kekayaan bersih', tipe: 'rupiah', awal: 1800000000 },
    { k: 'asetLikuid', label: 'Aset likuid', tipe: 'rupiah', awal: 200000000 },
    { k: 'tabunganBulanan', label: 'Tabungan rutin per bulan', tipe: 'rupiah', awal: 15000000 },
    { k: 'danaDarurat', label: 'Dana darurat yang harus dipertahankan', tipe: 'rupiah', awal: 96000000 }
  ],
  hitung(v) {
    const nilaiDepan = v.jumlah * Math.pow(1 + v.returnAsumsi, v.sisaHorizon);
    const porsiNW = M.bagi(v.jumlah, v.kekayaanBersih);
    const porsiLikuid = M.bagi(v.jumlah, v.asetLikuid);
    const setaraTabungan = M.bagi(v.jumlah, v.tabunganBulanan);
    const likuidSisa = v.asetLikuid - v.jumlah;
    const langgarDarurat = likuidSisa < v.danaDarurat;
    const ambangPecah = v.kekayaanBersih * 0.15;
    const perluPecah = v.jumlah > ambangPecah;
    const tahap = perluPecah ? Math.ceil(v.jumlah / Math.max(ambangPecah, 1)) : 1;

    const pesan = [
      { nada: 'waspada', judul: 'Biaya ekonomi sesungguhnya',
        teks: `Pengeluaran ${F.rpRingkas(v.jumlah)} hari ini setara ${F.rpRingkas(nilaiDepan)} pada akhir horizon investasi Anda (${v.sisaHorizon} tahun, return ${F.persen(v.returnAsumsi)}). Ini bukan alasan untuk tidak mengeluarkannya — ini angka yang perlu Anda ketahui sebelum memutuskan.` },
      { nada: 'info', judul: 'Setara berapa lama menabung',
        teks: `Jumlah ini setara ${F.durasi(setaraTabungan / 12)} tabungan rutin Anda, dan ${F.persen(porsiNW)} dari kekayaan bersih.` }
    ];
    if (langgarDarurat) pesan.push({ nada: 'kritis', judul: 'Melanggar batas dana darurat',
      teks: `Setelah pengeluaran ini, aset likuid tersisa ${F.rpRingkas(likuidSisa)} — di bawah dana darurat ${F.rpRingkas(v.danaDarurat)} yang harus dipertahankan. Tunda, kurangi, atau danai dari sumber lain.` });
    if (perluPecah) pesan.push({ nada: 'waspada', judul: 'Pertimbangkan bertahap',
      teks: `Pengeluaran melebihi 15% kekayaan bersih. Memecahnya menjadi ${tahap} tahap selama ${tahap * 6} bulan menjaga likuiditas dan memberi ruang membatalkan bila kondisi berubah.` });

    const skenario = [
      { l: 'Batal sepenuhnya', sisa: v.jumlah, biaya: 0 },
      { l: `Bertahap dalam ${tahap} tahap`, sisa: v.jumlah / 2, biaya: v.jumlah },
      { l: 'Sekaligus sekarang', sisa: 0, biaya: v.jumlah }
    ].map(s => ({ ...s, nilaiDepanTersisa: s.sisa * Math.pow(1 + v.returnAsumsi, v.sisaHorizon) }));

    return {
      metrik: [
        { label: 'Nilai bila tidak dikeluarkan', nilai: nilaiDepan, format: 'rupiah-ringkas', sorot: true,
          ket: `${v.sisaHorizon} tahun majemuk` },
        { label: '% kekayaan bersih', nilai: porsiNW, format: 'persen',
          nada: porsiNW > .2 ? 'kritis' : porsiNW > .15 ? 'waspada' : 'sehat' },
        { label: '% aset likuid', nilai: porsiLikuid, format: 'persen',
          nada: porsiLikuid > .8 ? 'kritis' : porsiLikuid > .5 ? 'waspada' : 'sehat' },
        { label: 'Setara tabungan rutin', teks: F.durasi(setaraTabungan / 12) },
        { label: 'Likuid tersisa', nilai: likuidSisa, format: 'rupiah', nada: langgarDarurat ? 'kritis' : 'sehat' },
        { label: 'Selisih nilai majemuk', nilai: nilaiDepan - v.jumlah, format: 'rupiah-ringkas', ket: 'Yang hilang selain pokoknya' }
      ],
      pesan,
      grafikHtml: C.batang(skenario.map(s => ({
        label: s.l, nilai: s.nilaiDepanTersisa, teks: F.rpRingkas(s.nilaiDepanTersisa),
        warna: s.l === 'Sekaligus sekarang' ? 'var(--kritis)' : s.l === 'Batal sepenuhnya' ? 'var(--sehat)' : 'var(--waspada)'
      })), {}),
      grafikJudul: `Nilai portofolio tambahan pada akhir horizon menurut skenario`
    };
  }
}
];

const KAT_HUTANG = [

/* ---------------------------------------------------------- H1 */
{
  id: 'h1-kesehatan', kat: 'hutang', kode: 'H1', ikon: '⚖',
  nama: 'Kesehatan Hutang',
  ringkas: 'Rasio cicilan, hutang terhadap aset, dan hutang terhadap penghasilan.',
  intro: 'Hutang menggerus savings rate, dan savings rate adalah mesin utamanya. Tiga rasio di sini menentukan apakah rekomendasi investasi boleh diaktifkan.',
  input: [
    { k: 'penghasilanBulanan', label: 'Penghasilan bulanan', tipe: 'rupiah', awal: 39500000 },
    { k: 'cicilanKPR', label: 'Cicilan KPR per bulan', tipe: 'rupiah', awal: 6000000 },
    { k: 'cicilanLain', label: 'Cicilan lain per bulan', tipe: 'rupiah', awal: 3000000,
      hint: 'Kendaraan, KTA, kartu kredit, pinjaman online' },
    { k: 'totalHutang', label: 'Total saldo hutang', tipe: 'rupiah', awal: 727000000 },
    { k: 'totalAset', label: 'Total aset', tipe: 'rupiah', awal: 2310000000 },
    { k: 'tujuanHutang', label: 'Sebagian besar hutang untuk', tipe: 'pilih', awal: 'produktif', opsi: [
      { v: 'produktif', l: 'Aset yang menghasilkan atau mengapresiasi' },
      { v: 'campuran', l: 'Campuran' },
      { v: 'konsumtif', l: 'Konsumsi atau aset terdepresiasi' } ]}
  ],
  hitung(v) {
    const cicilan = v.cicilanKPR + v.cicilanLain;
    const dsr = M.bagi(cicilan, v.penghasilanBulanan);
    const dsrNonKPR = M.bagi(v.cicilanLain, v.penghasilanBulanan);
    const dta = M.bagi(v.totalHutang, v.totalAset);
    const dti = M.bagi(v.totalHutang, v.penghasilanBulanan * 12);
    const A = K.ambang.dsr;
    const statusDSR = dsr === null ? '' : dsr < A.sehat ? 'sehat' : dsr < A.waspada ? 'waspada' : dsr < A.berat ? 'waspada' : 'kritis';
    PROFIL.hutangMahal = v.tujuanHutang === 'konsumtif' && dsrNonKPR > 0.1;

    const pesan = [];
    if (dsr !== null && dsr >= A.berat) pesan.push({ nada: 'kritis', judul: 'Beban cicilan kritis',
      teks: `${F.persen(dsr)} penghasilan habis untuk cicilan. Pada level ini seluruh rekomendasi investasi diblokir: menurunkan cicilan memberi return terjamin sebesar bunga hutangnya, tanpa risiko pasar.` });
    else if (dsr !== null && dsr >= A.waspada) pesan.push({ nada: 'waspada', judul: 'Beban cicilan berat',
      teks: `${F.persen(dsr)} penghasilan untuk cicilan. Prioritaskan pelunasan sebelum menambah eksposur investasi berisiko.` });
    if (dti !== null && dti > 3 && v.tujuanHutang === 'konsumtif') pesan.push({ nada: 'kritis',
      judul: 'Pola hutang berisiko', teks: `Total hutang ${F.angka(dti, 1)}× penghasilan tahunan dan sebagian besar untuk aset yang tidak menghasilkan. Kombinasi ini yang paling sering berakhir pada spiral hutang baru untuk membayar hutang lama.` });
    if (dsrNonKPR !== null && dsrNonKPR > 0.15) pesan.push({ nada: 'waspada', judul: 'Hutang non-hipotek tinggi',
      teks: `${F.persen(dsrNonKPR)} penghasilan untuk cicilan di luar KPR. Ini indikator yang paling cepat memburuk — dan yang paling sering menjadi pintu masuk pinjaman online.` });
    if (dsr !== null && dsr < A.sehat) pesan.push({ nada: 'sehat', judul: 'Beban hutang sehat',
      teks: 'Struktur hutang tidak menghambat pembentukan surplus. Fokus dapat berpindah ke alokasi modal.' });
    else if (dsr !== null && dsr < A.waspada) pesan.push({ nada: 'waspada', judul: 'Beban hutang perlu diawasi',
      teks: `${F.persen(dsr)} penghasilan untuk cicilan — di atas ambang sehat 20% tetapi belum kritis. Pada level ini investasi masih boleh berjalan, dengan catatan tidak menambah cicilan baru. Setiap kenaikan cicilan dari sini langsung menekan savings rate.` });

    return {
      metrik: [
        { label: 'Rasio cicilan (DSR)', nilai: dsr, format: 'persen', nada: statusDSR, sorot: statusDSR === '' },
        { label: 'DSR di luar KPR', nilai: dsrNonKPR, format: 'persen',
          nada: dsrNonKPR === null ? '' : dsrNonKPR <= .15 ? 'sehat' : dsrNonKPR <= .25 ? 'waspada' : 'kritis' },
        { label: 'Hutang / aset', nilai: dta, format: 'persen',
          nada: dta === null ? '' : dta <= .5 ? 'sehat' : dta <= .7 ? 'waspada' : 'kritis' },
        { label: 'Hutang / penghasilan tahunan', nilai: dti, format: 'kali',
          nada: dti === null ? '' : dti <= 2 ? 'sehat' : dti <= 3 ? 'waspada' : 'kritis' },
        { label: 'Total cicilan per bulan', nilai: cicilan, format: 'rupiah' },
        { label: 'Sisa penghasilan setelah cicilan', nilai: v.penghasilanBulanan - cicilan, format: 'rupiah' }
      ],
      pesan,
      tabel: { judul: 'Ambang rujukan', kolom: [
          { k: 'r', label: 'Rasio' }, { k: 's', label: 'Sehat', n: true }, { k: 'w', label: 'Waspada', n: true },
          { k: 'k', label: 'Kritis', n: true }, { k: 'anda', label: 'Posisi Anda', n: true }
        ], baris: [
          { r: 'Rasio cicilan (DSR)', s: '< 20%', w: '20–30%', k: '> 40%', anda: F.persen(dsr) },
          { r: 'DSR non-KPR', s: '≤ 15%', w: '15–25%', k: '> 25%', anda: F.persen(dsrNonKPR) },
          { r: 'Hutang / aset', s: '≤ 50%', w: '50–70%', k: '> 70%', anda: F.persen(dta) },
          { r: 'Hutang / penghasilan', s: '≤ 2×', w: '2–3×', k: '> 3×', anda: F.angka(dti, 1) + '×' }
        ] }
    };
  }
},

/* ---------------------------------------------------------- H2 */
{
  id: 'h2-bunga', kat: 'hutang', kode: 'H2', ikon: '%',
  nama: 'Bunga Efektif Cicilan',
  ringkas: 'Menghitung tarif bunga sesungguhnya dari skema cicilan, memperhitungkan nilai waktu uang.',
  intro: 'Jangan menilai beban bunga dengan membagi total pembayaran dengan pokok. Cara itu mengabaikan bahwa Anda memakai uangnya sejak hari pertama, dan menghasilkan kesimpulan yang keliru — kadang membuat pinjaman wajar terlihat mencekik.',
  input: [
    { k: 'pokok', label: 'Pokok pinjaman', tipe: 'rupiah', awal: 450000000 },
    { k: 'cicilan', label: 'Cicilan per bulan', tipe: 'rupiah', awal: 4500000 },
    { k: 'tenor', label: 'Tenor', tipe: 'angka', awal: 180, satuan: 'bulan' },
    { k: 'sudahBayar', label: 'Sudah dibayar', tipe: 'angka', awal: 24, satuan: 'bulan' },
    { k: 'returnInvestasi', label: 'Ekspektasi return investasi Anda', tipe: 'persen', awal: 0.09 }
  ],
  hitung(v) {
    const be = M.bungaEfektif(v.pokok, v.cicilan, v.tenor);
    if (!be) return { metrik: [], pesan: [{ nada: 'kritis', judul: 'Data tidak valid', teks: 'Periksa kembali pokok, cicilan, dan tenor.' }] };
    const totalBayar = v.cicilan * v.tenor;
    const totalBunga = M.totalBunga(v.cicilan, v.tenor, v.pokok);
    const sisa = M.sisaPokok(v.pokok, be.perPeriode, v.tenor, v.sudahBayar);
    const rasioNaif = M.bagi(totalBunga, v.pokok);
    const lebihMurah = be.tahunan < v.returnInvestasi;

    return {
      metrik: [
        { label: 'Bunga efektif tahunan', nilai: be.tahunan, format: 'persen2', sorot: true },
        { label: 'Bunga efektif per bulan', nilai: be.perPeriode, format: 'persen2' },
        { label: 'Total dibayar sepanjang tenor', nilai: totalBayar, format: 'rupiah' },
        { label: 'Total bunga', nilai: totalBunga, format: 'rupiah' },
        { label: 'Sisa pokok saat ini', nilai: sisa, format: 'rupiah', ket: `Setelah ${v.sudahBayar} bulan` },
        { label: 'Sudah dilunasi', nilai: M.bagi(v.pokok - sisa, v.pokok), format: 'persen' }
      ],
      pesan: [
        { nada: 'info', judul: 'Membaca angkanya dengan benar',
          teks: `Total bunga ${F.rpRingkas(totalBunga)} terlihat sebesar ${F.persen(rasioNaif, 0)} dari pokok — dan inilah angka yang membuat orang panik. Tetapi karena dibayar bertahap selama ${v.tenor} bulan, tarif efektifnya hanya <b>${F.persen(be.tahunan, 2)} per tahun</b>. Keduanya benar secara aritmetika; hanya yang kedua yang berguna untuk mengambil keputusan.` },
        lebihMurah
          ? { nada: 'sehat', judul: 'Bunga di bawah ekspektasi return',
              teks: `Bunga ${F.persen(be.tahunan, 2)} lebih rendah daripada ekspektasi return investasi Anda ${F.persen(v.returnInvestasi)}. Secara matematis murni, menginvestasikan dana berlebih lebih unggul daripada mempercepat pelunasan. Bandingkan skenarionya di modul H3 — tetapi ingat bahwa kepastian punya nilai yang tidak muncul di spreadsheet.` }
          : { nada: 'waspada', judul: 'Bunga di atas ekspektasi return',
              teks: `Bunga ${F.persen(be.tahunan, 2)} melampaui ekspektasi return investasi Anda ${F.persen(v.returnInvestasi)}. Melunasi memberikan return terjamin sebesar bunga itu, tanpa risiko pasar. Ini salah satu dari sedikit "return bebas risiko" yang benar-benar tersedia.` }
      ],
      narasi: '<p>Metode yang dipakai: pencarian bisection atas tarif <i>i</i> yang memenuhi Pokok = Cicilan × [(1 − (1+i)⁻ⁿ) ÷ i], lalu dianualisasi. Ini tarif efektif sesungguhnya, bukan bunga flat yang biasa dikutip di brosur.</p>'
    };
  }
},

/* ---------------------------------------------------------- H3 */
{
  id: 'h3-lunasi', kat: 'hutang', kode: 'H3', ikon: '⇅',
  nama: 'Lunasi Hutang atau Investasikan',
  ringkas: 'Dua skenario dihitung penuh, lalu Anda yang memilih — termasuk faktor non-finansial.',
  intro: 'Sistem menyajikan angkanya; keputusan ini sebagian preferensi, bukan semata optimasi. Melunasi memberi kepastian, menaikkan savings rate permanen, dan menghilangkan beban kognitif yang tidak muncul di spreadsheet mana pun.',
  input: [
    { k: 'danaTersedia', label: 'Dana yang tersedia', tipe: 'rupiah', awal: 200000000 },
    { k: 'sisaHutang', label: 'Sisa pokok hutang', tipe: 'rupiah', awal: 200000000 },
    { k: 'bungaHutang', label: 'Bunga efektif hutang', tipe: 'persen', awal: 0.11 },
    { k: 'cicilanBulanan', label: 'Cicilan bulanan', tipe: 'rupiah', awal: 4500000 },
    { k: 'sisaTenor', label: 'Sisa tenor', tipe: 'angka', awal: 60, satuan: 'bulan' },
    { k: 'returnInvestasi', label: 'Ekspektasi return investasi', tipe: 'persen', awal: 0.09 },
    { k: 'portofolio', label: 'Portofolio saat ini', tipe: 'rupiah', awal: 800000000 },
    { k: 'tabunganRutin', label: 'Tabungan rutin per bulan', tipe: 'rupiah', awal: 10000000 },
    { k: 'horizon', label: 'Horizon perbandingan', tipe: 'angka', awal: 10, satuan: 'tahun' }
  ],
  hitung(v) {
    const n = v.horizon * 12, rb = M.bulanan(v.returnInvestasi);
    const pelunasan = Math.min(v.danaTersedia, v.sisaHutang);
    const bungaHemat = M.totalBunga(v.cicilanBulanan, v.sisaTenor, v.sisaHutang);

    // A: Lunasi — dana dipakai melunasi, cicilan dialihkan ke investasi
    const sisaDana = v.danaTersedia - pelunasan;
    const bulanBebas = v.sisaTenor;
    let saldoA = v.portofolio + sisaDana;
    for (let b = 1; b <= n; b++) {
      const setor = v.tabunganRutin + (b <= bulanBebas ? v.cicilanBulanan : v.cicilanBulanan);
      saldoA = saldoA * (1 + rb) + setor;
    }
    // B: Investasikan — dana masuk portofolio, cicilan tetap berjalan
    let saldoB = v.portofolio + v.danaTersedia;
    for (let b = 1; b <= n; b++) saldoB = saldoB * (1 + rb) + v.tabunganRutin;
    const sisaHutangB = v.sisaTenor > n ? M.sisaPokok(v.sisaHutang, v.bungaHutang / 12, v.sisaTenor, n) : 0;
    const bersihB = saldoB - sisaHutangB;

    const unggul = saldoA >= bersihB ? 'A' : 'B';
    const selisih = Math.abs(saldoA - bersihB);

    return {
      metrik: [
        { label: 'Skenario A — Lunasi', nilai: saldoA, format: 'rupiah-ringkas', nada: unggul === 'A' ? 'sehat' : '' },
        { label: 'Skenario B — Investasikan', nilai: bersihB, format: 'rupiah-ringkas', nada: unggul === 'B' ? 'sehat' : '',
          ket: sisaHutangB > 0 ? `Setelah dikurangi sisa hutang ${F.rpRingkas(sisaHutangB)}` : 'Hutang lunas dalam horizon' },
        { label: 'Selisih', nilai: selisih, format: 'rupiah-ringkas', sorot: true },
        { label: 'Bunga yang dihemat bila melunasi', nilai: bungaHemat, format: 'rupiah' },
        { label: 'Selisih bunga vs return', nilai: v.returnInvestasi - v.bungaHutang, format: 'persen2',
          nada: v.returnInvestasi > v.bungaHutang ? 'sehat' : 'waspada' },
        { label: 'Kenaikan savings rate bila lunas', nilai: v.cicilanBulanan, format: 'rupiah', ket: 'Permanen, setiap bulan' }
      ],
      pesan: [
        { nada: unggul === 'A' ? 'sehat' : 'info',
          judul: unggul === 'A' ? 'Secara angka, melunasi unggul' : 'Secara angka, menginvestasikan unggul',
          teks: `Selisih ${F.rpRingkas(selisih)} setelah ${v.horizon} tahun — sekitar ${F.persen(M.bagi(selisih, Math.max(saldoA, bersihB)), 1)} dari nilai akhir. ${unggul === 'B' ? 'Selisih ini adalah imbalan atas menanggung risiko pasar dan menjaga disiplin selama satu dekade tanpa terputus.' : 'Dan ini sudah sebelum menghitung nilai kepastiannya.'}` },
        { nada: 'info', judul: 'Faktor yang tidak muncul di angka', teks:
          '<b>Melunasi memberi:</b> kepastian penuh, savings rate yang naik permanen, hilangnya beban kognitif, dan ruang bernapas bila penghasilan terganggu. ' +
          '<b>Menginvestasikan memberi:</b> likuiditas yang tetap terjaga dan potensi selisih return — dengan syarat Anda benar-benar konsisten dan tidak menarik dana saat pasar turun. Sebagian besar orang melebih-lebihkan konsistensi dirinya sendiri.' },
        { nada: 'waspada', judul: 'Urutan yang tetap berlaku',
          teks: 'Apa pun pilihannya, urutannya tidak berubah: dana darurat memadai lebih dulu, baru pelunasan atau investasi. Melunasi hutang sampai kas kering hanya memindahkan masalah ke bulan depan.' }
      ],
      grafikHtml: C.batang([
        { label: 'A — Lunasi lalu alihkan cicilan ke investasi', nilai: saldoA, teks: F.rpRingkas(saldoA), warna: unggul === 'A' ? 'var(--sehat)' : 'var(--netral)' },
        { label: 'B — Investasikan, cicilan tetap berjalan', nilai: bersihB, teks: F.rpRingkas(bersihB), warna: unggul === 'B' ? 'var(--sehat)' : 'var(--netral)' }
      ], {}),
      grafikJudul: `Kekayaan bersih setelah ${v.horizon} tahun`
    };
  }
},

/* ---------------------------------------------------------- H4 */
{
  id: 'h4-prioritas', kat: 'hutang', kode: 'H4', ikon: '≡',
  nama: 'Prioritas Pelunasan Multi-Hutang',
  ringkas: 'Membandingkan metode longsor (bunga tertinggi) dan bola salju (saldo terkecil).',
  intro: 'Longsor menghemat lebih banyak bunga. Bola salju memberi kemenangan cepat yang menjaga momentum. Sistem menampilkan selisihnya; Anda memilih berdasarkan mana yang benar-benar akan Anda jalani.',
  input: [
    { k: 'daftar', label: 'Daftar hutang', tipe: 'daftar', kolom: [

        { k: 'saldo', label: 'Sisa saldo', tipe: 'rupiah' },
        { k: 'bunga', label: 'Bunga/tahun', tipe: 'persen' },
        { k: 'cicilan', label: 'Cicilan/bulan', tipe: 'rupiah' }
      ], awal: [

        { nama: 'Pinjaman online', saldo: 9000000, bunga: 0.48, cicilan: 1200000 },
        { nama: 'KTA', saldo: 65000000, bunga: 0.17, cicilan: 2500000 },

      ] },
    { k: 'danaTambahan', label: 'Dana tambahan per bulan', tipe: 'rupiah', awal: 3000000,
      hint: 'Di atas cicilan minimum, untuk mempercepat pelunasan' }
  ],
  hitung(v) {
    const daftar = (v.daftar || []).filter(h => h.saldo > 0);
    const longsor = M.prioritasHutang(daftar, 'longsor');

    const hasilL = M.simulasiPelunasan(longsor, v.danaTambahan);
    const hasilB = M.simulasiPelunasan(bolaSalju, v.danaTambahan);
    const tanpaTambahan = M.simulasiPelunasan(longsor, 0);
    const totalSaldo = daftar.reduce((s, h) => s + h.saldo, 0);
    const totalCicilan = daftar.reduce((s, h) => s + h.cicilan, 0);
    const bungaRerata = M.bagi(daftar.reduce((s, h) => s + h.saldo * h.bunga, 0), totalSaldo);
    const hematBunga = hasilB.totalBunga - hasilL.totalBunga;

    return {
      metrik: [
        { label: 'Total saldo hutang', nilai: totalSaldo, format: 'rupiah', sorot: true },
        { label: 'Bunga rata-rata tertimbang', nilai: bungaRerata, format: 'persen' },
        { label: 'Metode longsor — lunas dalam', teks: F.durasi(hasilL.bulan / 12), nada: 'sehat' },
        { label: 'Metode bola salju — lunas dalam', teks: F.durasi(hasilB.bulan / 12) },
        { label: 'Selisih bunga kedua metode', nilai: hematBunga, format: 'rupiah',
          ket: hematBunga > 0 ? 'Longsor lebih hemat' : 'Praktis setara' },
        { label: 'Tanpa dana tambahan', teks: F.durasi(tanpaTambahan.bulan / 12), nada: 'waspada' }

          teks: `Menambah ${F.rpRingkas(v.danaTambahan)} per bulan memangkas waktu pelunasan dari ${F.durasi(tanpaTambahan.bulan / 12)} menjadi ${F.durasi(hasilL.bulan / 12)}, dan menghemat bunga ${F.rpRingkas(tanpaTambahan.totalBunga - hasilL.totalBunga)}. Setiap rupiah tambahan di sini memberi return terjamin sebesar bunga hutangnya.` },
        { nada: hematBunga > totalSaldo * 0.02 ? 'waspada' : 'info',
          judul: hematBunga > totalSaldo * 0.02 ? 'Selisih metode cukup material' : 'Selisih metode kecil',
          teks: hematBunga > totalSaldo * 0.02
            ? `Longsor menghemat ${F.rpRingkas(hematBunga)} lebih banyak. Bila Anda bisa bertahan tanpa kemenangan cepat, pilih longsor.`
            : `Selisihnya hanya ${F.rpRingkas(Math.abs(hematBunga))}. Pada kasus Anda, pilih metode yang paling mungkin Anda jalani sampai selesai — konsistensi lebih menentukan daripada optimalitas.` },
        { nada: 'kritis', judul: 'Aturan yang tidak boleh dilanggar',
          teks: 'Selama proses pelunasan, jangan menambah hutang baru. Melunasi sambil menambah adalah pola yang membuat orang merasa berjuang selama bertahun-tahun tanpa saldo berkurang.' }
      ],
      tabel: { judul: 'Urutan prioritas — metode longsor (bunga tertinggi lebih dulu)', kolom: [
          { k: 'urut', label: '#', n: true }, { k: 'nama', label: 'Hutang' },
          { k: 'saldo', label: 'Saldo', n: true, format: 'rupiah' },
          { k: 'bunga', label: 'Bunga', n: true, format: 'persen' },
          { k: 'cicilan', label: 'Cicilan', n: true, format: 'rupiah' },
          { k: 'beban', label: 'Bunga/tahun', n: true, format: 'rupiah' }
        ], baris: longsor.map((h, i) => ({ urut: i + 1, ...h, beban: h.saldo * h.bunga, _tekan: i === 0 })) },
      narasi: `<p>Urutan bola salju sebagai pembanding: ${bolaSalju.map((h, i) => `${i + 1}. ${F.esc(h.nama)}`).join(' → ')}. Total cicilan minimum Anda saat ini ${F.rpRingkas(totalCicilan)} per bulan.</p>`
    };
  }
},

{
  id: 'r1-proteksi', kat: 'hutang', kode: 'R1', ikon: '⛊',
  nama: 'Gap Proteksi Jiwa & Kesehatan',
  ringkas: 'Menghitung kebutuhan uang pertanggungan, bukan memilih produk.',
  intro: 'Proteksi adalah gerbang kedua setelah dana darurat. Tanpanya, satu peristiwa dapat menghapus seluruh akumulasi bertahun-tahun — dan memindahkan bebannya ke keluarga.',
  input: [
    { k: 'totalHutang', label: 'Total hutang yang harus dilunasi', tipe: 'rupiah', awal: 727000000 },
    { k: 'biayaKeluargaBulanan', label: 'Biaya hidup keluarga per bulan', tipe: 'rupiah', awal: 18000000,
      hint: 'Yang harus tetap berjalan bila Anda tiada' },
    { k: 'tahunDitanggung', label: 'Berapa tahun keluarga perlu ditopang', tipe: 'angka', awal: 15, satuan: 'tahun' },
    { k: 'danaPendidikan', label: 'Kebutuhan dana pendidikan anak', tipe: 'rupiah', awal: 900000000 },
    { k: 'asetLikuidTersedia', label: 'Aset likuid yang dapat dipakai', tipe: 'rupiah', awal: 200000000 },
    { k: 'pertanggunganAda', label: 'Uang pertanggungan yang sudah dimiliki', tipe: 'rupiah', awal: 500000000 },
    { k: 'plafonKesehatan', label: 'Plafon tahunan asuransi kesehatan', tipe: 'rupiah', awal: 250000000 },
    { k: 'inflasi', label: 'Asumsi inflasi', tipe: 'persen', awal: 0.04 },
    { k: 'returnDana', label: 'Return dana pertanggungan bila diinvestasikan', tipe: 'persen', awal: 0.06 }
  ],
  hitung(v) {
    // Nilai kini dari kebutuhan biaya hidup keluarga (anuitas riil)
    const rRiil = (1 + v.returnDana) / (1 + v.inflasi) - 1;
    const n = v.tahunDitanggung * 12, rb = M.bulanan(rRiil > 0 ? rRiil : 0.0001);
    const pvBiaya = v.biayaKeluargaBulanan * (1 - Math.pow(1 + rb, -n)) / rb;
    const kebutuhan = v.totalHutang + pvBiaya + v.danaPendidikan;
    const tersedia = v.asetLikuidTersedia + v.pertanggunganAda;
    const gap = Math.max(0, kebutuhan - tersedia);
    const kelipatan = M.bagi(kebutuhan, PROFIL.penghasilanBulanan * 12 || v.biayaKeluargaBulanan * 12);

    const pesan = [];
    if (gap > 0) pesan.push({ nada: gap > kebutuhan * 0.5 ? 'kritis' : 'waspada', judul: 'Terdapat gap proteksi',
      teks: `Kekurangan uang pertanggungan ${F.rpRingkas(gap)}. Gunakan asuransi jiwa berjangka murni untuk menutupnya — biayanya jauh lebih kecil daripada produk gabungan proteksi-investasi, dan pemisahan itu memudahkan Anda mengevaluasi keduanya secara jujur.` });
    else pesan.push({ nada: 'sehat', judul: 'Proteksi jiwa memadai',
      teks: 'Kombinasi aset likuid dan pertanggungan sudah menutup kebutuhan. Tinjau ulang setiap kali hutang, jumlah tanggungan, atau biaya hidup berubah signifikan.' });
    if (v.plafonKesehatan < 300000000) pesan.push({ nada: 'waspada', judul: 'Plafon kesehatan perlu ditinjau',
      teks: `Plafon ${F.rpRingkas(v.plafonKesehatan)} per tahun. Biaya perawatan penyakit berat di rumah sakit swasta Indonesia dapat melampaui angka ini dalam satu episode. Periksa juga batas per penyakit, bukan hanya plafon tahunan.` });

    return {
      metrik: [
        { label: 'Total kebutuhan proteksi', nilai: kebutuhan, format: 'rupiah-ringkas', sorot: true },
        { label: 'Sudah tersedia', nilai: tersedia, format: 'rupiah-ringkas' },
        { label: 'Gap pertanggungan', nilai: gap, format: 'rupiah-ringkas', nada: gap > 0 ? 'kritis' : 'sehat' },
        { label: 'Nilai kini biaya keluarga', nilai: pvBiaya, format: 'rupiah-ringkas', ket: `${v.tahunDitanggung} tahun, riil` },
        { label: 'Setara penghasilan tahunan', nilai: kelipatan, format: 'kali' }
      ],
      pesan,
      tabel: { judul: 'Rincian kebutuhan', kolom: [
          { k: 'pos', label: 'Komponen' }, { k: 'nilai', label: 'Nilai', n: true, format: 'rupiah' }, { k: 'ket', label: 'Catatan' }
        ], baris: [
          { pos: 'Pelunasan seluruh hutang', nilai: v.totalHutang, ket: 'Agar tidak berpindah ke ahli waris' },
          { pos: 'Biaya hidup keluarga', nilai: pvBiaya, ket: `${v.tahunDitanggung} tahun, disesuaikan inflasi` },
          { pos: 'Dana pendidikan anak', nilai: v.danaPendidikan, ket: 'Sampai jenjang yang direncanakan' },
          { pos: 'Total kebutuhan', nilai: kebutuhan, ket: '—', _tekan: true },
          { pos: 'Aset likuid tersedia', nilai: -v.asetLikuidTersedia, ket: 'Pengurang' },
          { pos: 'Pertanggungan yang ada', nilai: -v.pertanggunganAda, ket: 'Pengurang' },
          { pos: 'Gap yang harus ditutup', nilai: gap, ket: 'Kebutuhan pertanggungan tambahan', _tekan: true }
        ] },
      narasi: '<p>Modul ini menghitung <i>kebutuhan</i>, bukan merekomendasikan produk. Untuk memilih polis, bandingkan biaya per satuan pertanggungan, pengecualian, masa tunggu, dan reputasi klaim penerbitnya — dan lakukan itu dengan agen yang bersedia menunjukkan ilustrasi tanpa asumsi return yang optimistis.</p>'
    };
  }
}
];
