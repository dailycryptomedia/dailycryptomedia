/* ---------------------------------------------------------- B1 */
{
  id: 'b1-labarugi', kat: 'bisnis', kode: 'B1', ikon: '▦',
  nama: 'Laba Rugi & Margin',
  ringkas: 'Margin kotor, operasional, dan bersih dibandingkan benchmark industri.',
  intro: 'Margin di bawah benchmark industri hampir selalu menandakan masalah sistemik — bukan sekadar bulan yang buruk. Cari penyebabnya di harga atau struktur biaya sebelum menambah cabang.',
  input: [
    { k: 'omset', label: 'Omset bulanan', tipe: 'rupiah', awal: 850000000 },
    { k: 'hpp', label: 'HPP / COGS', tipe: 'rupiah', awal: 340000000 },
    { k: 'gaji', label: 'Gaji & tunjangan', tipe: 'rupiah', awal: 180000000, grup: 'Biaya Operasional' },
    { k: 'pemasaran', label: 'Pemasaran & iklan', tipe: 'rupiah', awal: 60000000, grup: 'Biaya Operasional' },
    { k: 'sewa', label: 'Sewa & utilitas', tipe: 'rupiah', awal: 55000000, grup: 'Biaya Operasional' },
    { k: 'teknologi', label: 'Teknologi & langganan', tipe: 'rupiah', awal: 18000000, grup: 'Biaya Operasional' },
    { k: 'lain', label: 'Administrasi & lain-lain', tipe: 'rupiah', awal: 42000000, grup: 'Biaya Operasional' },
    { k: 'depresiasi', label: 'Depresiasi & amortisasi', tipe: 'rupiah', awal: 25000000, grup: 'Non-Kas' },
    { k: 'bunga', label: 'Beban bunga', tipe: 'rupiah', awal: 12000000, grup: 'Non-Operasional' },
    { k: 'pajak', label: 'Tarif pajak efektif', tipe: 'persen', awal: 0.22, grup: 'Non-Operasional' },
    { k: 'karyawan', label: 'Jumlah karyawan', tipe: 'angka', awal: 24 },
    { k: 'industri', label: 'Industri', tipe: 'pilih', awal: 'fnb-retail', opsi: K.industri.map(i => ({ v: i.kode, l: i.nama })) }
  ],
  hitung(v) {
    const opex = v.gaji + v.pemasaran + v.sewa + v.teknologi + v.lain;
    const labaKotor = v.omset - v.hpp;
    const ebitda = labaKotor - opex;
    const labaOperasi = ebitda - v.depresiasi;
    const sebelumPajak = labaOperasi - v.bunga;
    const labaBersih = sebelumPajak * (1 - v.pajak);
    const gm = M.bagi(labaKotor, v.omset), om = M.bagi(labaOperasi, v.omset), nm = M.bagi(labaBersih, v.omset);
    const ind = K.industri.find(i => i.kode === v.industri);
    const omsetPerKaryawan = M.bagi(v.omset * 12, v.karyawan);
    const opexRasio = M.bagi(opex, v.omset);

    const pesan = [];
    const bandingkan = (nilai, rentang, nama) => {
      if (nilai === null) return null;
      if (nilai < rentang[0] * 0.7) return { nada: 'kritis', judul: `${nama} jauh di bawah industri`,
        teks: `${F.persen(nilai)} versus rentang industri ${F.persen(rentang[0], 0)}–${F.persen(rentang[1], 0)}. Selisih sebesar ini menandakan masalah sistemik pada harga atau struktur biaya, bukan fluktuasi biasa.` };
      if (nilai < rentang[0]) return { nada: 'waspada', judul: `${nama} di bawah industri`,
        teks: `${F.persen(nilai)} versus ${F.persen(rentang[0], 0)}–${F.persen(rentang[1], 0)}. Ada ruang perbaikan sebelum memikirkan ekspansi.` };
      if (nilai > rentang[1] * 1.5) return { nada: 'waspada', judul: `${nama} tidak lazim tinggi`,
        teks: `${F.persen(nilai)} jauh melampaui rentang industri. Periksa kembali apakah seluruh biaya sudah tercatat — terutama gaji pemilik dan depresiasi.` };
      return { nada: 'sehat', judul: `${nama} sehat`, teks: `${F.persen(nilai)}, berada dalam rentang industri ${F.persen(rentang[0], 0)}–${F.persen(rentang[1], 0)}.` };
    };
    [bandingkan(gm, ind.gm, 'Margin kotor'), bandingkan(nm, ind.nm, 'Margin bersih')].forEach(p => p && pesan.push(p));
    if (nm !== null && nm < ind.nm[0] * 0.7) pesan.push({ nada: 'info', judul: 'Langkah berikutnya',
      teks: 'Jalankan modul <b>B8 Simulasi Harga</b> lebih dulu. Kenaikan harga mengalir hampir seluruhnya ke laba, sementara pemangkasan biaya biasanya menemui batas lebih cepat.' });

    return {
      metrik: [
        { label: 'Laba kotor', nilai: labaKotor, format: 'rupiah' },
        { label: 'Margin kotor', nilai: gm, format: 'persen', nada: gm >= ind.gm[0] ? 'sehat' : 'waspada',
          ket: `Industri ${F.persen(ind.gm[0], 0)}–${F.persen(ind.gm[1], 0)}` },
        { label: 'EBITDA', nilai: ebitda, format: 'rupiah' },
        { label: 'Laba bersih', nilai: labaBersih, format: 'rupiah', sorot: true },
        { label: 'Margin bersih', nilai: nm, format: 'persen', nada: nm >= ind.nm[0] ? 'sehat' : 'waspada',
          ket: `Industri ${F.persen(ind.nm[0], 0)}–${F.persen(ind.nm[1], 0)}` },
        { label: 'Omset per karyawan / tahun', nilai: omsetPerKaryawan, format: 'rupiah-ringkas' }
      ],
      pesan,
      tabel: { judul: 'Laporan laba rugi', kolom: [
          { k: 'pos', label: 'Pos' }, { k: 'n', label: 'Bulanan', n: true, format: 'rupiah' },
          { k: 'th', label: 'Tahunan', n: true, format: 'rupiah-ringkas' },
          { k: 'p', label: '% omset', n: true, format: 'persen' }
        ], baris: [
          { pos: 'Omset', n: v.omset, th: v.omset * 12, p: 1 },
          { pos: 'HPP', n: -v.hpp, th: -v.hpp * 12, p: -M.bagi(v.hpp, v.omset) },
          { pos: 'Laba kotor', n: labaKotor, th: labaKotor * 12, p: gm, _tekan: true },
          { pos: 'Gaji & tunjangan', n: -v.gaji, th: -v.gaji * 12, p: -M.bagi(v.gaji, v.omset) },
          { pos: 'Pemasaran', n: -v.pemasaran, th: -v.pemasaran * 12, p: -M.bagi(v.pemasaran, v.omset) },
          { pos: 'Sewa & utilitas', n: -v.sewa, th: -v.sewa * 12, p: -M.bagi(v.sewa, v.omset) },
          { pos: 'Teknologi', n: -v.teknologi, th: -v.teknologi * 12, p: -M.bagi(v.teknologi, v.omset) },
          { pos: 'Administrasi & lain', n: -v.lain, th: -v.lain * 12, p: -M.bagi(v.lain, v.omset) },
          { pos: 'EBITDA', n: ebitda, th: ebitda * 12, p: M.bagi(ebitda, v.omset), _tekan: true },
          { pos: 'Depresiasi', n: -v.depresiasi, th: -v.depresiasi * 12, p: -M.bagi(v.depresiasi, v.omset) },
          { pos: 'Laba operasi', n: labaOperasi, th: labaOperasi * 12, p: om },
          { pos: 'Beban bunga', n: -v.bunga, th: -v.bunga * 12, p: -M.bagi(v.bunga, v.omset) },
          { pos: 'Pajak', n: -(sebelumPajak * v.pajak), th: -(sebelumPajak * v.pajak * 12), p: -M.bagi(sebelumPajak * v.pajak, v.omset) },
          { pos: 'Laba bersih', n: labaBersih, th: labaBersih * 12, p: nm, _tekan: true }
        ] },
      narasi: `<p>Rasio biaya operasional terhadap omset: ${F.persen(opexRasio)}. Pos terbesar adalah ${['gaji', 'pemasaran', 'sewa', 'teknologi', 'lain-lain'][[v.gaji, v.pemasaran, v.sewa, v.teknologi, v.lain].indexOf(Math.max(v.gaji, v.pemasaran, v.sewa, v.teknologi, v.lain))]} — di sinilah sensitivitas penghematan paling besar.</p>`
    };
  }
},

/* ---------------------------------------------------------- B2 */
{
  id: 'b2-bep', kat: 'bisnis', kode: 'B2', ikon: '⊥',
  nama: 'Titik Impas & Margin Kontribusi',
  ringkas: 'Omset minimum untuk menutup biaya tetap, dan margin pengaman Anda.',
  intro: 'Margin kontribusi menentukan seberapa cepat setiap rupiah omset tambahan menjadi laba. Ini angka yang menentukan apakah menaikkan volume masuk akal, atau justru memperbesar kerugian.',
  input: [
    { k: 'harga', label: 'Harga jual per unit', tipe: 'rupiah', awal: 35000 },
    { k: 'biayaVariabel', label: 'Biaya variabel per unit', tipe: 'rupiah', awal: 25000,
      hint: 'Bahan, kemasan, komisi — yang naik seiring volume' },
    { k: 'biayaTetap', label: 'Biaya tetap bulanan', tipe: 'rupiah', awal: 180000000,
      hint: 'Sewa, gaji tetap, langganan — yang tetap ada meski tidak berjualan' },
    { k: 'volume', label: 'Volume penjualan bulanan', tipe: 'angka', awal: 26000, satuan: 'unit' }
  ],
  hitung(v) {
    const mk = v.harga - v.biayaVariabel;
    const mkPersen = M.bagi(mk, v.harga);
    const bepUnit = M.bagi(v.biayaTetap, mk);
    const bepOmset = M.bagi(v.biayaTetap, mkPersen);
    const omset = v.harga * v.volume;
    const laba = mk * v.volume - v.biayaTetap;
    const marginAman = M.bagi(omset - (bepOmset || 0), omset);
    const leverageOperasi = M.bagi(mk * v.volume, laba);

    const pesan = [];
    if (mk <= 0) pesan.push({ nada: 'kritis', judul: 'Margin kontribusi negatif',
      teks: 'Setiap unit yang terjual menambah kerugian. Menaikkan volume akan memperburuk keadaan. Perbaiki harga atau biaya variabel sebelum melakukan apa pun yang lain.' });
    if (marginAman !== null && marginAman < 0.2 && marginAman > 0) pesan.push({ nada: 'waspada', judul: 'Margin pengaman tipis',
      teks: `Omset hanya ${F.persen(marginAman)} di atas titik impas. Penurunan penjualan sebesar itu membuat bisnis merugi. Pada struktur biaya seperti ini, memperbesar biaya tetap sangat berbahaya.` });
    if (!pesan.length && laba > 0) pesan.push({ nada: 'sehat', judul: 'Struktur biaya sehat',
      teks: `Margin kontribusi ${F.persen(mkPersen)} dan margin pengaman ${F.persen(marginAman)}. Setiap unit tambahan di atas titik impas menyumbang ${F.rp(mk)} langsung ke laba. Ini kondisi di mana menaikkan volume benar-benar masuk akal.` });
    if (leverageOperasi !== null && leverageOperasi > 4 && laba > 0) pesan.push({ nada: 'info', judul: 'Leverage operasi tinggi',
      teks: `Leverage operasi ${F.angka(leverageOperasi, 1)}× — kenaikan omset 10% menaikkan laba sekitar ${F.persen(leverageOperasi * 0.1, 0)}. Pedang bermata dua: penurunan omset berdampak sama besarnya ke arah sebaliknya.` });

    // Sensitivitas volume
    const sens = [-0.2, -0.1, 0, 0.1, 0.2, 0.3].map(d => {
      const vol = v.volume * (1 + d);
      return { d, vol, omset: v.harga * vol, laba: mk * vol - v.biayaTetap };
    });

    return {
      metrik: [
        { label: 'Margin kontribusi / unit', nilai: mk, format: 'rupiah', nada: mk <= 0 ? 'kritis' : '' },
        { label: 'Margin kontribusi %', nilai: mkPersen, format: 'persen', sorot: true },
        { label: 'Titik impas (unit)', nilai: bepUnit, format: 'bulat', ket: 'Per bulan' },
        { label: 'Titik impas (omset)', nilai: bepOmset, format: 'rupiah' },
        { label: 'Laba bulanan saat ini', nilai: laba, format: 'rupiah', nada: laba > 0 ? 'sehat' : 'kritis' },
        { label: 'Margin pengaman', nilai: marginAman, format: 'persen',
          nada: marginAman === null ? '' : marginAman >= .3 ? 'sehat' : marginAman >= .15 ? 'waspada' : 'kritis' }
      ],
      pesan,
      tabel: { judul: 'Sensitivitas terhadap volume', kolom: [
          { k: 'perubahan', label: 'Perubahan volume' }, { k: 'vol', label: 'Unit', n: true, format: 'bulat' },
          { k: 'omset', label: 'Omset', n: true, format: 'rupiah' }, { k: 'laba', label: 'Laba', n: true, format: 'rupiah' },
          { k: 'delta', label: 'Perubahan laba', n: true }
        ], baris: sens.map(s => ({
          perubahan: (s.d > 0 ? '+' : '') + F.persen(s.d, 0), vol: s.vol, omset: s.omset, laba: s.laba,
          delta: s.d === 0 ? '—' : (s.laba > laba ? '+' : '') + F.persen(M.bagi(s.laba - laba, Math.abs(laba)), 0),
          _tekan: s.d === 0
        })) }
    };
  }
},

/* ---------------------------------------------------------- B3 */
{
  id: 'b3-modalkerja', kat: 'bisnis', kode: 'B3', ikon: '◫',
  nama: 'Modal Kerja & Runway',
  ringkas: 'Kebutuhan modal kerja dari siklus kas, dan berapa lama kas bertahan.',
  intro: 'Runway bisnis harus dipisahkan tegas dari dana darurat pribadi. Mencampurnya berarti satu masalah bisnis langsung menjadi masalah keluarga.',
  input: [
    { k: 'piutang', label: 'Piutang usaha', tipe: 'rupiah', awal: 420000000 },
    { k: 'persediaan', label: 'Persediaan', tipe: 'rupiah', awal: 380000000 },
    { k: 'hutangUsaha', label: 'Hutang usaha ke pemasok', tipe: 'rupiah', awal: 260000000 },
    { k: 'omsetBulanan', label: 'Omset bulanan', tipe: 'rupiah', awal: 850000000 },
    { k: 'hppBulanan', label: 'HPP bulanan', tipe: 'rupiah', awal: 340000000 },
    { k: 'kasBisnis', label: 'Kas usaha tersedia', tipe: 'rupiah', awal: 250000000 },
    { k: 'burnBulanan', label: 'Biaya operasional tetap per bulan', tipe: 'rupiah', awal: 355000000 },
    { k: 'targetRunway', label: 'Target runway', tipe: 'angka', awal: 6, satuan: 'bulan' }
  ],
  hitung(v) {
    const modalKerja = v.piutang + v.persediaan - v.hutangUsaha;
    const dso = M.bagi(v.piutang, v.omsetBulanan) * 30;
    const dio = M.bagi(v.persediaan, v.hppBulanan) * 30;
    const dpo = M.bagi(v.hutangUsaha, v.hppBulanan) * 30;
    const siklusKas = dso + dio - dpo;
    const runway = M.bagi(v.kasBisnis, v.burnBulanan);
    const targetKas = v.burnBulanan * v.targetRunway;
    const gapKas = Math.max(0, targetKas - v.kasBisnis);
    const perputaranPersediaan = M.bagi(v.hppBulanan * 12, v.persediaan);
    PROFIL.modalKerjaAman = runway >= v.targetRunway;

    const pesan = [];
    if (runway !== null && runway < 3) pesan.push({ nada: 'kritis', judul: 'Runway kritis',
      teks: `Kas usaha hanya menutup ${F.bulan(runway)} biaya operasional. Pada level ini, seluruh rencana ekspansi dan seluruh penarikan dana ke pribadi harus dihentikan sampai kas dipulihkan.` });
    else if (runway !== null && runway < v.targetRunway) pesan.push({ nada: 'waspada', judul: 'Runway di bawah target',
      teks: `${F.bulan(runway)} versus target ${v.targetRunway} bulan. Kekurangan ${F.rpRingkas(gapKas)}. Prioritaskan menutup ini sebelum reinvestasi apa pun.` });
    else pesan.push({ nada: 'sehat', judul: 'Runway memadai', teks: `${F.bulan(runway)} biaya operasional tertutup kas.` });
    if (siklusKas > 60) pesan.push({ nada: 'waspada', judul: 'Siklus konversi kas panjang',
      teks: `${F.angka(siklusKas, 0)} hari antara mengeluarkan uang dan menerimanya kembali. Setiap 10 hari pemendekan membebaskan sekitar ${F.rpRingkas(v.omsetBulanan / 30 * 10)} kas — sering lebih murah daripada mencari pinjaman modal kerja.` });
    if (dso > 45) pesan.push({ nada: 'waspada', judul: 'Penagihan lambat',
      teks: `Rata-rata ${F.angka(dso, 0)} hari untuk menagih. Memperketat termin atau memberi diskon pembayaran cepat sering merupakan sumber modal kerja termurah yang tersedia.` });

    return {
      metrik: [
        { label: 'Kebutuhan modal kerja', nilai: modalKerja, format: 'rupiah', sorot: true },
        { label: 'Siklus konversi kas', teks: F.angka(siklusKas, 0) + ' hari',
          nada: siklusKas > 60 ? 'waspada' : 'sehat' },
        { label: 'Runway', nilai: runway, format: 'bulan',
          nada: runway === null ? '' : runway >= v.targetRunway ? 'sehat' : runway >= 3 ? 'waspada' : 'kritis' },
        { label: 'Kas target', nilai: targetKas, format: 'rupiah', ket: `${v.targetRunway} bulan operasional` },
        { label: 'Kekurangan kas', nilai: gapKas, format: 'rupiah', nada: gapKas > 0 ? 'waspada' : 'sehat' },
        { label: 'Perputaran persediaan', nilai: perputaranPersediaan, format: 'kali', ket: 'Per tahun' }
      ],
      pesan,
      tabel: { judul: 'Komponen siklus kas', kolom: [
          { k: 'k', label: 'Komponen' }, { k: 'hari', label: 'Hari', n: true }, { k: 'arti', label: 'Arti' }
        ], baris: [
          { k: 'Piutang (DSO)', hari: F.angka(dso, 0), arti: 'Waktu menagih pelanggan' },
          { k: 'Persediaan (DIO)', hari: F.angka(dio, 0), arti: 'Waktu barang mengendap' },
          { k: 'Hutang pemasok (DPO)', hari: '−' + F.angka(dpo, 0), arti: 'Waktu Anda dibiayai pemasok' },
          { k: 'Siklus konversi kas', hari: F.angka(siklusKas, 0), arti: 'Uang Anda terkunci selama ini', _tekan: true }
        ] }
    };
  }
},

/* ---------------------------------------------------------- B4 */
{
  id: 'b4-gajipemilik', kat: 'bisnis', kode: 'B4', ikon: '◐',
  nama: 'Gaji Pemilik & Distribusi',
  ringkas: 'Berapa maksimal yang boleh ditarik tanpa melumpuhkan operasional.',
  intro: 'Pola paling merusak: menarik uang perusahaan untuk membeli aset investasi pribadi, lalu perusahaan berhutang untuk modal kerja. Itu alokasi modal terbalik, dan biayanya nyata.',
  input: [
    { k: 'labaBersihBulanan', label: 'Laba bersih bulanan', tipe: 'rupiah', awal: 105000000 },
    { k: 'kebutuhanPribadi', label: 'Kebutuhan pribadi minimum', tipe: 'rupiah', awal: 22000000 },
    { k: 'cadanganTarget', label: 'Target cadangan kas usaha', tipe: 'rupiah', awal: 2130000000,
      hint: 'Umumnya 6 bulan biaya operasional' },
    { k: 'cadanganSaatIni', label: 'Cadangan kas usaha saat ini', tipe: 'rupiah', awal: 250000000 },
    { k: 'modalPertumbuhan', label: 'Kebutuhan modal pertumbuhan 12 bulan', tipe: 'rupiah', awal: 300000000 },
    { k: 'ditarikSaatIni', label: 'Yang ditarik saat ini per bulan', tipe: 'rupiah', awal: 45000000 },
    { k: 'usahaBerhutang', label: 'Usaha memakai hutang untuk modal kerja?', tipe: 'pilih', awal: 'ya',
      opsi: [{ v: 'tidak', l: 'Tidak' }, { v: 'ya', l: 'Ya' }] },
    { k: 'bungaHutangUsaha', label: 'Bunga hutang modal kerja', tipe: 'persen', awal: 0.14 },
    { k: 'returnInvestasiPribadi', label: 'Return investasi pribadi Anda', tipe: 'persen', awal: 0.09 }
  ],
  hitung(v) {
    const gapCadangan = Math.max(0, v.cadanganTarget - v.cadanganSaatIni);
    const alokasiCadangan = Math.min(v.labaBersihBulanan * 0.5, gapCadangan / 12);
    const alokasiPertumbuhan = v.modalPertumbuhan / 12;
    const maksTarik = Math.max(0, v.labaBersihBulanan - alokasiCadangan - alokasiPertumbuhan);
    const disarankan = Math.min(maksTarik, Math.max(v.kebutuhanPribadi, maksTarik));
    const kelebihan = v.ditarikSaatIni - maksTarik;
    const anomali = v.usahaBerhutang === 'ya' && v.ditarikSaatIni > v.kebutuhanPribadi;
    const biayaAnomali = anomali ? (v.ditarikSaatIni - v.kebutuhanPribadi) * 12 * (v.bungaHutangUsaha - v.returnInvestasiPribadi) : 0;

    const pesan = [];
    if (anomali) pesan.push({ nada: 'kritis', judul: 'Alokasi modal terbalik',
      teks: `Anda menarik ${F.rpRingkas(v.ditarikSaatIni)} per bulan sambil usaha membiayai modal kerja dengan hutang berbunga ${F.persen(v.bungaHutangUsaha)}. Uang keluar dengan return ${F.persen(v.returnInvestasiPribadi)} sementara uang masuk berbiaya ${F.persen(v.bungaHutangUsaha)}. Selisih ${F.persen(v.bungaHutangUsaha - v.returnInvestasiPribadi)} per tahun adalah kerugian bersih senilai ${F.rpRingkas(biayaAnomali)} per tahun.` });
    if (kelebihan > 0) pesan.push({ nada: 'waspada', judul: 'Penarikan melebihi kapasitas',
      teks: `Penarikan berkelanjutan maksimal ${F.rpRingkas(maksTarik)}. Kelebihan ${F.rpRingkas(kelebihan)} per bulan diambil dari kas yang sebenarnya dibutuhkan untuk cadangan dan pertumbuhan.` });
    if (gapCadangan > 0) pesan.push({ nada: 'info', judul: 'Cadangan belum penuh',
      teks: `Kekurangan cadangan ${F.rpRingkas(gapCadangan)}. Dengan alokasi ${F.rpRingkas(alokasiCadangan)} per bulan, target tercapai dalam ${F.durasi(gapCadangan / Math.max(alokasiCadangan, 1) / 12)}.` });

    return {
      metrik: [
        { label: 'Penarikan maksimal berkelanjutan', nilai: maksTarik, format: 'rupiah', sorot: true },
        { label: 'Yang ditarik saat ini', nilai: v.ditarikSaatIni, format: 'rupiah',
          nada: kelebihan > 0 ? 'kritis' : 'sehat' },
        { label: 'Kebutuhan pribadi minimum', nilai: v.kebutuhanPribadi, format: 'rupiah' },
        { label: 'Alokasi cadangan / bulan', nilai: alokasiCadangan, format: 'rupiah' },
        { label: 'Alokasi pertumbuhan / bulan', nilai: alokasiPertumbuhan, format: 'rupiah' },
        { label: 'Biaya alokasi terbalik / tahun', nilai: biayaAnomali, format: 'rupiah',
          nada: biayaAnomali > 0 ? 'kritis' : 'sehat' }
      ],
      pesan,
      grafikHtml: C.batang([
        { label: 'Cadangan kas usaha', nilai: alokasiCadangan, teks: F.rpRingkas(alokasiCadangan), warna: 'var(--giok)' },
        { label: 'Modal pertumbuhan', nilai: alokasiPertumbuhan, teks: F.rpRingkas(alokasiPertumbuhan), warna: 'var(--tinta-3)' },
        { label: 'Tersedia untuk pemilik', nilai: maksTarik, teks: F.rpRingkas(maksTarik), warna: 'var(--kuningan)' }
      ], {}),
      grafikJudul: `Pembagian laba bersih bulanan ${F.rpRingkas(v.labaBersihBulanan)}`,
      narasi: '<p>Gaji pemilik ditetapkan sebesar kebutuhan hidup, bukan sebesar yang tersedia. Selisih antara keduanya adalah modal yang bekerja untuk Anda di dalam usaha — di mana ROIC-nya, selama bisnis masih lapar modal, hampir pasti melampaui apa pun yang bisa Anda beli di pasar.</p>'
    };
  }
},

/* ---------------------------------------------------------- B5 */
{
  id: 'b5-roic', kat: 'bisnis', kode: 'B5', ikon: '⟳',
  nama: 'ROIC — Reinvestasi versus Investasi Pasar',
  ringkas: 'Membandingkan return setiap opsi penggunaan modal, termasuk uji kejenuhan bisnis.',
  intro: 'Ini kalkulator inti bagi pemilik usaha. Setiap surplus harus masuk ke penggunaan dengan return terbaik yang disesuaikan risiko — dan selama bisnis masih menyerap modal secara produktif, jawabannya jarang berada di pasar modal.',
  input: [
    { k: 'daftar', label: 'Opsi penggunaan modal', tipe: 'daftar', kolom: [
        { k: 'nama', label: 'Opsi', tipe: 'teks', lebar: '2fr' },
        { k: 'modal', label: 'Modal dibutuhkan', tipe: 'rupiah' },
        { k: 'labaTambahan', label: 'Laba tambahan/bulan', tipe: 'rupiah' },
        { k: 'peluang', label: 'Peluang berhasil', tipe: 'persen' }
      ], awal: [
        { nama: 'Rekrut tim penjualan', modal: 100000000, labaTambahan: 25000000, peluang: 0.7 },
        { nama: 'Naikkan anggaran iklan', modal: 50000000, labaTambahan: 8500000, peluang: 0.75 },
        { nama: 'Buka cabang baru', modal: 450000000, labaTambahan: 38000000, peluang: 0.55 },
        { nama: 'Otomasi operasional', modal: 120000000, labaTambahan: 9000000, peluang: 0.85 }
      ] },
    { k: 'returnPasar', label: 'Return pasar sebagai pembanding', tipe: 'persen', awal: 0.10 },
    { k: 'modalTersedia', label: 'Modal yang tersedia', tipe: 'rupiah', awal: 400000000 }
  ],
  hitung(v) {
    const opsi = (v.daftar || []).map(o => {
      const roic = M.bagi(o.labaTambahan * 12, o.modal);
      const roicRisiko = roic === null ? null : roic * o.peluang;
      const payback = M.bagi(o.modal, o.labaTambahan);
      const prioritas = roicRisiko === null ? 'na'
        : roicRisiko > v.returnPasar * 1.5 ? 'reinvestasi'
        : roicRisiko > v.returnPasar * 1.2 ? 'pertimbangkan' : 'pasar';
      return { ...o, roic, roicRisiko, payback, prioritas };
    }).sort((a, b) => (b.roicRisiko || 0) - (a.roicRisiko || 0));

    opsi.push({ nama: 'Portofolio pasar (pembanding)', modal: v.modalTersedia,
      labaTambahan: v.modalTersedia * v.returnPasar / 12, peluang: 1,
      roic: v.returnPasar, roicRisiko: v.returnPasar, payback: null, prioritas: 'pasar' });

    const roicMarginal = Math.max(...opsi.filter(o => o.prioritas !== 'na' && o.nama.indexOf('pembanding') < 0).map(o => o.roicRisiko || 0));
    const jenuh = roicMarginal <= v.returnPasar * 1.2;
    PROFIL.roicBisnis = roicMarginal;

    // Alokasi modal berurutan
    let sisa = v.modalTersedia;
    const alokasi = opsi.filter(o => o.prioritas === 'reinvestasi' || o.prioritas === 'pertimbangkan').map(o => {
      const beri = Math.min(sisa, o.modal); sisa -= beri;
      return { nama: o.nama, beri, roic: o.roicRisiko };
    }).filter(a => a.beri > 0);
    if (sisa > 0) alokasi.push({ nama: 'Portofolio pasar', beri: sisa, roic: v.returnPasar });

    const pesan = [];
    if (jenuh) pesan.push({ nada: 'sehat', judul: 'Bisnis mendekati jenuh',
      teks: `ROIC marginal terbaik ${F.persen(roicMarginal)} sudah berada di bawah 1,2× return pasar. Ini titik di mana diversifikasi ke aset finansial menjadi rasional — bukan sebelumnya.` });
    else pesan.push({ nada: 'waspada', judul: 'Bisnis masih lapar modal',
      teks: `ROIC marginal ${F.persen(roicMarginal)} versus return pasar ${F.persen(v.returnPasar)}. Setiap rupiah yang dialihkan ke pasar hari ini adalah selisih ${F.persen(roicMarginal - v.returnPasar)} per tahun yang Anda tinggalkan. Amankan modal kerja dan cadangan, lalu reinvestasi.` });
    const terlaluBagus = opsi.find(o => (o.roic || 0) > 3 && o.nama.indexOf('pembanding') < 0);
    if (terlaluBagus) pesan.push({ nada: 'waspada', judul: 'Verifikasi angka yang terlalu bagus',
      teks: `<b>${F.esc(terlaluBagus.nama)}</b> menunjukkan ROIC ${F.persen(terlaluBagus.roic)}. Periksa apakah seluruh modal sudah dihitung — termasuk modal kerja tambahan, waktu Anda, dan biaya yang muncul belakangan. ROIC yang terlihat mustahil biasanya memang mustahil.` });

    return {
      metrik: [
        { label: 'ROIC marginal terbaik', nilai: roicMarginal, format: 'persen', sorot: true },
        { label: 'Return pasar pembanding', nilai: v.returnPasar, format: 'persen' },
        { label: 'Status bisnis', teks: jenuh ? 'Mendekati jenuh' : 'Masih menyerap modal',
          nada: jenuh ? 'waspada' : 'sehat' },
        { label: 'Keputusan', teks: jenuh ? 'Mulai diversifikasi' : 'Reinvestasi', nada: 'sehat' }
      ],
      pesan,
      tabel: { judul: 'Peringkat opsi alokasi modal', kolom: [
          { k: 'nama', label: 'Opsi' }, { k: 'modal', label: 'Modal', n: true, format: 'rupiah-ringkas' },
          { k: 'roic', label: 'ROIC', n: true, format: 'persen' },
          { k: 'peluang', label: 'Peluang', n: true, format: 'persen' },
          { k: 'roicRisiko', label: 'ROIC × peluang', n: true, format: 'persen' },
          { k: 'paybackT', label: 'Payback', n: true },
          { k: 'st', label: 'Prioritas', html: true }
        ], baris: opsi.map(o => ({ ...o, paybackT: o.payback ? F.angka(o.payback, 0) + ' bln' : '—',
          st: { reinvestasi: C.lencana('sehat', '1 — Reinvestasi'), pertimbangkan: C.lencana('waspada', '2 — Pertimbangkan'),
                pasar: C.lencana('netral', '3 — Pasar'), na: C.lencana('netral', '—') }[o.prioritas] })) },
      grafikHtml: C.batang(alokasi.map(a => ({
        label: `${a.nama} — ROIC ${F.persen(a.roic)}`, nilai: a.beri, teks: F.rpRingkas(a.beri),
        warna: a.nama === 'Portofolio pasar' ? 'var(--netral)' : 'var(--giok)'
      })), {}),
      grafikJudul: `Usulan alokasi modal ${F.rpRingkas(v.modalTersedia)}`,
      narasi: '<p>Urutan efisiensi penggunaan laba bersih: <b>(1)</b> reinvestasi ke bisnis sendiri selama ROIC tinggi, <b>(2)</b> akuisisi bisnis sejenis ketika kas sudah gemuk, <b>(3)</b> distribusi ke pribadi, <b>(4)</b> buyback — hanya relevan untuk perusahaan terbuka. Ini berlaku selama modal kerja dan cadangan kas sudah aman.</p>'
    };
  }
},

/* ---------------------------------------------------------- B6 */
{
  id: 'b6-ekspansi', kat: 'bisnis', kode: 'B6', ikon: '⊞',
  nama: 'Ekspansi Cabang — Payback, NPV, IRR',
  ringkas: 'Kelayakan unit baru lengkap dengan masa ramp-up, kanibalisasi, dan probabilitas gagal.',
  intro: 'Menggandakan unit dengan margin buruk hanya menggandakan masalah. Bila margin masih di bawah benchmark industri, optimasi unit yang ada hampir selalu memberi return lebih tinggi dengan risiko jauh lebih rendah.',
  input: [
    { k: 'capex', label: 'Modal awal (capex)', tipe: 'rupiah', awal: 450000000 },
    { k: 'modalKerjaAwal', label: 'Modal kerja awal', tipe: 'rupiah', awal: 120000000 },
    { k: 'omsetMatang', label: 'Omset bulanan saat matang', tipe: 'rupiah', awal: 320000000 },
    { k: 'marginKotor', label: 'Margin kotor', tipe: 'persen', awal: 0.60 },
    { k: 'opexBulanan', label: 'Biaya operasional bulanan', tipe: 'rupiah', awal: 145000000 },
    { k: 'rampUp', label: 'Masa mencapai omset matang', tipe: 'angka', awal: 8, satuan: 'bulan' },
    { k: 'kanibalisasi', label: 'Kanibalisasi unit lama', tipe: 'persen', awal: 0.12 },
    { k: 'peluangGagal', label: 'Probabilitas gagal', tipe: 'persen', awal: 0.25 },
    { k: 'diskonto', label: 'Tingkat diskonto', tipe: 'persen', awal: 0.15 },
    { k: 'horizon', label: 'Horizon analisis', tipe: 'angka', awal: 5, satuan: 'tahun' }
  ],
  hitung(v) {
    const modalTotal = v.capex + v.modalKerjaAwal;
    const labaMatang = v.omsetMatang * v.marginKotor * (1 - v.kanibalisasi) - v.opexBulanan;
    // Arus kas tahunan dengan ramp-up di tahun pertama
    const arus = [-modalTotal];
    for (let t = 1; t <= v.horizon; t++) {
      let tahunan = 0;
      for (let b = 1; b <= 12; b++) {
        const bulanKe = (t - 1) * 12 + b;
        const faktor = Math.min(1, bulanKe / v.rampUp);
        tahunan += v.omsetMatang * faktor * v.marginKotor * (1 - v.kanibalisasi) - v.opexBulanan;
      }
      arus.push(tahunan);
    }
    const npv = M.npv(v.diskonto, arus);
    const irr = M.irr(arus);
    const npvTertimbang = npv * (1 - v.peluangGagal) - modalTotal * v.peluangGagal;
    const roic = M.bagi(labaMatang * 12, modalTotal);
    const payback = M.payback(modalTotal, labaMatang * 12);
    // Bulan impas kumulatif
    let kum = -modalTotal, bulanImpas = null;
    for (let b = 1; b <= v.horizon * 12; b++) {
      kum += v.omsetMatang * Math.min(1, b / v.rampUp) * v.marginKotor * (1 - v.kanibalisasi) - v.opexBulanan;
      if (kum >= 0 && bulanImpas === null) { bulanImpas = b; break; }
    }

    const pesan = [];
    if (labaMatang <= 0) pesan.push({ nada: 'kritis', judul: 'Unit tidak menguntungkan bahkan saat matang',
      teks: 'Pada asumsi ini, cabang baru merugi secara permanen. Perbaiki asumsi omset, margin, atau biaya operasional sebelum melangkah.' });
    if (npvTertimbang < 0) pesan.push({ nada: 'kritis', judul: 'NPV tertimbang risiko negatif',
      teks: `Setelah memperhitungkan probabilitas gagal ${F.persen(v.peluangGagal)}, nilai kini bersihnya ${F.rpRingkas(npvTertimbang)}. Secara ekonomi, modal ini lebih baik dipakai untuk hal lain.` });
    else if (npv > 0) pesan.push({ nada: 'sehat', judul: 'Layak secara ekonomi',
      teks: `NPV ${F.rpRingkas(npv)} pada diskonto ${F.persen(v.diskonto)}, IRR ${F.persen(irr)}. Setelah tertimbang risiko: ${F.rpRingkas(npvTertimbang)}.` });
    if (v.kanibalisasi > 0.2) pesan.push({ nada: 'waspada', judul: 'Kanibalisasi tinggi',
      teks: `${F.persen(v.kanibalisasi)} omset unit baru diambil dari unit lama. Pada level ini, sebagian besar yang Anda bangun hanya memindahkan pelanggan, bukan menambah pasar.` });
    if (payback !== null && payback < 6) pesan.push({ nada: 'waspada', judul: 'Payback tampak terlalu cepat',
      teks: 'Payback di bawah 6 bulan jarang realistis untuk cabang fisik. Verifikasi apakah seluruh capex, modal kerja, dan biaya perizinan sudah masuk hitungan.' });

    return {
      metrik: [
        { label: 'Modal total', nilai: modalTotal, format: 'rupiah' },
        { label: 'Laba bulanan saat matang', nilai: labaMatang, format: 'rupiah', nada: labaMatang > 0 ? 'sehat' : 'kritis' },
        { label: 'ROIC', nilai: roic, format: 'persen', sorot: true },
        { label: 'Payback', teks: payback ? F.angka(payback, 1) + ' tahun' : '—' },
        { label: 'Impas kumulatif', teks: bulanImpas ? `Bulan ke-${bulanImpas}` : 'Tidak tercapai' },
        { label: 'NPV', nilai: npv, format: 'rupiah-ringkas', nada: npv > 0 ? 'sehat' : 'kritis' },
        { label: 'IRR', nilai: irr, format: 'persen', nada: irr > v.diskonto ? 'sehat' : 'kritis' },
        { label: 'NPV tertimbang risiko', nilai: npvTertimbang, format: 'rupiah-ringkas',
          nada: npvTertimbang > 0 ? 'sehat' : 'kritis' }
      ],
      pesan,
      tabel: { judul: 'Proyeksi arus kas', kolom: [
          { k: 'tahun', label: 'Tahun' }, { k: 'arus', label: 'Arus kas', n: true, format: 'rupiah' },
          { k: 'kum', label: 'Kumulatif', n: true, format: 'rupiah' },
          { k: 'disk', label: 'Nilai kini', n: true, format: 'rupiah' }
        ], baris: arus.map((a, t) => {
          const kumx = arus.slice(0, t + 1).reduce((s, x) => s + x, 0);
          return { tahun: t === 0 ? 'Modal awal' : `Tahun ${t}`, arus: a, kum: kumx, disk: a / Math.pow(1 + v.diskonto, t) };
        }) }
    };
  }
},

/* ---------------------------------------------------------- B7 */
{
  id: 'b7-cac', kat: 'bisnis', kode: 'B7', ikon: '◇',
  nama: 'CAC, LTV & Corong Penjualan',
  ringkas: 'Biaya akuisisi sampai pelanggan membayar — bukan sampai klik atau percakapan.',
  intro: 'CAC yang dihitung sampai lead atau chat akan selalu terlihat murah. Yang menentukan adalah biaya per pelanggan yang benar-benar membayar, dan atribusi kanal yang jujur.',
  input: [
    { k: 'belanjaIklan', label: 'Belanja pemasaran per bulan', tipe: 'rupiah', awal: 60000000 },
    { k: 'biayaSales', label: 'Biaya tim penjualan per bulan', tipe: 'rupiah', awal: 35000000 },
    { k: 'impresi', label: 'Impresi / jangkauan', tipe: 'angka', awal: 900000, grup: 'Corong' },
    { k: 'lead', label: 'Lead masuk', tipe: 'angka', awal: 1800, grup: 'Corong' },
    { k: 'leadKualified', label: 'Lead terkualifikasi', tipe: 'angka', awal: 620, grup: 'Corong' },
    { k: 'penawaran', label: 'Penawaran dikirim', tipe: 'angka', awal: 240, grup: 'Corong' },
    { k: 'closing', label: 'Pelanggan membayar', tipe: 'angka', awal: 96, grup: 'Corong' },
    { k: 'dariMulutKeMulut', label: 'Berapa persen closing dari rujukan organik?', tipe: 'persen', awal: 0.35,
      hint: 'Yang datang tanpa disentuh iklan — sering salah dikreditkan ke iklan' },
    { k: 'nilaiTransaksi', label: 'Nilai transaksi rata-rata', tipe: 'rupiah', awal: 4200000, grup: 'Nilai Pelanggan' },
    { k: 'marginKotor', label: 'Margin kotor', tipe: 'persen', awal: 0.55, grup: 'Nilai Pelanggan' },
    { k: 'frekuensi', label: 'Frekuensi pembelian per tahun', tipe: 'angka', awal: 3.2, grup: 'Nilai Pelanggan' },
    { k: 'umurPelanggan', label: 'Umur pelanggan', tipe: 'angka', awal: 2.5, satuan: 'tahun', grup: 'Nilai Pelanggan' }
  ],
  hitung(v) {
    const belanjaTotal = v.belanjaIklan + v.biayaSales;
    const cacKotor = M.bagi(belanjaTotal, v.closing);
    const closingBerbayar = v.closing * (1 - v.dariMulutKeMulut);
    const cacBersih = M.bagi(belanjaTotal, closingBerbayar);
    const ltv = v.nilaiTransaksi * v.marginKotor * v.frekuensi * v.umurPelanggan;
    const rasio = M.bagi(ltv, cacBersih);
    const A = K.ambang.ltvCac;
    const status = rasio === null ? 'na' : rasio < A.rugi ? 'rugi' : rasio < A.marginal ? 'marginal'
      : rasio < A.sehat ? 'sehat' : 'verifikasi';
    const balikModal = M.bagi(cacBersih, v.nilaiTransaksi * v.marginKotor * v.frekuensi / 12);

    const corong = [
      { tahap: 'Impresi → Lead', dari: v.impresi, ke: v.lead },
      { tahap: 'Lead → Terkualifikasi', dari: v.lead, ke: v.leadKualified },
      { tahap: 'Terkualifikasi → Penawaran', dari: v.leadKualified, ke: v.penawaran },
      { tahap: 'Penawaran → Closing', dari: v.penawaran, ke: v.closing }
    ].map(t => ({ ...t, konversi: M.bagi(t.ke, t.dari) }));
    const terlemah = [...corong].sort((a, b) => (a.konversi || 0) - (b.konversi || 0))[0];

    const pesan = [];
    if (v.dariMulutKeMulut > 0) pesan.push({ nada: 'waspada', judul: 'Atribusi kanal mengubah gambaran',
      teks: `Bila seluruh ${v.closing} closing dikreditkan ke iklan, CAC terlihat ${F.rpRingkas(cacKotor)}. Setelah mengeluarkan ${F.persen(v.dariMulutKeMulut)} yang datang organik, CAC sesungguhnya ${F.rpRingkas(cacBersih)} — ${F.persen(M.bagi(cacBersih - cacKotor, cacKotor), 0)} lebih tinggi. Tanpa atribusi terpisah, efisiensi iklan akan selalu terlihat lebih baik dari kenyataan.` });
    const petaStatus = {
      rugi: { nada: 'kritis', judul: 'Merugi per pelanggan', teks: 'Biaya akuisisi melampaui nilai seumur hidup pelanggan. Menaikkan belanja iklan akan memperbesar kerugian. Hentikan penambahan anggaran dan perbaiki corong lebih dulu.' },
      marginal: { nada: 'waspada', judul: 'Belum layak di-scale', teks: `Rasio LTV:CAC ${F.angka(rasio, 1)}:1. Di bawah 3:1, menambah belanja iklan berisiko karena tidak ada ruang untuk kesalahan asumsi. Optimasi konversi dulu.` },
      sehat: { nada: 'sehat', judul: 'Siap di-scale', teks: `Rasio LTV:CAC ${F.angka(rasio, 1)}:1 berada di zona sehat. Penambahan belanja iklan masuk akal, dengan catatan return akan menurun seiring skala.` },
      verifikasi: { nada: 'waspada', judul: 'Rasio terlalu bagus — verifikasi', teks: `Rasio ${F.angka(rasio, 1)}:1 di atas 5:1 biasanya menandakan atribusi yang belum benar, umur pelanggan yang terlalu optimistis, atau biaya yang belum seluruhnya masuk. Periksa sebelum mengandalkannya.` }
    };
    if (petaStatus[status]) pesan.push(petaStatus[status]);
    pesan.push({ nada: 'info', judul: 'Bottleneck corong',
      teks: `Tahap dengan konversi terendah: <b>${terlemah.tahap}</b> di ${F.persen(terlemah.konversi, 1)}. Perbaikan 1 poin persentase di sini menambah sekitar ${F.angka(terlemah.dari * 0.01 * (v.closing / Math.max(terlemah.ke, 1)), 0)} pelanggan per bulan — biasanya jauh lebih murah daripada menambah anggaran iklan.` });

    return {
      metrik: [
        { label: 'CAC (seluruh closing)', nilai: cacKotor, format: 'rupiah' },
        { label: 'CAC berbayar sesungguhnya', nilai: cacBersih, format: 'rupiah', sorot: true },
        { label: 'LTV', nilai: ltv, format: 'rupiah' },
        { label: 'Rasio LTV : CAC', teks: rasio ? F.angka(rasio, 1) + ' : 1' : '—',
          nada: status === 'sehat' ? 'sehat' : status === 'rugi' ? 'kritis' : 'waspada' },
        { label: 'Balik modal akuisisi', nilai: balikModal, format: 'bulan' },
        { label: 'Konversi lead → closing', nilai: M.bagi(v.closing, v.lead), format: 'persen' }
      ],
      pesan,
      tabel: { judul: 'Corong penjualan', kolom: [
          { k: 'tahap', label: 'Tahap' }, { k: 'dari', label: 'Masuk', n: true, format: 'bulat' },

/* ---------------------------------------------------------- B8 */
{
  id: 'b8-harga', kat: 'bisnis', kode: 'B8', ikon: '↗',
  nama: 'Simulasi Harga & Pricing Power',
  ringkas: 'Dampak kenaikan harga terhadap laba pada berbagai asumsi kehilangan volume.',
  intro: 'Kenaikan harga mengalir hampir seluruhnya ke laba. Karena itu, menaikkan harga hampir selalu meningkatkan laba bersih meskipun kehilangan volume moderat — asalkan perceived value mendukungnya.',
  input: [
    { k: 'harga', label: 'Harga saat ini', tipe: 'rupiah', awal: 35000 },
    { k: 'biayaVariabel', label: 'Biaya variabel per unit', tipe: 'rupiah', awal: 25000 },
    { k: 'volume', label: 'Volume bulanan', tipe: 'angka', awal: 26000, satuan: 'unit' },
    { k: 'biayaTetap', label: 'Biaya tetap bulanan', tipe: 'rupiah', awal: 180000000 },
    { k: 'inflasi', label: 'Inflasi tahunan', tipe: 'persen', awal: 0.04 },
    { k: 'nilaiProduk', label: 'Kualitas produk relatif pesaing', tipe: 'angka', awal: 8, satuan: '/10', grup: 'Perceived Value' },
    { k: 'nilaiDelivery', label: 'Kecepatan & keandalan', tipe: 'angka', awal: 7, satuan: '/10', grup: 'Perceived Value' },
    { k: 'nilaiBranding', label: 'Kekuatan merek', tipe: 'angka', awal: 5, satuan: '/10', grup: 'Perceived Value' },
    { k: 'nilaiDiferensiasi', label: 'Diferensiasi / kelangkaan', tipe: 'angka', awal: 6, satuan: '/10', grup: 'Perceived Value' },
    { k: 'nilaiBukti', label: 'Bukti sosial & repeat rate', tipe: 'angka', awal: 7, satuan: '/10', grup: 'Perceived Value' },
    { k: 'skorPesaing', label: 'Skor rata-rata pesaing', tipe: 'angka', awal: 6, satuan: '/10', grup: 'Perceived Value' },
    { k: 'hargaPesaing', label: 'Harga rata-rata pesaing', tipe: 'rupiah', awal: 36000, grup: 'Perceived Value' }
  ],
  hitung(v) {
    const mkAwal = v.harga - v.biayaVariabel;
    const labaAwal = mkAwal * v.volume - v.biayaTetap;
    const kenaikan = [0.05, 0.10, 0.15, 0.20, 0.30];
    const kehilangan = [0, 0.05, 0.10, 0.20];

    const matriks = kenaikan.map(k => {
      const hargaBaru = v.harga * (1 + k);
      const mkBaru = hargaBaru - v.biayaVariabel;
      const sel = {};
      kehilangan.forEach(h => {
        const volBaru = v.volume * (1 - h);
        sel['h' + Math.round(h * 100)] = mkBaru * volBaru - v.biayaTetap;
      });
      return { k, hargaBaru, mkBaru, mkPersen: M.bagi(mkBaru, hargaBaru), ...sel };
    });

    const skor = (v.nilaiProduk + v.nilaiDelivery + v.nilaiBranding + v.nilaiDiferensiasi + v.nilaiBukti) / 5;
    const gapSkor = skor - v.skorPesaing;
    const gapHarga = M.bagi(v.harga - v.hargaPesaing, v.hargaPesaing);
    const undervalued = gapSkor > 0.5 && v.harga <= v.hargaPesaing;
    const usulanNaik = undervalued ? M.jepit(gapSkor / v.skorPesaing, 0, 0.35) : 0;
    const kenaikanMinimum = v.inflasi;
    const anggaranUji = Math.min(Math.max(0, labaAwal) * 0.15, 0);

    const pesan = [];
    if (undervalued) pesan.push({ nada: 'sehat', judul: 'Anda kemungkinan undervalued',
      teks: `Skor perceived value Anda ${F.angka(skor, 1)} versus pesaing ${F.angka(v.skorPesaing, 1)}, tetapi harga Anda ${gapHarga < 0 ? F.persen(Math.abs(gapHarga), 0) + ' lebih murah' : 'setara'}. Ada ruang menaikkan harga sekitar ${F.persen(usulanNaik, 0)} tanpa kehilangan posisi.` });
    if (v.nilaiBranding < 6 && v.nilaiProduk >= 7) pesan.push({ nada: 'waspada', judul: 'Kualitas tidak dikomunikasikan',
      teks: `Produk Anda dinilai ${v.nilaiProduk}/10 tetapi merek hanya ${v.nilaiBranding}/10. Kualitas yang tidak dikomunikasikan adalah <b>biaya</b>, bukan keunggulan — Anda membayarnya di HPP tetapi tidak menagihnya di harga.` });
    pesan.push({ nada: 'info', judul: 'Kenaikan tahunan adalah kewajiban',
      teks: `Kenaikan minimal ${F.persen(kenaikanMinimum)} per tahun sekadar untuk mengimbangi inflasi. Tanpa itu, margin Anda tergerus diam-diam setiap tahun tanpa keputusan apa pun yang terasa telah diambil.` });
    pesan.push({ nada: 'waspada', judul: 'Uji sebelum berkomitmen',
      teks: 'Jangan memakai seluruh laba untuk inisiatif branding yang belum teruji. Batasi anggaran uji pada sekitar 15% laba bulanan, jalankan 2–3 bulan, ukur dampaknya pada konversi dan harga rata-rata, baru putuskan.' });

    return {
      metrik: [
        { label: 'Margin kontribusi saat ini', nilai: M.bagi(mkAwal, v.harga), format: 'persen' },
        { label: 'Laba bulanan saat ini', nilai: labaAwal, format: 'rupiah' },
        { label: 'Skor perceived value', teks: F.angka(skor, 1) + ' / 10', sorot: true },
        { label: 'Selisih terhadap pesaing', teks: (gapSkor >= 0 ? '+' : '') + F.angka(gapSkor, 1) + ' poin',
          nada: gapSkor > 0 ? 'sehat' : 'waspada' },
        { label: 'Usulan kenaikan harga', nilai: usulanNaik, format: 'persen', nada: usulanNaik > 0 ? 'sehat' : '' },
        { label: 'Kenaikan minimum wajib', nilai: kenaikanMinimum, format: 'persen', ket: 'Sekadar mengimbangi inflasi' }
      ],
      pesan,
      tabel: { judul: 'Matriks laba: kenaikan harga × kehilangan volume', kolom: [
          { k: 'label', label: 'Kenaikan harga' }, { k: 'hargaBaru', label: 'Harga baru', n: true, format: 'rupiah' },
          { k: 'mkPersen', label: 'Margin kontribusi', n: true, format: 'persen' },
          { k: 'h0', label: 'Volume tetap', n: true, format: 'rupiah-ringkas' },
          { k: 'h5', label: '−5% volume', n: true, format: 'rupiah-ringkas' },
          { k: 'h10', label: '−10% volume', n: true, format: 'rupiah-ringkas' },
          { k: 'h20', label: '−20% volume', n: true, format: 'rupiah-ringkas' }
        ], baris: [{ label: 'Saat ini', hargaBaru: v.harga, mkPersen: M.bagi(mkAwal, v.harga),
            h0: labaAwal, h5: labaAwal, h10: labaAwal, h20: labaAwal, _tekan: true }]
          .concat(matriks.map(m => ({ label: '+' + F.persen(m.k, 0), ...m }))) },
      narasi: `<p>Perhatikan baris <b>+30%</b> pada kolom <b>−20% volume</b>: pada banyak struktur biaya, laba tetap naik meskipun seperlima pelanggan pergi. Itu karena kenaikan harga tidak membawa biaya tambahan sama sekali, sementara volume yang hilang juga membawa serta biaya variabelnya. Kuncinya bukan keberanian menaikkan harga, tetapi perceived value yang membuatnya bertahan.</p>`
    };
  }
},

/* ---------------------------------------------------------- B9 */
{
  id: 'b9-valuasi', kat: 'bisnis', kode: 'B9', ikon: '◈',
  nama: 'Valuasi Bisnis & Ketergantungan Pemilik',
  ringkas: 'Nilai berdasarkan multiple dan DCF, lalu didiskon atas ketergantungan pada Anda.',
  intro: 'Tes valuasi paling jujur: apa yang terjadi pada bisnis Anda kalau besok Anda tidak ada? Bisnis yang bergantung pada satu orang tidak bisa dijual, berapa pun labanya — pembeli membeli sistem, bukan pekerjaan.',
  input: [
    { k: 'labaBersihTahunan', label: 'Laba bersih tahunan', tipe: 'rupiah', awal: 1260000000 },
    { k: 'industri', label: 'Industri', tipe: 'pilih', awal: 'fnb-retail', opsi: K.industri.map(i => ({ v: i.kode, l: i.nama })) },
    { k: 'fcf', label: 'Arus kas bebas tahunan', tipe: 'rupiah', awal: 1050000000, grup: 'DCF' },
    { k: 'pertumbuhan', label: 'Pertumbuhan 5 tahun', tipe: 'persen', awal: 0.12, grup: 'DCF' },
    { k: 'pertumbuhanTerminal', label: 'Pertumbuhan terminal', tipe: 'persen', awal: 0.04, grup: 'DCF' },
    { k: 'wacc', label: 'Biaya modal (WACC)', tipe: 'persen', awal: 0.18, grup: 'DCF' },
    { k: 'tanpaPemilik', label: 'Bisa berjalan 30 hari tanpa Anda?', tipe: 'pilih', awal: 'tidak',
      opsi: [{ v: 'ya', l: 'Ya' }, { v: 'tidak', l: 'Belum' }], grup: 'Ketergantungan' },
    { k: 'sop', label: 'SOP terdokumentasi?', tipe: 'pilih', awal: 'sebagian',
      opsi: [{ v: 'ya', l: 'Ya, lengkap' }, { v: 'sebagian', l: 'Sebagian' }, { v: 'tidak', l: 'Belum' }], grup: 'Ketergantungan' },
    { k: 'manajemen', label: 'Ada lapisan manajemen di bawah Anda?', tipe: 'pilih', awal: 'tidak',
      opsi: [{ v: 'ya', l: 'Ya' }, { v: 'tidak', l: 'Belum' }], grup: 'Ketergantungan' },
    { k: 'relasi', label: 'Relasi pelanggan melekat pada institusi?', tipe: 'pilih', awal: 'tidak',
      opsi: [{ v: 'ya', l: 'Ya, ke perusahaan' }, { v: 'tidak', l: 'Melekat pada saya pribadi' }], grup: 'Ketergantungan' },
    { k: 'konsentrasiPelanggan', label: 'Porsi omset dari pelanggan terbesar', tipe: 'persen', awal: 0.18, grup: 'Ketergantungan' }
  ],
  hitung(v) {
    const ind = K.industri.find(i => i.kode === v.industri);
    const multipleRerata = (ind.multiple[0] + ind.multiple[1]) / 2;
    const valMultiple = v.labaBersihTahunan * multipleRerata;

    // DCF
    let pvArus = 0, fcfAkhir = v.fcf;
    for (let t = 1; t <= 5; t++) { fcfAkhir = v.fcf * Math.pow(1 + v.pertumbuhan, t); pvArus += fcfAkhir / Math.pow(1 + v.wacc, t); }
    const terminal = v.wacc > v.pertumbuhanTerminal
      ? fcfAkhir * (1 + v.pertumbuhanTerminal) / (v.wacc - v.pertumbuhanTerminal) : 0;
    const valDCF = pvArus + terminal / Math.pow(1 + v.wacc, 5);

    // Skor ketergantungan
    let skor = 0;
    if (v.tanpaPemilik === 'ya') skor += 30;
    skor += { ya: 20, sebagian: 10, tidak: 0 }[v.sop];
    if (v.manajemen === 'ya') skor += 25;
    if (v.relasi === 'ya') skor += 25;
    const diskonKetergantungan = ((100 - skor) / 100) * 0.6;
    const diskonKonsentrasi = v.konsentrasiPelanggan > 0.3 ? M.jepit((v.konsentrasiPelanggan - 0.3) * 0.8, 0, 0.25) : 0;
    const diskonTotal = M.jepit(diskonKetergantungan + diskonKonsentrasi, 0, 0.8);
    const dasar = (valMultiple + valDCF) / 2;
    const disesuaikan = dasar * (1 - diskonTotal);

    const pesan = [];
    if (skor < 50) pesan.push({ nada: 'kritis', judul: 'Bisnis kemungkinan tidak dapat dijual',
      teks: `Skor kemandirian ${skor}/100 menghasilkan diskon ${F.persen(diskonKetergantungan)}. Dengan tingkat ketergantungan ini, bisnis Anda kemungkinan tidak akan laku pada multiple industri. Prioritas sebelum memikirkan exit: bangun SOP dan lapisan manajemen — dua hal itu saja menambah 45 poin.` });
    else if (skor < 75) pesan.push({ nada: 'waspada', judul: 'Ketergantungan masih material',
      teks: `Skor kemandirian ${skor}/100. Menutup kekurangan yang tersisa dapat menaikkan valuasi hingga ${F.rpRingkas(dasar * diskonKetergantungan)} tanpa menambah satu rupiah pun laba.` });
    else pesan.push({ nada: 'sehat', judul: 'Bisnis relatif mandiri',
      teks: `Skor kemandirian ${skor}/100. Bisnis dapat dinilai mendekati multiple industri penuh.` });
    if (diskonKonsentrasi > 0) pesan.push({ nada: 'waspada', judul: 'Konsentrasi pelanggan',
      teks: `${F.persen(v.konsentrasiPelanggan)} omset dari satu pelanggan menambah diskon ${F.persen(diskonKonsentrasi)}. Pembeli menilai ini sebagai risiko kehilangan sebagian besar pendapatan dalam satu percakapan.` });

    return {
      metrik: [
        { label: 'Valuasi multiple', nilai: valMultiple, format: 'rupiah-ringkas',
          ket: `${F.angka(multipleRerata, 1)}× laba bersih` },
        { label: 'Valuasi DCF', nilai: valDCF, format: 'rupiah-ringkas' },
        { label: 'Rata-rata dasar', nilai: dasar, format: 'rupiah-ringkas' },
        { label: 'Skor kemandirian', teks: `${skor} / 100`,
          nada: skor >= 75 ? 'sehat' : skor >= 50 ? 'waspada' : 'kritis' },
        { label: 'Diskon total', nilai: diskonTotal, format: 'persen', nada: 'waspada' },
        { label: 'Valuasi disesuaikan', nilai: disesuaikan, format: 'rupiah-ringkas', sorot: true }
      ],
      pesan,
      tabel: { judul: 'Sumber diskon dan nilai yang bisa dipulihkan', kolom: [
          { k: 'faktor', label: 'Faktor' }, { k: 'st', label: 'Status', html: true },
          { k: 'poin', label: 'Poin', n: true }, { k: 'nilai', label: 'Nilai bila dipenuhi', n: true, format: 'rupiah-ringkas' }
        ], baris: [
          { faktor: 'Berjalan 30 hari tanpa pemilik', st: v.tanpaPemilik === 'ya' ? C.lencana('sehat', 'Ya') : C.lencana('kritis', 'Belum'),
            poin: v.tanpaPemilik === 'ya' ? 30 : 0, nilai: v.tanpaPemilik === 'ya' ? 0 : dasar * 0.3 * 0.6 },
          { faktor: 'SOP terdokumentasi', st: C.lencana(v.sop === 'ya' ? 'sehat' : v.sop === 'sebagian' ? 'waspada' : 'kritis',
              { ya: 'Lengkap', sebagian: 'Sebagian', tidak: 'Belum' }[v.sop]),
            poin: { ya: 20, sebagian: 10, tidak: 0 }[v.sop], nilai: dasar * (20 - { ya: 20, sebagian: 10, tidak: 0 }[v.sop]) / 100 * 0.6 },
          { faktor: 'Lapisan manajemen', st: v.manajemen === 'ya' ? C.lencana('sehat', 'Ada') : C.lencana('kritis', 'Belum'),
            poin: v.manajemen === 'ya' ? 25 : 0, nilai: v.manajemen === 'ya' ? 0 : dasar * 0.25 * 0.6 },
          { faktor: 'Relasi pelanggan institusional', st: v.relasi === 'ya' ? C.lencana('sehat', 'Ya') : C.lencana('kritis', 'Pribadi'),
            poin: v.relasi === 'ya' ? 25 : 0, nilai: v.relasi === 'ya' ? 0 : dasar * 0.25 * 0.6 }
        ] },
      narasi: '<p>Perhatikan kolom terakhir: nilai yang dapat dipulihkan dari membangun sistem sering melampaui nilai yang dapat ditambahkan dari menaikkan laba dalam periode yang sama. Institusi dibangun dari SDM dan sistem — dan itulah yang sebenarnya dibeli orang.</p>'
    };
  }
},

/* ---------------------------------------------------------- B10 */
{
  id: 'b10-bagihasil', kat: 'bisnis', kode: 'B10', ikon: '⊟',
  nama: 'Skema Bagi Hasil Investor',
  ringkas: 'BEP, cash-on-cash, dan IRR dari sisi investor — dengan porsi bagi hasil, bukan laba total.',
  intro: 'Kesalahan yang paling sering menyesatkan kedua belah pihak: menghitung BEP dengan membagi modal dengan total laba bersih, padahal investor hanya menerima porsi bagi hasilnya. Hasilnya bisa meleset satu setengah tahun atau lebih.',
  input: [
    { k: 'modalTotal', label: 'Modal total per unit', tipe: 'rupiah', awal: 2000000000 },
    { k: 'porsiInvestor', label: 'Porsi modal dari investor', tipe: 'persen', awal: 0.875 },
    { k: 'labaBulanan', label: 'Laba bersih bulanan per unit', tipe: 'rupiah', awal: 33000000 },
    { k: 'bagiPraBEP', label: 'Bagi hasil investor sebelum BEP', tipe: 'persen', awal: 0.70 },
    { k: 'bagiPascaBEP', label: 'Bagi hasil investor setelah BEP', tipe: 'persen', awal: 0.50 },
    { k: 'horizon', label: 'Horizon analisis', tipe: 'angka', awal: 10, satuan: 'tahun' },
    { k: 'pertumbuhanLaba', label: 'Pertumbuhan laba tahunan', tipe: 'persen', awal: 0.05 },
    { k: 'bebasRisiko', label: 'Imbal hasil bebas risiko pembanding', tipe: 'persen', awal: 0.065 }
  ],
  hitung(v) {
    const modalInvestor = v.modalTotal * v.porsiInvestor;
    const bagianPra = v.labaBulanan * v.bagiPraBEP;
    const bepBulan = M.bagi(modalInvestor, bagianPra);
    const cocPra = M.bagi(bagianPra * 12, modalInvestor);
    const cocPasca = M.bagi(v.labaBulanan * v.bagiPascaBEP * 12, modalInvestor);
    const naifBulan = M.bagi(v.modalTotal, v.labaBulanan);

    // Arus kas investor tahunan
    const arus = [-modalInvestor];
    let bulanBerjalan = 0;
    for (let t = 1; t <= v.horizon; t++) {
      let tahunan = 0;
      const laba = v.labaBulanan * Math.pow(1 + v.pertumbuhanLaba, t - 1);
      for (let b = 1; b <= 12; b++) {
        bulanBerjalan++;
        const porsi = bulanBerjalan <= (bepBulan || 0) ? v.bagiPraBEP : v.bagiPascaBEP;
        tahunan += laba * porsi;
      }
      arus.push(tahunan);
    }
    const irr = M.irr(arus);
    const npv = M.npv(v.bebasRisiko, arus);
    const totalDiterima = arus.slice(1).reduce((s, a) => s + a, 0);
    const kelipatan = M.bagi(totalDiterima, modalInvestor);

    const pesan = [
      { nada: 'kritis', judul: 'Perhitungan naif versus perhitungan benar',
        teks: `Membagi modal total ${F.rpRingkas(v.modalTotal)} dengan laba bersih ${F.rpRingkas(v.labaBulanan)} menghasilkan BEP <b>${F.angka(naifBulan, 0)} bulan (${F.angka(naifBulan / 12, 1)} tahun)</b> — dan angka inilah yang sering dipakai dalam proposal. Perhitungan yang benar memakai modal investor ${F.rpRingkas(modalInvestor)} dibagi bagiannya ${F.rpRingkas(bagianPra)}, menghasilkan <b>${F.angka(bepBulan, 0)} bulan (${F.angka(bepBulan / 12, 1)} tahun)</b>. Selisihnya ${F.angka((bepBulan - naifBulan) / 12, 1)} tahun.` }
    ];
    if (cocPasca !== null && cocPasca < v.bebasRisiko * 1.3) pesan.push({ nada: 'kritis',
      judul: 'Imbal hasil pasca-BEP tidak sepadan risiko',
      teks: `Setelah BEP, cash-on-cash turun menjadi ${F.persen(cocPasca)} — hanya ${F.angka(M.bagi(cocPasca, v.bebasRisiko), 1)}× imbal hasil bebas risiko ${F.persen(v.bebasRisiko)}. Investor rasional akan memilih instrumen bebas risiko daripada menanggung risiko bisnis untuk selisih setipis ini. Skema perlu direvisi agar dapat menarik modal.` });
    else if (cocPasca !== null) pesan.push({ nada: 'sehat', judul: 'Imbal hasil pasca-BEP memadai',
      teks: `Cash-on-cash ${F.persen(cocPasca)} setelah BEP, ${F.angka(M.bagi(cocPasca, v.bebasRisiko), 1)}× imbal hasil bebas risiko. Premi risiko ini dapat dipertahankan di hadapan investor.` });
    if (irr !== null) pesan.push({ nada: irr > v.bebasRisiko * 2 ? 'sehat' : 'waspada', judul: 'IRR proyek dari sisi investor',
      teks: `${F.persen(irr)} selama ${v.horizon} tahun. Bandingkan bukan hanya dengan deposito, tetapi dengan alternatif berisiko setara — properti sewa, penyertaan bisnis lain, atau portofolio ekuitas.` });

    return {
      metrik: [
        { label: 'Modal investor', nilai: modalInvestor, format: 'rupiah-ringkas' },
        { label: 'Bagian investor / bulan', nilai: bagianPra, format: 'rupiah', ket: 'Sebelum BEP' },
        { label: 'BEP investor', teks: F.durasi(bepBulan / 12), sorot: true },
        { label: 'BEP menurut hitungan naif', teks: F.durasi(naifBulan / 12), nada: 'kritis', ket: 'Yang sering dipakai — keliru' },
        { label: 'Cash-on-cash pra-BEP', nilai: cocPra, format: 'persen', nada: 'sehat' },
        { label: 'Cash-on-cash pasca-BEP', nilai: cocPasca, format: 'persen',
          nada: cocPasca < v.bebasRisiko * 1.3 ? 'kritis' : 'waspada' },
        { label: 'IRR', nilai: irr, format: 'persen' },
        { label: 'Kelipatan modal kembali', nilai: kelipatan, format: 'kali', ket: `Dalam ${v.horizon} tahun` }
      ],
      pesan,
      tabel: { judul: 'Arus kas investor', kolom: [
          { k: 'th', label: 'Periode' }, { k: 'arus', label: 'Diterima investor', n: true, format: 'rupiah' },
          { k: 'kum', label: 'Kumulatif', n: true, format: 'rupiah' },
          { k: 'status', label: 'Status modal', html: true }
        ], baris: arus.map((a, t) => {
          const kum = arus.slice(0, t + 1).reduce((s, x) => s + x, 0);
          return { th: t === 0 ? 'Penyetoran modal' : `Tahun ${t}`, arus: a, kum,
            status: t === 0 ? C.lencana('netral', 'Modal disetor')
              : kum >= 0 ? C.lencana('sehat', 'Modal kembali') : C.lencana('waspada', 'Belum kembali'),
            _tekan: t > 0 && kum >= 0 && (arus.slice(0, t).reduce((s, x) => s + x, 0) < 0) };
        }) }
    };
  }
}
];

/* ============================================================

const KAT_INVESTOR = [

/* ---------------------------------------------------------- I1 */
{
  id: 'i1-alokasi', kat: 'investor', kode: 'I1', ikon: '◔',
  nama: 'Perancang Alokasi Aset',
  ringkas: 'Alokasi dihitung dari profil, bukan template 60/40 yang diseragamkan.',
  intro: 'Prinsip risiko berlawanan: penghasilan fluktuatif menuntut portofolio stabil, penghasilan stabil memberi ruang aset volatil. Risiko sudah diambil di satu sisi — jangan digandakan di sisi lain.',
  input: [
    { k: 'nilai', label: 'Nilai portofolio', tipe: 'rupiah', awal: 1500000000 },
    { k: 'usia', label: 'Usia', tipe: 'angka', awal: 38, satuan: 'tahun' },
    { k: 'profil', label: 'Toleransi risiko', tipe: 'pilih', awal: 'moderat', opsi: [
      { v: 'sangat-konservatif', l: 'Sangat konservatif' }, { v: 'konservatif', l: 'Konservatif' },
      { v: 'moderat', l: 'Moderat' }, { v: 'agresif', l: 'Agresif' }, { v: 'sangat-agresif', l: 'Sangat agresif' } ]},
    { k: 'stabilitas', label: 'Stabilitas penghasilan', tipe: 'pilih', awal: 'stabil', opsi: [
      { v: 'stabil', l: 'Stabil' }, { v: 'semi', l: 'Semi-stabil' }, { v: 'fluktuatif', l: 'Fluktuatif / pengusaha' } ]},
    { k: 'horizon', label: 'Horizon investasi', tipe: 'angka', awal: 15, satuan: 'tahun' },
    { k: 'pantau', label: 'Kapasitas memantau', tipe: 'pilih', awal: 'mingguan', opsi: [
      { v: 'harian', l: 'Harian, bisa bertindak cepat' }, { v: 'mingguan', l: 'Mingguan' },
      { v: 'bulanan', l: 'Bulanan atau lebih jarang' } ]},
    { k: 'eksposurBisnis', label: 'Punya eksposur besar ke satu bisnis?', tipe: 'pilih', awal: 'tidak',
      opsi: [{ v: 'tidak', l: 'Tidak' }, { v: 'ya', l: 'Ya' }] }
  ],
  hitung(v) {
    let a = { ...K.alokasi[v.profil] };
    const catatan = [];
    if (v.stabilitas === 'fluktuatif') {
      const geser = Math.min(0.15, a.alternatif);
      a.alternatif -= geser; a.obligasi += geser * 0.6; a.kas += geser * 0.4;
      catatan.push('Penghasilan fluktuatif → 15 poin digeser dari alternatif ke obligasi dan kas.');
    }
    if (v.pantau === 'bulanan' && a.alternatif > 0.20) {
      const lebih = a.alternatif - 0.20; a.alternatif = 0.20; a.ekuitas += lebih;
      catatan.push('Kapasitas memantau terbatas → alternatif dibatasi 20%.');
    }
    if (v.usia > 50) { const geser = Math.min(0.10, a.ekuitas); a.ekuitas -= geser; a.obligasi += geser;
      catatan.push('Usia di atas 50 → 10 poin digeser dari ekuitas ke obligasi.'); }
    if (v.eksposurBisnis === 'ya' && a.alternatif > 0.15) {
      const lebih = a.alternatif - 0.15; a.alternatif = 0.15; a.obligasi += lebih;
      catatan.push('Eksposur bisnis besar → alternatif dibatasi 15%, karena risiko konsentrasi sudah ditanggung di luar portofolio.'); }
    if (v.horizon < 5 && a.ekuitas > 0.35) {
      const lebih = a.ekuitas - 0.35; a.ekuitas = 0.35; a.obligasi += lebih;
      catatan.push('Horizon di bawah 5 tahun → ekuitas dibatasi 35%.'); }

    const bobotKelas = { pasarUang: a.kas, obligasiNegara: a.obligasi * 0.6, obligasiKorp: a.obligasi * 0.4,
      sahamGlobal: a.ekuitas * 0.6, sahamDomestik: a.ekuitas * 0.4,
      emas: a.alternatif * 0.4, asetDigital: a.alternatif * 0.35, properti: a.alternatif * 0.25 };
    const er = M.expectedReturn(bobotKelas);
    const vol = M.volatilitasPortofolio(bobotKelas);
    const sharpe = M.sharpe(er, K.makro.bebasRisiko, vol);
    const maksPosisi = v.nilai < 1e9 ? 4 : v.nilai < 5e9 ? 6 : 9;
    const turunSetahun = v.nilai * vol;

    const pesan = [];
    if (catatan.length) pesan.push({ nada: 'info', judul: 'Penyesuaian yang diterapkan', teks: catatan.join(' ') });
    pesan.push({ nada: 'waspada', judul: 'Uji toleransi penurunan',
      teks: `Portofolio ini secara historis dapat turun sekitar ${F.persen(vol)} dalam satu tahun buruk — setara <b>${F.rpRingkas(turunSetahun)}</b>. Pertanyaannya bukan apakah Anda menerima angka itu hari ini, tetapi apakah Anda akan bertahan tanpa menjual saat itu benar-benar terjadi. Alokasi harus dipilih untuk versi diri Anda yang sedang panik, bukan yang sedang tenang.` });
    if (v.nilai < 1e9) pesan.push({ nada: 'info', judul: 'Sederhanakan',
      teks: `Untuk portofolio di bawah Rp1 miliar, batasi maksimal ${maksPosisi} posisi. Membagi portofolio kecil ke banyak instrumen tidak menambah return — hanya menambah beban pemantauan dan biaya. Kompleksitas harus sepadan dengan ukuran.` });

    return {
      metrik: [
        { label: 'Ekspektasi return', nilai: er, format: 'persen', sorot: true },
        { label: 'Volatilitas', nilai: vol, format: 'persen' },
        { label: 'Rasio Sharpe', nilai: sharpe, format: 'angka',
          ket: M.interpretasiSharpe(sharpe).label },
        { label: 'Rentang hasil tahun tertentu', teks: `${F.persen(er - vol)} s.d. ${F.persen(er + vol)}` },
        { label: 'Maksimal posisi disarankan', teks: maksPosisi + ' instrumen' },
        { label: 'Potensi turun tahun buruk', nilai: -turunSetahun, format: 'rupiah-ringkas', nada: 'waspada' }
      ],
      pesan,
      tabel: { judul: 'Alokasi usulan', kolom: [
          { k: 'kelas', label: 'Kelas aset' }, { k: 'bobot', label: 'Bobot', n: true, format: 'persen' },
          { k: 'nilai', label: 'Nilai', n: true, format: 'rupiah' },
          { k: 'r', label: 'Ekspektasi return', n: true, format: 'persen' },
          { k: 'peran', label: 'Peran dalam portofolio' }
        ], baris: [
          { kelas: 'Kas & pasar uang', bobot: a.kas, nilai: v.nilai * a.kas, r: K.aset.pasarUang.r, peran: 'Likuiditas & peredam guncangan' },
          { kelas: 'Obligasi', bobot: a.obligasi, nilai: v.nilai * a.obligasi, r: K.aset.obligasiNegara.r, peran: 'Pendapatan & stabilitas' },
          { kelas: 'Ekuitas', bobot: a.ekuitas, nilai: v.nilai * a.ekuitas, r: K.aset.sahamGlobal.r, peran: 'Mesin pertumbuhan utama' },
          { kelas: 'Alternatif', bobot: a.alternatif, nilai: v.nilai * a.alternatif, r: K.aset.asetDigital.r, peran: 'Diversifikasi & potensi asimetris' },
          { kelas: 'Total', bobot: a.kas + a.obligasi + a.ekuitas + a.alternatif, nilai: v.nilai, r: er, peran: '—', _tekan: true }
        ] },
      narasi: '<p>Ekspektasi return adalah rata-rata jangka panjang, bukan yang Anda alami setiap tahun. Portofolio dengan rata-rata 9% biasanya menghasilkan +20% atau −10% pada tahun tertentu. Rata-rata adalah hasil akhir, bukan pengalaman tahunan.</p>'
    };
  }
},

/* ---------------------------------------------------------- I2 */
{
  id: 'i2-rebalancing', kat: 'investor', kode: 'I2', ikon: '⇌',
  nama: 'Rebalancing Portofolio',
  ringkas: 'Aksi konkret untuk mengembalikan alokasi ke target — arus kas baru diutamakan.',
  intro: 'Rebalancing menggantikan market timing. Anda tidak perlu menebak puncak atau dasar; cukup menetapkan target alokasi dan mengembalikannya ke sana secara berkala.',
  input: [
    { k: 'daftar', label: 'Posisi portofolio', tipe: 'daftar', kolom: [
        { k: 'nama', label: 'Posisi', tipe: 'teks', lebar: '2fr' },
        { k: 'nilai', label: 'Nilai saat ini', tipe: 'rupiah' },
        { k: 'target', label: 'Target bobot', tipe: 'persen' }
      ], awal: [
        { nama: 'Pasar uang', nilai: 180000000, target: 0.15 },
        { nama: 'Obligasi', nilai: 300000000, target: 0.25 },
        { nama: 'Ekuitas global', nilai: 720000000, target: 0.45 },
        { nama: 'Aset digital', nilai: 300000000, target: 0.15 }
      ] },
    { k: 'kasBaru', label: 'Kas baru untuk dialokasikan', tipe: 'rupiah', awal: 120000000 },
    { k: 'ambang', label: 'Ambang deviasi pemicu', tipe: 'persen', awal: 0.05 },
    { k: 'pajakJual', label: 'Pajak / biaya penjualan', tipe: 'persen', awal: 0.001 }
  ],
  hitung(v) {
    const posisi = (v.daftar || []).map((p, i) => ({ ...p, kode: 'p' + i }));
    const targetBobot = {}; posisi.forEach(p => targetBobot[p.kode] = p.target);
    const total = posisi.reduce((s, p) => s + p.nilai, 0);
    const jual = M.rebalanceViaJual(posisi, targetBobot, v.ambang);
    const viaKas = M.rebalanceViaKasBaru(posisi, targetBobot, v.kasBaru);
    const totalTarget = posisi.reduce((s, p) => s + p.target, 0);
    const perluJual = jual.filter(p => p.aksi === 'jual');
    const biayaJual = perluJual.reduce((s, p) => s + p.jumlah, 0) * v.pajakJual;
    const deviasiMaks = Math.max(...jual.map(p => Math.abs(p.deviasi)));
    const kasCukup = viaKas.every((p, i) => Math.abs((posisi[i].nilai + p.alokasi) / (total + v.kasBaru) - p.target) < v.ambang);

    const pesan = [];
    if (Math.abs(totalTarget - 1) > 0.001) pesan.push({ nada: 'kritis', judul: 'Target bobot tidak berjumlah 100%',
      teks: `Total target saat ini ${F.persen(totalTarget)}. Perbaiki sebelum membaca hasil di bawah.` });
    if (deviasiMaks < v.ambang) pesan.push({ nada: 'sehat', judul: 'Belum perlu rebalancing',
      teks: `Deviasi terbesar ${F.persen(deviasiMaks)} masih di bawah ambang ${F.persen(v.ambang)}. Alokasikan kas baru ke posisi yang paling kurang, lalu tinjau kembali kuartal depan.` });
    else pesan.push({ nada: 'waspada', judul: 'Rebalancing diperlukan',
      teks: `Deviasi terbesar ${F.persen(deviasiMaks)} melewati ambang ${F.persen(v.ambang)}.` });
    pesan.push({ nada: kasCukup ? 'sehat' : 'info', judul: 'Utamakan arus kas baru',
      teks: kasCukup
        ? `Kas baru ${F.rpRingkas(v.kasBaru)} cukup mengembalikan alokasi ke target tanpa menjual apa pun. Ini rute termurah: tanpa biaya transaksi, tanpa konsekuensi pajak.`
        : `Kas baru ${F.rpRingkas(v.kasBaru)} belum cukup menutup seluruh deviasi. Alokasikan seluruhnya ke posisi terkurang lebih dulu; bila deviasi masih di atas ambang setelah dua kuartal, baru pertimbangkan penjualan. Estimasi biaya bila menjual sekarang: ${F.rpRingkas(biayaJual)}.` });
    pesan.push({ nada: 'info', judul: 'Frekuensi yang disarankan',
      teks: total < 5e8 ? 'Portofolio di bawah Rp500 juta: semesteran, atau saat deviasi melewati 10%.'
        : total < 5e9 ? 'Portofolio Rp500 juta–Rp5 miliar: kuartalan. Jangan bulanan — biayanya melebihi manfaatnya.'
        : 'Portofolio di atas Rp5 miliar: kuartalan ditambah pemicu berbasis ambang.' });

    return {
      metrik: [
        { label: 'Nilai portofolio', nilai: total, format: 'rupiah-ringkas' },
        { label: 'Deviasi terbesar', nilai: deviasiMaks, format: 'persen',
          nada: deviasiMaks < v.ambang ? 'sehat' : 'waspada', sorot: true },
        { label: 'Posisi perlu dijual', teks: perluJual.length + ' posisi' },
        { label: 'Kas baru tersedia', nilai: v.kasBaru, format: 'rupiah' },
        { label: 'Estimasi biaya bila menjual', nilai: biayaJual, format: 'rupiah' }
      ],
      pesan,
      tabel: { judul: 'Aksi rebalancing', kolom: [
          { k: 'nama', label: 'Posisi' }, { k: 'nilai', label: 'Nilai', n: true, format: 'rupiah' },
          { k: 'bobot', label: 'Bobot kini', n: true, format: 'persen' },
          { k: 'target', label: 'Target', n: true, format: 'persen' },
          { k: 'deviasi', label: 'Deviasi', n: true, format: 'persen' },
          { k: 'alokasiKas', label: 'Alokasi kas baru', n: true, format: 'rupiah' },
          { k: 'aksiT', label: 'Aksi bila menjual' }
        ], baris: jual.map((p, i) => ({ ...p, alokasiKas: viaKas[i].alokasi,
          aksiT: p.aksi === 'tahan' ? 'Tahan' : `${p.aksi === 'jual' ? 'Jual' : 'Beli'} ${F.rpRingkas(p.jumlah)}`,
          _tekan: Math.abs(p.deviasi) >= v.ambang })) }
    };
  }
},

/* ---------------------------------------------------------- I3 */
{
  id: 'i3-konsentrasi', kat: 'investor', kode: 'I3', ikon: '◍',
  nama: 'Risiko Konsentrasi & Diversifikasi Palsu',
  ringkas: 'Indeks HHI, konsentrasi posisi, kelas, dan sektor — plus deteksi diversifikasi semu.',
  intro: 'Membeli tiga saham dari sektor yang sama bukan diversifikasi. Diversifikasi terjadi antar sektor dan antar kelas aset, bukan antar nama perusahaan.',
  input: [
    { k: 'daftar', label: 'Posisi portofolio', tipe: 'daftar', kolom: [
        { k: 'nama', label: 'Posisi', tipe: 'teks', lebar: '2fr' },
        { k: 'nilai', label: 'Nilai', tipe: 'rupiah' },
        { k: 'sektor', label: 'Sektor / kelas', tipe: 'teks' }
      ], awal: [
        { nama: 'Bank A', nilai: 320000000, sektor: 'Perbankan' },
        { nama: 'Bank B', nilai: 210000000, sektor: 'Perbankan' },
        { nama: 'Bank C', nilai: 180000000, sektor: 'Perbankan' },
        { nama: 'Indeks global', nilai: 400000000, sektor: 'Ekuitas global' },
        { nama: 'Obligasi negara', nilai: 250000000, sektor: 'Obligasi' },
        { nama: 'Aset digital', nilai: 140000000, sektor: 'Aset digital' }
      ] }
  ],
  hitung(v) {
    const posisi = (v.daftar || []).filter(p => p.nilai > 0);
    const total = posisi.reduce((s, p) => s + p.nilai, 0);
    const bobot = posisi.map(p => M.bagi(p.nilai, total) || 0);
    const hhi = M.hhi(bobot);
    const terbesar = Math.max(...bobot);
    const namaTerbesar = posisi[bobot.indexOf(terbesar)]?.nama;
    const tiga = [...bobot].sort((a, b) => b - a).slice(0, 3).reduce((s, x) => s + x, 0);

    const perSektor = {};
    posisi.forEach(p => { perSektor[p.sektor] = (perSektor[p.sektor] || 0) + p.nilai; });
    const sektor = Object.entries(perSektor).map(([nama, nilai]) => ({ nama, nilai, bobot: M.bagi(nilai, total) || 0 }))
      .sort((a, b) => b.bobot - a.bobot);
    const sektorTerbesar = sektor[0];
    const efektif = M.bagi(1, hhi);

    const A = K.ambang.konsentrasi;
    const pesan = [];
    if (terbesar > A.posisi) pesan.push({ nada: 'kritis', judul: 'Konsentrasi posisi tinggi',
      teks: `<b>${F.esc(namaTerbesar)}</b> menempati ${F.persen(terbesar)} portofolio, di atas ambang ${F.persen(A.posisi, 0)}. Nasib portofolio Anda sebagian besar ditentukan satu keputusan.` });
    if (sektorTerbesar && sektorTerbesar.bobot > A.sektor) pesan.push({ nada: 'kritis', judul: 'Diversifikasi palsu terdeteksi',
      teks: `${F.persen(sektorTerbesar.bobot)} portofolio berada di sektor <b>${F.esc(sektorTerbesar.nama)}</b>, tersebar di beberapa nama. Posisi-posisi ini berperilaku hampir sebagai satu posisi: ketika sektornya turun, seluruhnya turun bersama. Jumlah nama tidak sama dengan jumlah taruhan.` });
    pesan.push({ nada: hhi > 0.25 ? 'waspada' : 'sehat', judul: 'Jumlah posisi efektif',
      teks: `HHI ${F.angka(hhi, 3)} setara dengan sekitar <b>${F.angka(efektif, 1)} posisi yang benar-benar independen</b>, meskipun Anda memegang ${posisi.length} nama. Angka inilah diversifikasi Anda yang sesungguhnya.` });

    return {
      metrik: [
        { label: 'Jumlah posisi', teks: posisi.length + '' },
        { label: 'Posisi efektif (1/HHI)', nilai: efektif, format: 'angka', sorot: true },
        { label: 'HHI', nilai: hhi, format: 'angka', nada: hhi > 0.25 ? 'waspada' : 'sehat' },
        { label: 'Posisi terbesar', nilai: terbesar, format: 'persen',
          nada: terbesar > A.posisi ? 'kritis' : 'sehat', ket: namaTerbesar },
        { label: 'Tiga terbesar', nilai: tiga, format: 'persen', nada: tiga > 0.6 ? 'waspada' : 'sehat' },
        { label: 'Sektor terbesar', nilai: sektorTerbesar?.bobot, format: 'persen',
          nada: sektorTerbesar?.bobot > A.sektor ? 'kritis' : 'sehat', ket: sektorTerbesar?.nama }
      ],
      pesan,
      tabel: { judul: 'Konsentrasi per sektor', kolom: [
          { k: 'nama', label: 'Sektor / kelas' }, { k: 'nilai', label: 'Nilai', n: true, format: 'rupiah' },
          { k: 'bobot', label: 'Bobot', n: true, format: 'persen' },
          { k: 'jml', label: 'Jumlah posisi', n: true }, { k: 'st', label: 'Status', html: true }
        ], baris: sektor.map(s => ({ ...s, jml: posisi.filter(p => p.sektor === s.nama).length,
          st: s.bobot > A.sektor ? C.lencana('kritis', 'Terlalu terkonsentrasi')
            : s.bobot > A.sektor * 0.7 ? C.lencana('waspada', 'Perlu diperhatikan') : C.lencana('sehat', 'Wajar'),
          _tekan: s.bobot > A.sektor })) }
    };
  }
},

/* ---------------------------------------------------------- I4 */
{
  id: 'i4-kas', kat: 'investor', kode: 'I4', ikon: '⊙',
  nama: 'Kas Menganggur & Cash Drag',
  ringkas: 'Biaya kesempatan kas yang tidak menghasilkan — dan batas bawah yang tidak boleh dilanggar.',
  intro: 'Kas tidak boleh menganggur tanpa imbal hasil, tetapi juga tidak boleh terlalu tipis. Terlalu sedikit membuat Anda rentan likuidasi paksa; terlalu banyak menggerus return diam-diam.',
  input: [
    { k: 'kasTanpaHasil', label: 'Kas di rekening tanpa imbal hasil', tipe: 'rupiah', awal: 400000000 },
    { k: 'kasPasarUang', label: 'Kas di instrumen pasar uang', tipe: 'rupiah', awal: 150000000 },
    { k: 'danaDarurat', label: 'Kebutuhan dana darurat', tipe: 'rupiah', awal: 132000000 },
    { k: 'rencana12Bulan', label: 'Pengeluaran besar terencana 12 bulan', tipe: 'rupiah', awal: 200000000 },
    { k: 'cadanganTaktis', label: 'Cadangan taktis untuk peluang', tipe: 'rupiah', awal: 100000000 },
    { k: 'returnPortofolio', label: 'Ekspektasi return portofolio', tipe: 'persen', awal: 0.09 },
    { k: 'ratePasarUang', label: 'Imbal hasil pasar uang', tipe: 'persen', awal: 0.045 },
    { k: 'horizon', label: 'Horizon perbandingan', tipe: 'angka', awal: 10, satuan: 'tahun' }
  ],
  hitung(v) {
    const totalKas = v.kasTanpaHasil + v.kasPasarUang;
    const optimal = v.danaDarurat + v.rencana12Bulan + v.cadanganTaktis;
    const berlebih = Math.max(0, totalKas - optimal * K.ambang.cashDrag.kelebihan);
    const kurang = Math.max(0, v.danaDarurat - totalKas);
    const rugiTahunan = v.kasTanpaHasil * v.ratePasarUang;
    const rugiHorizon = v.kasTanpaHasil * (Math.pow(1 + v.ratePasarUang, v.horizon) - 1);
    const dragBerlebih = berlebih * (v.returnPortofolio - v.ratePasarUang);
    const dragHorizon = berlebih * (Math.pow(1 + v.returnPortofolio, v.horizon) - Math.pow(1 + v.ratePasarUang, v.horizon));

    const pesan = [];
    if (v.kasTanpaHasil > 0) pesan.push({ nada: 'waspada', judul: 'Kas tanpa imbal hasil',
      teks: `${F.rpRingkas(v.kasTanpaHasil)} mengendap tanpa menghasilkan apa pun. Dengan memindahkannya ke instrumen pasar uang — tanpa menambah risiko nilai pokok sama sekali — Anda memperoleh ${F.rpRingkas(rugiTahunan)} per tahun, dan ${F.rpRingkas(rugiHorizon)} selama ${v.horizon} tahun. Ini perbaikan tanpa trade-off, jenis yang paling jarang tersedia.` });
    if (berlebih > 0) pesan.push({ nada: 'waspada', judul: 'Cash drag dari kas berlebih',
      teks: `Kas melebihi kebutuhan optimal sebesar ${F.rpRingkas(berlebih)}. Selisih return terhadap portofolio ${F.persen(v.returnPortofolio - v.ratePasarUang)} berarti kehilangan ${F.rpRingkas(dragBerlebih)} per tahun, atau ${F.rpRingkas(dragHorizon)} selama ${v.horizon} tahun.` });
    if (kurang > 0) pesan.push({ nada: 'kritis', judul: 'Kas di bawah dana darurat',
      teks: `Kekurangan ${F.rpRingkas(kurang)}. Ini justru risiko yang lebih besar daripada cash drag: ketika kebutuhan mendesak datang bersamaan dengan pasar turun, Anda dipaksa menjual di harga terburuk.` });
    if (berlebih === 0 && kurang === 0 && v.kasTanpaHasil === 0) pesan.push({ nada: 'sehat', judul: 'Porsi kas optimal',
      teks: 'Kas berada dalam rentang yang tepat dan seluruhnya menghasilkan.' });
    pesan.push({ nada: 'info', judul: 'Kas bukan sekadar beban',
      teks: 'Kas memberi dua hal yang tidak muncul di perhitungan return: margin pengaman finansial, dan ketenangan untuk mengambil keputusan jernih ketika pasar sedang tidak masuk akal. Optimalkan, jangan hapuskan.' });

    return {
      metrik: [
        { label: 'Total kas', nilai: totalKas, format: 'rupiah', sorot: true },
