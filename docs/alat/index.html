/* ---------------------------------------------------------- I5 */
{
  id: 'i5-stress', kat: 'investor', kode: 'I5', ikon: '⚡',
  nama: 'Uji Ketahanan (Stress Test)',
  ringkas: 'Apa yang terjadi pada kekayaan dan gaya hidup Anda saat beberapa hal memburuk bersamaan.',
  intro: 'Guncangan jarang datang sendirian. Pasar turun, penghasilan terganggu, dan bisnis melemah cenderung terjadi pada periode yang sama — karena penyebabnya sering satu.',
  input: [
    { k: 'ekuitas', label: 'Nilai ekuitas / saham', tipe: 'rupiah', awal: 720000000 },
    { k: 'obligasi', label: 'Nilai obligasi', tipe: 'rupiah', awal: 300000000 },
    { k: 'digital', label: 'Nilai aset digital', tipe: 'rupiah', awal: 300000000 },
    { k: 'properti', label: 'Nilai properti', tipe: 'rupiah', awal: 1400000000 },
    { k: 'kas', label: 'Kas & pasar uang', tipe: 'rupiah', awal: 180000000 },
    { k: 'ekuitasBisnis', label: 'Nilai ekuitas bisnis', tipe: 'rupiah', awal: 0 },
    { k: 'hutang', label: 'Total hutang', tipe: 'rupiah', awal: 727000000 },
    { k: 'pengeluaranBulanan', label: 'Pengeluaran bulanan', tipe: 'rupiah', awal: 22000000 },
    { k: 'penghasilanBulanan', label: 'Penghasilan bulanan', tipe: 'rupiah', awal: 39500000 }
  ],
  hitung(v) {
    const totalAset = v.ekuitas + v.obligasi + v.digital + v.properti + v.kas + v.ekuitasBisnis;
    const nwAwal = totalAset - v.hutang;

    const skenario = [
      { nama: 'Koreksi pasar sedang', ek: -0.25, ob: -0.05, dg: -0.45, pr: 0, bs: -0.15, penghasilan: 0, bulanTanpaPenghasilan: 0 },
      { nama: 'Bear market dalam', ek: -0.40, ob: -0.10, dg: -0.70, pr: -0.10, bs: -0.35, penghasilan: -0.20, bulanTanpaPenghasilan: 0 },
      { nama: 'Kehilangan penghasilan 6 bulan', ek: -0.10, ob: 0, dg: -0.20, pr: 0, bs: -0.50, penghasilan: -1, bulanTanpaPenghasilan: 6 },
      { nama: 'Krisis menyeluruh', ek: -0.45, ob: -0.15, dg: -0.75, pr: -0.20, bs: -0.60, penghasilan: -1, bulanTanpaPenghasilan: 12 }
    ].map(s => {
      const asetSetelah = v.ekuitas * (1 + s.ek) + v.obligasi * (1 + s.ob) + v.digital * (1 + s.dg)
        + v.properti * (1 + s.pr) + v.kas + v.ekuitasBisnis * (1 + s.bs);
      const terkurasKas = s.bulanTanpaPenghasilan * v.pengeluaranBulanan;
      const nw = asetSetelah - v.hutang - Math.max(0, terkurasKas - v.kas);
      const runway = M.bagi(v.kas, v.pengeluaranBulanan);
      const likuidSetelah = v.kas + v.ekuitas * (1 + s.ek) + v.obligasi * (1 + s.ob);
      const runwayLikuid = M.bagi(likuidSetelah, v.pengeluaranBulanan);
      return { ...s, asetSetelah, nw, penurunan: M.bagi(nw - nwAwal, nwAwal), runway, runwayLikuid,
        bertahan: runwayLikuid >= s.bulanTanpaPenghasilan };
    });

    const terburuk = skenario[skenario.length - 1];
    const runwayKas = M.bagi(v.kas, v.pengeluaranBulanan);

    const pesan = [];
    if (runwayKas < 6) pesan.push({ nada: 'kritis', judul: 'Runway kas pendek',
      teks: `Kas menutup ${F.bulan(runwayKas)} pengeluaran. Pada skenario kehilangan penghasilan, Anda akan terpaksa menjual aset — dan skenario itu biasanya bersamaan dengan pasar sedang turun.` });
    const gagal = skenario.filter(s => !s.bertahan);
    if (gagal.length) pesan.push({ nada: 'kritis', judul: 'Ada skenario yang tidak dapat Anda tahan',
      teks: `Pada skenario ${gagal.map(s => `<b>${s.nama}</b>`).join(' dan ')}, aset likuid tidak cukup menopang pengeluaran selama periode gangguan. Ini bukan soal return — ini soal apakah Anda bertahan sampai pemulihan datang.` });
    else pesan.push({ nada: 'sehat', judul: 'Bertahan di seluruh skenario',
      teks: 'Aset likuid Anda menopang pengeluaran pada semua skenario yang diuji. Ini yang memungkinkan Anda tidak menjual di titik terburuk.' });
    pesan.push({ nada: 'info', judul: 'Bacaan yang tepat',
      teks: `Pada skenario terburuk, kekayaan bersih turun ${F.persen(Math.abs(terburuk.penurunan))} menjadi ${F.rpRingkas(terburuk.nw)}. Pertanyaannya bukan apakah angka itu nyaman, tetapi apakah Anda akan tetap memegang rencana ketika layar menunjukkan angka itu.` });

    return {
      metrik: [
        { label: 'Kekayaan bersih saat ini', nilai: nwAwal, format: 'rupiah-ringkas', sorot: true },
        { label: 'Runway kas murni', nilai: runwayKas, format: 'bulan',
          nada: runwayKas >= 6 ? 'sehat' : runwayKas >= 3 ? 'waspada' : 'kritis' },
        { label: 'Skenario terburuk', nilai: terburuk.nw, format: 'rupiah-ringkas', nada: 'kritis' },
        { label: 'Penurunan maksimal', nilai: terburuk.penurunan, format: 'persen', nada: 'kritis' }
      ],
      pesan,
      tabel: { judul: 'Hasil per skenario', kolom: [
          { k: 'nama', label: 'Skenario' }, { k: 'nw', label: 'Kekayaan bersih', n: true, format: 'rupiah-ringkas' },
          { k: 'penurunan', label: 'Perubahan', n: true, format: 'persen' },
          { k: 'runwayT', label: 'Runway likuid', n: true },
          { k: 'st', label: 'Bertahan?', html: true }
        ], baris: skenario.map(s => ({ ...s, runwayT: F.bulan(s.runwayLikuid),
          st: s.bertahan ? C.lencana('sehat', 'Ya') : C.lencana('kritis', 'Tidak') })) },
      narasi: '<p>Uji ini memakai guncangan bersamaan karena itulah yang terjadi di dunia nyata. Portofolio yang tampak terdiversifikasi pada kondisi normal sering bergerak searah pada saat tekanan — korelasi cenderung naik justru ketika Anda paling membutuhkannya rendah.</p>'
    };
  }
},

/* ---------------------------------------------------------- I6 */
{
  id: 'i6-penarikan', kat: 'investor', kode: 'I6', ikon: '⇣',
  nama: 'Tingkat Penarikan Berkelanjutan',
  ringkas: 'Berapa yang benar-benar boleh dibelanjakan tanpa menggerus daya beli.',
  intro: 'Kesalahan yang mahal: mengasumsikan seluruh imbal hasil instrumen bisa dibelanjakan. Bila kupon 7% dan inflasi 4%, hanya sekitar 3% yang benar-benar tersedia — sisanya harus disisihkan agar pokok tidak menyusut nilainya.',
  input: [
    { k: 'portofolio', label: 'Nilai portofolio', tipe: 'rupiah', awal: 9000000000 },
    { k: 'usiaMulai', label: 'Usia mulai menarik', tipe: 'angka', awal: 50, satuan: 'tahun' },
    { k: 'hasilKotor', label: 'Imbal hasil kotor portofolio', tipe: 'persen', awal: 0.07 },
    { k: 'inflasi', label: 'Asumsi inflasi', tipe: 'persen', awal: 0.04 },
    { k: 'pajak', label: 'Pajak efektif atas hasil investasi', tipe: 'persen', awal: 0.10 },
    { k: 'rencanaTarik', label: 'Rencana penarikan bulanan', tipe: 'rupiah', awal: 45000000 }
  ],
  hitung(v) {
    const pr = M.tingkatPenarikan(v.usiaMulai);
    const amanTahunan = v.portofolio * pr.rate;
    const amanBulanan = amanTahunan / 12;
    const belanjaable = M.penarikanBelanjaable(v.hasilKotor, v.inflasi, v.hasilKotor * v.pajak);
    const rencanaRate = M.bagi(v.rencanaTarik * 12, v.portofolio);
    const modalDibutuhkan = M.bagi(v.rencanaTarik * 12, pr.rate);
    const gap = modalDibutuhkan - v.portofolio;
    const bahaya = rencanaRate >= v.hasilKotor * 0.9;

    const pesan = [];
    pesan.push({ nada: 'info', judul: 'Tiga angka yang berbeda',
      teks: `Imbal hasil kotor <b>${F.persen(v.hasilKotor)}</b>. Setelah pajak ${F.persen(v.pajak)}: ${F.persen(v.hasilKotor * (1 - v.pajak))}. Setelah menyisihkan inflasi ${F.persen(v.inflasi)}: hanya <b>${F.persen(belanjaable)}</b> yang benar-benar dapat dibelanjakan tanpa menggerus daya beli pokok.` });
    if (bahaya) pesan.push({ nada: 'kritis', judul: 'Rencana penarikan terlalu agresif',
      teks: `Anda merencanakan menarik ${F.persen(rencanaRate)} per tahun, mendekati atau melampaui imbal hasil kotor ${F.persen(v.hasilKotor)}. Tidak ada yang tersisa untuk melawan inflasi — daya beli portofolio akan tergerus setiap tahun, dan penurunannya mempercepat diri sendiri.` });
    if (rencanaRate > pr.rate) pesan.push({ nada: 'waspada', judul: 'Di atas tingkat penarikan aman',
      teks: `Rencana ${F.persen(rencanaRate)} versus tingkat aman ${F.persen(pr.rate, 2)} untuk horizon ${pr.horizon}. Agar penarikan ${F.rpRingkas(v.rencanaTarik)} per bulan berkelanjutan, portofolio perlu mencapai ${F.rpRingkas(modalDibutuhkan)} — kekurangan ${F.rpRingkas(gap)}.` });
    else pesan.push({ nada: 'sehat', judul: 'Rencana berada dalam batas aman',
      teks: `Penarikan ${F.persen(rencanaRate)} berada di bawah tingkat aman ${F.persen(pr.rate, 2)}.` });

    return {
      metrik: [
        { label: 'Tingkat penarikan aman', nilai: pr.rate, format: 'persen2', sorot: true, ket: `Horizon ${pr.horizon}` },
        { label: 'Penarikan aman / bulan', nilai: amanBulanan, format: 'rupiah' },
        { label: 'Rencana penarikan / bulan', nilai: v.rencanaTarik, format: 'rupiah',
          nada: rencanaRate > pr.rate ? 'kritis' : 'sehat' },
        { label: 'Setara tingkat penarikan', nilai: rencanaRate, format: 'persen2' },
        { label: 'Hasil yang benar-benar dapat dibelanjakan', nilai: belanjaable, format: 'persen2',
          nada: belanjaable <= 0 ? 'kritis' : 'waspada' },
        { label: 'Modal dibutuhkan untuk rencana ini', nilai: modalDibutuhkan, format: 'rupiah-ringkas' }
      ],
      pesan,
      tabel: { judul: 'Tingkat penarikan menurut usia mulai', kolom: [
          { k: 'usia', label: 'Usia mulai' }, { k: 'horizon', label: 'Horizon' },
          { k: 'rate', label: 'Tingkat penarikan', n: true, format: 'persen2' },
          { k: 'bulanan', label: 'Setara per bulan', n: true, format: 'rupiah' }
        ], baris: K.penarikan.map(p => ({
          usia: p.minUsia === 0 ? 'Di bawah 40' : p.minUsia + '+', horizon: p.horizon, rate: p.rate,
          bulanan: v.portofolio * p.rate / 12, _tekan: p.rate === pr.rate })) }
    };
  }
}
];

function renderPetaModal(p) {
  const simpul = PETA_SIMPUL.filter(s => !s.hanyaUsaha || p.punyaUsaha);
  let sudahBerhenti = false;
  const html = simpul.map((s, i) => {
    const lolos = s.lolos(p);
    let kelas = 'lewat';
    if (sudahBerhenti) kelas = '';
    else if (!lolos) { kelas = 'aktif'; sudahBerhenti = true; }
    else if (s.akhir) kelas = 'aktif';
    const tanda = kelas === 'lewat' ? '✓' : kelas === 'aktif' ? '▸' : (i + 1);
    const isiCabang = s.k === 'usaha' ? (p.punyaUsaha ? 'Ya — lanjut ke evaluasi modal kerja dan ROIC.' : 'Tidak — langsung ke portofolio investasi.') : s.d;
    return `${i ? `<div class="penghubung ${kelas === 'lewat' || (kelas === '' && !sudahBerhenti) ? 'lewat' : ''}"></div>` : ''}
      <div class="simpul ${kelas}">
        <div class="bulat">${tanda}</div>
        <div class="isi"><div class="t">${F.esc(s.t)}</div><div class="d">${F.esc(isiCabang)}${kelas === 'aktif' && s.aksi ? ' <b>→ ' + F.esc(s.aksi) + '</b>' : ''}</div></div>
      </div>`;
  }).join('');
  return `<div class="peta"><h3>Peta Modal — ke mana rupiah berikutnya harus pergi</h3>
    <div class="ket">Setiap surplus melewati gerbang yang sama, berurutan. Gerbang yang belum lulus menghentikan sisanya — bukan karena kaku, tetapi karena melompatinya membuat langkah berikutnya rapuh.</div>
    <div class="peta-alur">${html}</div></div>`;
}

    </div>

    <div class="aksi-baris"><button class="tbl-btn b-utama" id="cetak">Cetak / simpan PDF</button></div>
    <div class="kaki"><b>Catatan wajib</b><ol>${K.disclaimer.map(d => `<li>${F.esc(d)}</li>`).join('')}</ol></div>`;
  }
};


/* ========== 90-aplikasi.js ========== */
/* ============================================================
   90 — RENDERER & SHELL APLIKASI
   Renderer bersifat generik: tidak ada kode khusus per modul.
   ============================================================ */
const SEMUA = [].concat(KAT_DIAGNOSIS, KAT_PERSONAL, KAT_HUTANG, KAT_BISNIS, KAT_INVESTOR);
const KATEGORI = [
  { id: 'diagnosis', nama: 'Diagnosis' },
  { id: 'personal', nama: 'Keuangan Personal' },
  { id: 'hutang', nama: 'Hutang & Proteksi' },
  { id: 'bisnis', nama: 'Bisnis' },
  { id: 'investor', nama: 'Investor' }
];

/* Nilai berjalan per modul, disimpan di memori (dan localStorage bila tersedia). */
const NILAI = {};
const Simpan = {
  ada: (() => { try { const k = '__fps'; localStorage.setItem(k, '1'); localStorage.removeItem(k); return true; } catch (e) { return false; } })(),
  muat() { if (!this.ada) return; try { Object.assign(NILAI, JSON.parse(localStorage.getItem('fps-nilai') || '{}')); } catch (e) {} },
  tulis() { if (!this.ada) return; try { localStorage.setItem('fps-nilai', JSON.stringify(NILAI)); } catch (e) {} }
};

function nilaiAwal(modul) {
  if (NILAI[modul.id]) return NILAI[modul.id];
  const v = {};
  modul.input.forEach(i => {
    v[i.k] = i.tipe === 'daftar' ? JSON.parse(JSON.stringify(i.awal || [])) : i.awal;
  });
  NILAI[modul.id] = v;
  return v;
}

/* ---------- Pembangun formulir ---------- */

function bidangInput(i, nilai, modulId) {
  const id = `f-${modulId}-${i.k}`;
  const hint = i.hint ? `<span class="hint" id="${id}-h">${F.esc(i.hint)}</span>` : '';
  let kendali = '';

  if (i.tipe === 'pilih') {
    kendali = `<div class="masuk"><select id="${id}" data-k="${i.k}" data-tipe="pilih" aria-describedby="${id}-h">
      ${i.opsi.map(o => `<option value="${F.esc(o.v)}"${String(o.v) === String(nilai) ? ' selected' : ''}>${F.esc(o.l)}</option>`).join('')}
    </select></div>`;
  } else if (i.tipe === 'rupiah') {
    kendali = `<div class="masuk"><span class="awalan">Rp</span>
      <input id="${id}" data-k="${i.k}" data-tipe="rupiah" inputmode="numeric" autocomplete="off"
        value="${F.nf.format(Math.round(nilai || 0))}" aria-describedby="${id}-h"></div>`;
  } else if (i.tipe === 'persen') {
    kendali = `<div class="masuk">
      <input id="${id}" data-k="${i.k}" data-tipe="persen" inputmode="decimal" autocomplete="off"
        value="${F.angka((nilai || 0) * 100, 2)}" aria-describedby="${id}-h"><span class="akhiran">%</span></div>`;
  } else {
    kendali = `<div class="masuk">
      <input id="${id}" data-k="${i.k}" data-tipe="angka" inputmode="decimal" autocomplete="off"
        value="${F.angka(nilai || 0, (nilai % 1 === 0) ? 0 : 1)}" aria-describedby="${id}-h">
      ${i.satuan ? `<span class="akhiran">${F.esc(i.satuan)}</span>` : ''}</div>`;
  }
  return `<div class="bidang"><label for="${id}">${F.esc(i.label)}</label>${kendali}${hint}</div>`;
}

function tabelDinamis(i, baris, modulId) {
  const kol = i.kolom;
  const kepala = kol.map(k => `<th${k.tipe !== 'teks' ? ' class="n"' : ''}>${F.esc(k.label)}</th>`).join('') + '<th></th>';
  const isi = (baris || []).map((b, idx) => {
    const sel = kol.map(k => {
      const v = b[k.k];
      let inp;
      if (k.tipe === 'teks') inp = `<input class="sel-inp" data-baris="${idx}" data-kol="${k.k}" data-tipe="teks" value="${F.esc(v ?? '')}">`;
      else if (k.tipe === 'rupiah') inp = `<input class="sel-inp n" data-baris="${idx}" data-kol="${k.k}" data-tipe="rupiah" inputmode="numeric" value="${F.nf.format(Math.round(v || 0))}">`;
      else if (k.tipe === 'persen') inp = `<input class="sel-inp n" data-baris="${idx}" data-kol="${k.k}" data-tipe="persen" inputmode="decimal" value="${F.angka((v || 0) * 100, 2)}">`;
      else inp = `<input class="sel-inp n" data-baris="${idx}" data-kol="${k.k}" data-tipe="angka" inputmode="decimal" value="${F.angka(v || 0, (v % 1 === 0) ? 0 : 1)}">`;
      return `<td>${inp}</td>`;
    }).join('');
    return `<tr>${sel}<td><button class="hapus-baris" data-baris="${idx}" title="Hapus baris" aria-label="Hapus baris">×</button></td></tr>`;
  }).join('');
  return `<div class="bidang" style="grid-column:1/-1">
    <label>${F.esc(i.label)}</label>
    <div class="tbl-bungkus tbl-dinamis"><table><thead><tr>${kepala}</tr></thead><tbody>${isi}</tbody></table></div>
    <button class="tbl-btn b-garis tambah-baris" data-k="${i.k}" style="align-self:flex-start;margin-top:9px;padding:6px 13px;font-size:12.6px">+ Tambah baris</button>
  </div>`;
}

function bangunFormulir(modul, v) {
  const grup = {};
  modul.input.forEach(i => { const g = i.grup || '__'; (grup[g] = grup[g] || []).push(i); });
  return Object.entries(grup).map(([nama, daftar]) => {
    const isi = daftar.map(i => i.tipe === 'daftar'
      ? tabelDinamis(i, v[i.k], modul.id) : bidangInput(i, v[i.k], modul.id)).join('');
    const judul = nama === '__' ? 'Masukan' : nama;
    return `<div class="kartu"><div class="kartu-jud">${F.esc(judul)}</div><div class="grid">${isi}</div></div>`;
  }).join('');
}

/* ---------- Renderer laporan ---------- */

function bangunLaporan(modul, v) {
  let h;
  try { h = modul.hitung(v); }
  catch (e) { return C.pesan({ nada: 'kritis', judul: 'Perhitungan gagal', teks: 'Periksa kembali masukan Anda. Detail: ' + F.esc(e.message) }); }

  let out = '';
  if (h.metrik && h.metrik.length) out += `<div class="kartu"><div class="kartu-jud">Hasil</div>${C.metrikGrid(h.metrik)}
    ${h.bilah ? C.bilah(h.bilah.nilai, h.bilah.ambang, h.bilah.naik, h.bilah.format) : ''}</div>`;
  if (h.pesan && h.pesan.length) out += `<div class="kartu"><div class="kartu-jud">Diagnosis &amp; Peringatan</div>${h.pesan.map(p => C.pesan(p)).join('')}</div>`;
  if (h.grafikHtml) out += `<div class="kartu"><div class="kartu-jud">${F.esc(h.grafikJudul || 'Visualisasi')}</div>${h.grafikHtml}</div>`;
  if (h.tabel) out += `<div class="kartu"><div class="kartu-jud">${F.esc(h.tabel.judul || 'Rincian')}</div>${C.tabel(h.tabel)}</div>`;
  if (h.narasi) out += `<div class="kartu"><div class="kartu-jud">Catatan</div><div class="prosa">${h.narasi}</div></div>`;
  if (h.petaModal) out += renderPetaModal(PROFIL);
  return out;
}

/* ---------- Halaman modul ---------- */

function halamanModul(modul) {
  const v = nilaiAwal(modul);
  const kat = KATEGORI.find(k => k.id === modul.kat);
  return `
    <div class="jejak">${F.esc(kat ? kat.nama : '')} · ${modul.kode}</div>
    <h1 class="judul">${F.esc(modul.nama)}</h1>
    <p class="deskripsi">${F.esc(modul.intro || modul.ringkas)}</p>
    <div id="formulir" style="margin-top:20px">${bangunFormulir(modul, v)}</div>
    <div id="laporan">${bangunLaporan(modul, v)}</div>
    <div class="aksi-baris">
      <button class="tbl-btn b-garis" id="atur-ulang">Kembalikan nilai contoh</button>
      <button class="tbl-btn b-garis" id="cetak">Cetak / simpan PDF</button>
    </div>
    <div class="kaki"><b>Catatan wajib</b><ol>${K.disclaimer.map(d => `<li>${F.esc(d)}</li>`).join('')}</ol></div>`;
}

/* ---------- Rel navigasi ---------- */

function bangunRel(filter = '') {
  const q = filter.trim().toLowerCase();
  const cocok = m => !q || (m.nama + ' ' + m.ringkas + ' ' + m.kode).toLowerCase().includes(q);
  let html = '';
  const halamanUmum = [['beranda', HALAMAN.beranda], ['ringkasan', HALAMAN.ringkasan]];
  html += `<div class="grup-jud">Mulai</div>` + halamanUmum.map(([id, h]) =>
    `<button class="nav-item" data-halaman="${id}"><i>${h.ikon}</i>${F.esc(h.nama)}</button>`).join('');

  KATEGORI.forEach(k => {
    const modul = SEMUA.filter(m => m.kat === k.id && cocok(m));
    if (!modul.length) return;
    html += `<div class="grup-jud">${F.esc(k.nama)}</div>`;
    html += modul.map(m => `<button class="nav-item" data-modul="${m.id}" title="${F.esc(m.ringkas)}">
      <i>${m.ikon}</i>${F.esc(m.nama)}</button>`).join('');
  });

  const bacaan = [['prinsip', HALAMAN.prinsip], ['kesalahan', HALAMAN.kesalahan], ['glosarium', HALAMAN.glosarium]]
    .filter(([id, h]) => !q || h.nama.toLowerCase().includes(q));
  if (bacaan.length) {
    html += `<div class="grup-jud">Bacaan</div>` + bacaan.map(([id, h]) =>
      `<button class="nav-item" data-halaman="${id}"><i>${h.ikon}</i>${F.esc(h.nama)}</button>`).join('');
  }
  if (q && !SEMUA.some(cocok) && !bacaan.length) html += `<div class="nav-kosong">Tidak ada modul yang cocok dengan "${F.esc(filter)}".</div>`;
  return html;
}

/* ---------- Routing & interaksi ---------- */

let modulAktif = null, halamanAktif = 'beranda';

function tandaiAktif() {
  document.querySelectorAll('.nav-item').forEach(b => {
    const aktif = (modulAktif && b.dataset.modul === modulAktif.id) ||
      (!modulAktif && b.dataset.halaman === halamanAktif);
    b.classList.toggle('aktif', !!aktif);
  });
}

function buka(kunci) {
  const modul = SEMUA.find(m => m.id === kunci);
  const utama = document.getElementById('utama');
  if (modul) { modulAktif = modul; halamanAktif = null; utama.innerHTML = halamanModul(modul); }
  else { modulAktif = null; halamanAktif = HALAMAN[kunci] ? kunci : 'beranda'; utama.innerHTML = HALAMAN[halamanAktif].render(); }
  utama.scrollTop = 0; window.scrollTo(0, 0);
  tandaiAktif();
  tutupDrawer();
  try { history.replaceState(null, '', '#' + (modulAktif ? modulAktif.id : halamanAktif)); } catch (e) {}
  kirimTinggi();
}

function perbaruiLaporan() {
  if (!modulAktif) return;
  document.getElementById('laporan').innerHTML = bangunLaporan(modulAktif, NILAI[modulAktif.id]);
  Simpan.tulis();
  kirimTinggi();
}

/** Menulis nilai dari sebuah input ke state, menjaga posisi kursor untuk format Rupiah. */
function tulisNilai(el) {
  const tipe = el.dataset.tipe;
  let angka;
  if (tipe === 'teks') angka = el.value;
  else if (tipe === 'persen') angka = F.urai(el.value) / 100;
  else angka = F.urai(el.value);

  if (tipe === 'rupiah') {
    const kursorAwal = el.selectionStart;
    const digitSebelum = el.value.slice(0, kursorAwal).replace(/\D/g, '').length;
    el.value = F.nf.format(Math.round(angka));
    let hitung = 0, pos = el.value.length;
    for (let i = 0; i < el.value.length; i++) {
      if (/\d/.test(el.value[i])) hitung++;
      if (hitung === digitSebelum) { pos = i + 1; break; }
    }
    if (digitSebelum === 0) pos = 0;
    try { el.setSelectionRange(pos, pos); } catch (e) {}
  }
  return angka;
}

function pasangInteraksi() {
  const root = document.getElementById('fps');

  root.addEventListener('input', e => {
    const el = e.target;

    if (el.id === 'cari-modul') {
      document.getElementById('rel-nav').innerHTML = bangunRel(el.value);
      tandaiAktif(); return;
    }
    if (!modulAktif) return;
    const v = NILAI[modulAktif.id];

    if (el.classList.contains('sel-inp')) {
      const spek = modulAktif.input.find(i => i.tipe === 'daftar');
      if (!spek) return;
      const idx = +el.dataset.baris, kol = el.dataset.kol;
      v[spek.k][idx][kol] = tulisNilai(el);
      perbaruiLaporan(); return;
    }
    if (el.dataset.k) { v[el.dataset.k] = tulisNilai(el); perbaruiLaporan(); }
  });

  root.addEventListener('change', e => {
    if (!modulAktif) return;
    if (e.target.dataset.tipe === 'pilih') {
      NILAI[modulAktif.id][e.target.dataset.k] = e.target.value;
      perbaruiLaporan();
    }
  });

  root.addEventListener('click', e => {
    const nav = e.target.closest('[data-modul],[data-halaman]');
    if (nav) { buka(nav.dataset.modul || nav.dataset.halaman); return; }

    if (e.target.id === 'atur-ulang' && modulAktif) {
      delete NILAI[modulAktif.id];
      buka(modulAktif.id); return;
    }
    if (e.target.id === 'cetak') { window.print(); return; }
    if (e.target.id === 'buka-menu') { document.getElementById('rel').classList.add('buka');
      document.getElementById('tirai').classList.add('buka'); return; }
    if (e.target.id === 'tirai') { tutupDrawer(); return; }

    if (e.target.classList.contains('tambah-baris') && modulAktif) {
      const spek = modulAktif.input.find(i => i.k === e.target.dataset.k);
      const baru = {}; spek.kolom.forEach(k => baru[k.k] = k.tipe === 'teks' ? '' : 0);
      NILAI[modulAktif.id][spek.k].push(baru);
      gambarUlangFormulir(); return;
    }
    if (e.target.classList.contains('hapus-baris') && modulAktif) {
      const spek = modulAktif.input.find(i => i.tipe === 'daftar');
      NILAI[modulAktif.id][spek.k].splice(+e.target.dataset.baris, 1);
      gambarUlangFormulir(); return;
    }
  });
}

function gambarUlangFormulir() {
  document.getElementById('formulir').innerHTML = bangunFormulir(modulAktif, NILAI[modulAktif.id]);
  perbaruiLaporan();
}

function tutupDrawer() {
  const r = document.getElementById('rel'), t = document.getElementById('tirai');
  if (r) r.classList.remove('buka'); if (t) t.classList.remove('buka');
}

/** Mengirim tinggi konten ke induk agar iframe dapat menyesuaikan diri. */
function kirimTinggi() {
  try {
    if (window.parent === window) return;
    const t = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
    window.parent.postMessage({ jenis: 'fps-tinggi', tinggi: t }, '*');
  } catch (e) {}
}

/* ---------- Boot ---------- */

function mulai() {
  Simpan.muat();
  document.getElementById('rel-nav').innerHTML = bangunRel('');
  pasangInteraksi();
  const awal = (location.hash || '').replace('#', '');
  buka(awal && (SEMUA.some(m => m.id === awal) || HALAMAN[awal]) ? awal : 'beranda');
  window.addEventListener('resize', kirimTinggi);
  setInterval(kirimTinggi, 1200);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mulai);
else mulai();

})();
</script>
