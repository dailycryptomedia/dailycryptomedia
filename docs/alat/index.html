<style>
/* ============================================================
   00 — DESIGN TOKEN & GAYA DASAR
   Palet: tinta laut dalam (shell) · kertas dingin (konten)
          giok (aksi) · kuningan (sorotan) · sinyal status
   Tipografi: Plus Jakarta Sans (UI) + IBM Plex Mono (angka)
   ============================================================ */
:root{
  --tinta:#0A1E26;      --tinta-2:#12303B;   --tinta-3:#1C4553;
  --kertas:#F2F5F4;     --kertas-2:#FFFFFF;  --kertas-3:#E4EAE8;
  --giok:#12705F;       --giok-t:#0E5A4C;    --giok-m:#E3F1ED;
  --kuningan:#B4883A;   --kuningan-m:#F7EEDD;
  --sehat:#12705F;      --sehat-m:#E3F1ED;
  --waspada:#A5680F;    --waspada-m:#FBF0DC;
  --kritis:#A32F2A;     --kritis-m:#FAE7E5;
  --netral:#5A6B70;     --netral-m:#EDF1F0;
  --garis:#D2DBD8;      --garis-t:#B9C6C2;
  --teks:#0C2029;       --teks-2:#4A5F66;    --teks-3:#7B8C91;
  --r:10px; --r-l:16px;
  --bayang:0 1px 2px rgba(10,30,38,.06), 0 4px 16px rgba(10,30,38,.05);
  --bayang-l:0 2px 6px rgba(10,30,38,.08), 0 16px 40px rgba(10,30,38,.10);
  --ui:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --rail:264px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--ui);background:var(--kertas);color:var(--teks);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em;line-height:1.25}
p{margin:0 0 .85em}
a{color:var(--giok);text-underline-offset:3px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:2.5px solid var(--giok);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Kerangka ---------- */
#fps{display:grid;grid-template-columns:var(--rail) 1fr;min-height:100vh}

/* ---------- Rel navigasi ---------- */
.rel{background:var(--tinta);color:#CFDCDA;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain}
.rel-kepala{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.09)}
.rel-logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.03em}
.rel-logo span{width:26px;height:26px;border-radius:7px;background:linear-gradient(145deg,var(--giok),#1B8F79);
  display:grid;place-items:center;font-size:12px;color:#fff}
.rel-sub{font-size:11px;color:#7E9A97;margin-top:5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.cari{margin:12px 14px 4px;position:relative}
.cari input{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);
  color:#fff;border-radius:8px;padding:8px 10px 8px 30px;font-size:13px;font-family:inherit}
.cari input::placeholder{color:#7E9A97}
.cari::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-52%);color:#7E9A97;font-size:15px}
.rel-nav{flex:1;padding:8px 10px 24px}
.grup-jud{font-size:10.5px;text-transform:uppercase;letter-spacing:.11em;color:#6F8A88;
  font-weight:700;padding:14px 8px 6px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;color:#C3D3D1;
  padding:7px 9px;border-radius:7px;text-align:left;font-size:13.2px;line-height:1.35;transition:.13s}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.aktif{background:var(--giok);color:#fff;font-weight:600}
.nav-item i{font-style:normal;font-size:13px;width:16px;text-align:center;opacity:.85}
.nav-kosong{padding:10px;font-size:12.5px;color:#6F8A88}

/* ---------- Konten ---------- */
.utama{min-width:0;padding:26px 30px 80px;max-width:1120px}
.jejak{font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--teks-3);font-weight:700;margin-bottom:7px}
.judul{font-size:29px;margin-bottom:8px}
.deskripsi{color:var(--teks-2);max-width:66ch;font-size:14.6px}

/* ---------- Kartu ---------- */
.kartu{background:var(--kertas-2);border:1px solid var(--garis);border-radius:var(--r-l);
  padding:20px 22px;box-shadow:var(--bayang);margin-bottom:18px}
.kartu-jud{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--teks-3);
  font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.kartu-jud::after{content:'';flex:1;height:1px;background:var(--garis)}

/* ---------- Formulir ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.bidang{display:flex;flex-direction:column;gap:5px}
.bidang label{font-size:13px;font-weight:600;color:var(--teks)}
.bidang .hint{font-size:11.6px;color:var(--teks-3);line-height:1.4}
.masuk{display:flex;align-items:stretch;border:1.5px solid var(--garis);border-radius:var(--r);
  background:var(--kertas-2);overflow:hidden;transition:.14s}
.masuk:focus-within{border-color:var(--giok);box-shadow:0 0 0 3px var(--giok-m)}
.masuk .awalan,.masuk .akhiran{display:grid;place-items:center;padding:0 10px;background:var(--kertas);
  color:var(--teks-3);font-size:12.5px;font-weight:600;border-right:1.5px solid var(--garis);white-space:nowrap}
.masuk .akhiran{border-right:0;border-left:1.5px solid var(--garis)}
.masuk input,.masuk select{flex:1;min-width:0;border:0;outline:0;background:none;padding:9px 11px;
  font-family:var(--mono);font-size:14.5px;color:var(--teks);font-variant-numeric:tabular-nums}
.masuk select{font-family:var(--ui);font-size:13.6px}
.masuk input[type=range]{padding:0 10px}

/* ---------- Metrik ---------- */
.metrik-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.metrik{border:1px solid var(--garis);border-radius:var(--r);padding:13px 15px;background:var(--kertas-2)}
.metrik .lbl{font-size:11.4px;color:var(--teks-3);font-weight:600;text-transform:uppercase;
  letter-spacing:.05em;line-height:1.3;margin-bottom:5px}
.metrik .nil{font-family:var(--mono);font-size:20px;font-weight:600;letter-spacing:-.035em;line-height:1.2}
.metrik .ket{font-size:11.6px;color:var(--teks-3);margin-top:4px;line-height:1.35}
.metrik.sorot{background:var(--giok);border-color:var(--giok);color:#fff}
.metrik.sorot .lbl,.metrik.sorot .ket{color:rgba(255,255,255,.8)}
.metrik.sehat{background:var(--sehat-m);border-color:#A9D3C8}
.metrik.sehat .nil{color:var(--sehat)}
.metrik.waspada{background:var(--waspada-m);border-color:#E3C692}
.metrik.waspada .nil{color:var(--waspada)}
.metrik.kritis{background:var(--kritis-m);border-color:#E5B4B0}
.metrik.kritis .nil{color:var(--kritis)}

/* ---------- Lencana status ---------- */
.lencana{display:inline-flex;align-items:center;gap:5px;font-size:11.4px;font-weight:700;
  padding:3px 9px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.lencana::before{content:'';width:6px;height:6px;border-radius:99px;background:currentColor}
.l-sehat{background:var(--sehat-m);color:var(--sehat)}
.l-waspada{background:var(--waspada-m);color:var(--waspada)}
.l-kritis{background:var(--kritis-m);color:var(--kritis)}
.l-netral{background:var(--netral-m);color:var(--netral)}

/* ---------- Pesan / peringatan ---------- */
.pesan{display:flex;gap:11px;border-radius:var(--r);padding:12px 15px;font-size:13.4px;
  line-height:1.55;margin-bottom:10px;border:1px solid}
.pesan b{font-weight:700}
.pesan .ikon{font-size:14px;line-height:1.5;flex-shrink:0}
.p-kritis{background:var(--kritis-m);border-color:#E5B4B0;color:#7A2320}
.p-waspada{background:var(--waspada-m);border-color:#E3C692;color:#7A4D0B}
.p-sehat{background:var(--sehat-m);border-color:#A9D3C8;color:#0C4E42}
.p-info{background:var(--netral-m);border-color:var(--garis);color:var(--teks-2)}

/* ---------- Tabel ---------- */
.tbl-bungkus{overflow-x:auto;border:1px solid var(--garis);border-radius:var(--r);background:var(--kertas-2)}
table{width:100%;border-collapse:collapse;font-size:13.3px}
th{text-align:left;font-size:11.2px;text-transform:uppercase;letter-spacing:.06em;color:var(--teks-3);
  font-weight:700;padding:10px 13px;background:var(--kertas);border-bottom:1px solid var(--garis);white-space:nowrap}
td{padding:9px 13px;border-bottom:1px solid var(--kertas-3)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--kertas)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
th.n{font-family:var(--ui)}
tr.tekan td{background:var(--giok-m);font-weight:600}

/* ---------- Tombol ---------- */
.tbl-btn{display:inline-flex;align-items:center;gap:7px;border-radius:9px;padding:9px 16px;
  font-size:13.4px;font-weight:600;border:1.5px solid transparent;transition:.14s}
.b-utama{background:var(--giok);color:#fff}
.b-utama:hover{background:var(--giok-t)}
.b-garis{background:var(--kertas-2);border-color:var(--garis-t);color:var(--teks)}
.b-garis:hover{border-color:var(--giok);color:var(--giok)}
.aksi-baris{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}

/* ---------- Bilah ambang ---------- */
.bilah{height:7px;border-radius:99px;background:var(--kertas-3);position:relative;overflow:hidden;margin-top:8px}
.bilah i{position:absolute;inset:0 auto 0 0;border-radius:99px;display:block}
.bilah-lbl{display:flex;justify-content:space-between;font-size:10.8px;color:var(--teks-3);
  margin-top:5px;font-family:var(--mono)}

/* ---------- Beranda / kisi modul ---------- */
.kisi{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:13px}
.ubin{text-align:left;background:var(--kertas-2);border:1px solid var(--garis);border-radius:var(--r-l);
  padding:16px 17px;transition:.15s;display:flex;flex-direction:column;gap:6px}
.ubin:hover{border-color:var(--giok);transform:translateY(-2px);box-shadow:var(--bayang-l)}
.ubin .kd{font-family:var(--mono);font-size:10.6px;color:var(--giok);font-weight:600;letter-spacing:.04em}
.ubin .nm{font-weight:700;font-size:14.6px;letter-spacing:-.015em}
.ubin .rk{font-size:12.6px;color:var(--teks-2);line-height:1.45}

/* ---------- Peta Modal (elemen tanda tangan) ---------- */
.peta{background:var(--tinta);border-radius:var(--r-l);padding:22px 24px;color:#CFDCDA;margin-bottom:18px}
.peta h3{color:#fff;font-size:16px;margin-bottom:3px}
.peta .ket{font-size:12.7px;color:#8FA9A6;margin-bottom:18px}
.peta-alur{display:flex;flex-direction:column;gap:0}
.simpul{display:flex;align-items:flex-start;gap:13px;padding:9px 0}
.simpul .bulat{width:26px;height:26px;border-radius:99px;border:2px solid rgba(255,255,255,.2);
  display:grid;place-items:center;font-size:11px;font-family:var(--mono);flex-shrink:0;
  color:#7E9A97;background:rgba(255,255,255,.04)}
.simpul .isi{flex:1;min-width:0}
.simpul .t{font-size:13.6px;font-weight:600;color:#9FB5B2}
.simpul .d{font-size:12.2px;color:#6F8A88;line-height:1.45}
.simpul.lewat .bulat{border-color:var(--giok);background:var(--giok);color:#fff}
.simpul.lewat .t{color:#CFDCDA}
.simpul.aktif .bulat{border-color:var(--kuningan);background:var(--kuningan);color:#fff;
  box-shadow:0 0 0 5px rgba(180,136,58,.22)}
.simpul.aktif .t{color:#fff;font-weight:700}
.simpul.aktif .d{color:#C8B896}
.penghubung{width:2px;height:13px;background:rgba(255,255,255,.14);margin-left:12px}
.penghubung.lewat{background:var(--giok)}

/* ---------- Prosa (prinsip, glosarium) ---------- */
.prosa{max-width:74ch}
.prosa h3{font-size:17px;margin:26px 0 8px}
.prosa ol,.prosa ul{padding-left:20px;margin:0 0 14px}
.prosa li{margin-bottom:6px;font-size:14.2px;color:var(--teks-2)}
.prosa li b{color:var(--teks)}
.akordeon{border:1px solid var(--garis);border-radius:var(--r);background:var(--kertas-2);margin-bottom:8px;overflow:hidden}
.akordeon summary{padding:12px 16px;font-weight:600;font-size:14px;cursor:pointer;list-style:none;
  display:flex;justify-content:space-between;gap:10px;align-items:center}
.akordeon summary::-webkit-details-marker{display:none}
.akordeon summary::after{content:'+';font-family:var(--mono);color:var(--giok);font-size:16px}
.akordeon[open] summary::after{content:'−'}
.akordeon .badan{padding:0 16px 14px;font-size:13.6px;color:var(--teks-2);line-height:1.6}

/* ---------- Catatan kaki ---------- */
.kaki{margin-top:34px;padding-top:18px;border-top:1px solid var(--garis);font-size:11.8px;color:var(--teks-3);line-height:1.6}
.kaki ol{padding-left:17px;margin:6px 0 0}

/* ---------- Bilah atas seluler ---------- */
.atas{display:none;position:sticky;top:0;z-index:30;background:var(--tinta);color:#fff;
  padding:11px 15px;align-items:center;gap:11px}
.atas button{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:8px;padding:6px 11px;font-size:16px;line-height:1}

@media (max-width:900px){
  #fps{grid-template-columns:1fr}
  .atas{display:flex}
  .rel{position:fixed;inset:0 auto 0 0;width:min(288px,86vw);z-index:40;
    transform:translateX(-100%);transition:transform .22s ease;box-shadow:var(--bayang-l)}
  .rel.buka{transform:none}
  .tirai{position:fixed;inset:0;background:rgba(10,30,38,.5);z-index:35;display:none}
  .tirai.buka{display:block}
  .utama{padding:18px 15px 70px}
  .judul{font-size:23px}
}
@media print{
  .rel,.atas,.aksi-baris,.cari{display:none!important}
  #fps{grid-template-columns:1fr}
  .kartu{break-inside:avoid;box-shadow:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Tabel input dinamis ---------- */
.tbl-dinamis table{font-size:13px}
.tbl-dinamis th{padding:8px 10px}
.tbl-dinamis td{padding:5px 7px}
.tbl-dinamis tbody tr:hover{background:transparent}
.sel-inp{width:100%;min-width:96px;border:1.5px solid var(--garis);border-radius:7px;padding:6px 9px;
  font-family:var(--mono);font-size:13px;background:var(--kertas-2);color:var(--teks);
  font-variant-numeric:tabular-nums;transition:.13s}
.sel-inp:not(.n){font-family:var(--ui);min-width:150px}
.sel-inp.n{text-align:right}
.sel-inp:focus{outline:0;border-color:var(--giok);box-shadow:0 0 0 3px var(--giok-m)}
.hapus-baris{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--garis);
  background:var(--kertas-2);color:var(--teks-3);font-size:15px;line-height:1;padding:0;transition:.13s}
.hapus-baris:hover{border-color:var(--kritis);color:var(--kritis);background:var(--kritis-m)}

/* ---------- Pita induk ManajerDanaKripto ---------- */
:root{--mdk-bar:48px}
.mdk-bar{height:var(--mdk-bar);background:#0A1E26;border-bottom:1px solid rgba(255,255,255,.10);
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:0 16px;
  font-family:var(--ui);font-size:13px}
.mdk-merek{display:flex;align-items:center;gap:9px;color:#fff;text-decoration:none;
  font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.mdk-logo{display:inline-flex;align-items:center;justify-content:center;padding:0 7px;height:26px;
  border-radius:7px;background:var(--giok);color:#fff;font-size:10px;font-weight:800;letter-spacing:.04em}
.mdk-nav{display:flex;align-items:center;gap:16px;white-space:nowrap;overflow:hidden}
.mdk-nav a{color:#B9CBC7;text-decoration:none;transition:color .13s}
.mdk-nav a:hover{color:#fff;text-decoration:underline}
.mdk-nav a.mdk-balik{color:#fff;font-weight:600}
/* Perbaikan: .tirai hanya diberi display:none di dalam @media (max-width:900px),
   sehingga di layar lebar ia menjadi item grid kosong yang menggeser .utama
   ke kolom 1 baris 2. Aturan dasar di bawah mengembalikan tata letak dua kolom.
   .tirai.buka (dua kelas) tetap menang di ponsel, jadi laci menu normal. */
.tirai{display:none}
#fps{min-height:calc(100vh - var(--mdk-bar))}
.rel{height:calc(100vh - var(--mdk-bar))}
@media (max-width:760px){ .mdk-nav a:not(.mdk-balik){display:none} }
@media (max-width:900px){ .rel{height:auto} }
@media print{ .mdk-bar{display:none!important} }

</style>
</head>
<body>

<header class="mdk-bar">
  <a class="mdk-merek" href="/">
    <span class="mdk-logo">DCM</span>DAILY CRYPTO MEDIA
  </a>
  <nav class="mdk-nav" aria-label="Navigasi situs induk">
    <a href="/#berita">Semua Berita</a>
    <a href="/#buletin">Buletin</a>
    <a class="mdk-balik" href="/">&larr; Beranda</a>
  </nav>
</header>

<div id="fps">
  <div class="atas">
    <button id="buka-menu" aria-label="Buka menu">☰</button>
    <strong style="font-size:14px;letter-spacing:-.02em">Financial Planning System</strong>
  </div>

  <aside class="rel" id="rel">
    <div class="rel-kepala">
      <div class="rel-logo"><span>FP</span>Financial Planning System</div>
      <div class="rel-sub">Diagnosis · Hitung · Putuskan</div>
    </div>
    <div class="cari"><input id="cari-modul" type="search" placeholder="Cari modul…" aria-label="Cari modul" autocomplete="off"></div>
    <nav class="rel-nav" id="rel-nav" aria-label="Navigasi modul"></nav>
  </aside>

  <div class="tirai" id="tirai"></div>
  <main class="utama" id="utama"></main>
</div>

<script>

/* ========== 11-mesin.js ========== */
/* ============================================================
   11 — MESIN PERHITUNGAN INTI
   Seluruh fungsi di sini adalah PURE FUNCTION: tanpa efek samping,
   tanpa sentuhan DOM. Semua modul kalkulator memanggil dari sini.
   ============================================================ */
const M = {

  /* ---------- Utilitas dasar ---------- */

  /** Pembagian aman. Mengembalikan null (bukan NaN/Infinity) bila tidak bermakna. */
  bagi(a, b) {
    if (!isFinite(a) || !isFinite(b) || b === 0) return null;
    const h = a / b;
    return isFinite(h) ? h : null;
  },

  jepit(x, min, max) { return Math.max(min, Math.min(max, x)); },

  /** Konversi return tahunan → return bulanan efektif (bukan r/12). */
  bulanan(rTahunan) { return Math.pow(1 + rTahunan, 1 / 12) - 1; },

  /* ---------- 2.2  Nilai masa depan & waktu ke target ---------- */

  /**
   * Nilai masa depan: modal awal + anuitas kontribusi.
   * FV = PV(1+r)^n + PMT[((1+r)^n − 1)/r]
   * Kesalahan yang dicegah: menambahkan PMT × n tanpa compounding.
   */
  nilaiMasaDepan(pv, pmt, r, n) {
    if (n <= 0) return pv;
    if (r === 0) return pv + pmt * n;
    const f = Math.pow(1 + r, n);
    return pv * f + pmt * ((f - 1) / r);
  },

  /**
   * Waktu (tahun) hingga portofolio mencapai target.
   * Iterasi bulanan agar akurat; return dikonversi ke bulanan efektif.
   */
  waktuKeTarget(pv, pmtBulanan, rTahunan, target, maksTahun = 60) {
    if (pv >= target) return 0;
    const rb = this.bulanan(rTahunan);
    const maksBulan = Math.round(maksTahun * 12);
    for (let n = 1; n <= maksBulan; n++) {
      if (this.nilaiMasaDepan(pv, pmtBulanan, rb, n) >= target) return n / 12;
    }
    return null; // tidak tercapai dalam horizon
  },

  /** Tabel sensitivitas waktu-ke-target terhadap asumsi return. */
  sensitivitasWaktu(pv, pmtBulanan, target, daftarR = [0, 0.06, 0.08, 0.10, 0.12]) {
    return daftarR.map(r => ({
      asumsi: r,
      tahun: this.waktuKeTarget(pv, pmtBulanan, r, target)
    }));
  },

  /* ---------- 2.3  Kontribusi bulanan yang dibutuhkan ---------- */

  /** PMT = (target − PV(1+r)^n) / [((1+r)^n − 1)/r] */
  kontribusiDibutuhkan(pv, target, rTahunan, tahun) {
    const n = Math.round(tahun * 12);
    if (n <= 0) return null;
    const rb = this.bulanan(rTahunan);
    const f = Math.pow(1 + rb, n);
    const sisa = target - pv * f;
    if (sisa <= 0) return 0;
    if (rb === 0) return sisa / n;
    return sisa / ((f - 1) / rb);
  },

  /* ---------- 2.4  CAGR yang dibutuhkan + pemeriksaan kewajaran ---------- */

  cagrDibutuhkan(nilaiSekarang, target, tahun) {
    if (nilaiSekarang <= 0 || tahun <= 0) return null;
    return Math.pow(target / nilaiSekarang, 1 / tahun) - 1;
  },

  klasifikasiCAGR(cagr) {
    if (cagr === null) return { kode: 'na', label: 'Tidak dapat dihitung', nada: 'netral', pesan: 'Modal awal harus lebih besar dari nol.' };
    if (cagr <= 0.08) return { kode: 'aman', label: 'Aman', nada: 'sehat', pesan: 'Dapat dicapai dengan portofolio konservatif.' };
    if (cagr <= 0.12) return { kode: 'wajar', label: 'Wajar', nada: 'sehat', pesan: 'Sesuai ekspektasi pasar jangka panjang.' };
    if (cagr <= 0.15) return { kode: 'agresif', label: 'Agresif', nada: 'waspada', pesan: 'Butuh alokasi berisiko dan disiplin tinggi. Jangan jadikan asumsi tunggal.' };
    if (cagr <= 0.20) return { kode: 'sulit', label: 'Sangat Sulit', nada: 'waspada', pesan: 'Setara rekor praktisi terbaik. Tidak layak diandalkan sebagai rencana.' };
    return { kode: 'blokir', label: 'Tidak Realistis', nada: 'kritis', pesan: 'Di atas rekor jangka panjang investor terbaik yang pernah tercatat. Return semacam ini tidak tersedia di pasar keuangan.' };
  },

  /* ---------- 2.1  Angka Kebebasan Finansial ---------- */

  ffNominal(pengeluaranBulanan, tingkatPenarikan = 0.04) {
    return this.bagi(pengeluaranBulanan * 12, tingkatPenarikan) || 0;
  },

  /** Versi riil — WAJIB untuk horizon > 5 tahun. */
  ffRiil(pengeluaranBulanan, tahunKeTarget, inflasi, tingkatPenarikan = 0.04) {
    const pengeluaranMasaDepan = pengeluaranBulanan * Math.pow(1 + inflasi, tahunKeTarget);
    return this.bagi(pengeluaranMasaDepan * 12, tingkatPenarikan) || 0;
  },

  /** Kapitalisasi arus kas pasif yang sudah ada (pensiun, sewa). */
  offsetAnuitas(penghasilanPasifBulanan, tingkatPenarikan = 0.04) {
    return this.bagi(penghasilanPasifBulanan * 12, tingkatPenarikan) || 0;
  },

  tingkatPenarikan(usiaPensiun) {
    const baris = K.penarikan.find(p => usiaPensiun >= p.minUsia);
    return baris || K.penarikan[K.penarikan.length - 1];
  },

  /* ---------- 2.6  Modul hutang ---------- */

  /**
   * Bunga efektif per periode dari skema cicilan, via bisection.
   * Mencegah kesalahan menilai beban bunga dengan total ÷ pokok.
   */
  bungaEfektif(pokok, cicilan, periode) {
    if (pokok <= 0 || cicilan <= 0 || periode <= 0) return null;
    if (cicilan * periode <= pokok) return 0; // tidak ada bunga
    let lo = 1e-9, hi = 1.0;
    for (let i = 0; i < 200; i++) {
      const mid = (lo + hi) / 2;
      const pv = cicilan * (1 - Math.pow(1 + mid, -periode)) / mid;
      if (pv > pokok) lo = mid; else hi = mid;
    }
    const perPeriode = (lo + hi) / 2;
    return { perPeriode, tahunan: Math.pow(1 + perPeriode, 12) - 1 };
  },

  /** Sisa pokok pinjaman setelah k periode dibayar. */
  sisaPokok(pokok, iPerPeriode, periode, sudahDibayar) {
    if (iPerPeriode === 0) return pokok * (1 - sudahDibayar / periode);
    const f = Math.pow(1 + iPerPeriode, periode);
    const fk = Math.pow(1 + iPerPeriode, sudahDibayar);
    return pokok * (f - fk) / (f - 1);
  },

  /** Total bunga yang dibayar sepanjang tenor. */
  totalBunga(cicilan, periode, pokok) { return Math.max(0, cicilan * periode - pokok); },

  /**
   * Prioritas pelunasan multi-hutang.
   * metode: 'longsor' (bunga tertinggi dulu) | 'bola-salju' (saldo terkecil dulu)
   */
  prioritasHutang(daftar, metode = 'longsor') {
    const salinan = daftar.map(h => ({ ...h }));
    salinan.sort((a, b) => metode === 'longsor'
      ? b.bunga - a.bunga
      : a.saldo - b.saldo);
    return salinan;
  },

  /** Simulasi pelunasan berurutan dengan dana tambahan (snowball roll-over). */
  simulasiPelunasan(daftar, danaTambahan, maksBulan = 600) {
    const h = daftar.map(x => ({ ...x, sisa: x.saldo }));
    let bulan = 0, totalBunga = 0;
    while (h.some(x => x.sisa > 0.01) && bulan < maksBulan) {
      bulan++;
      let ekstra = danaTambahan;
      for (const d of h) {
        if (d.sisa <= 0) { ekstra += d.cicilan; continue; }
        const i = d.bunga / 12;
        const bunga = d.sisa * i;
        totalBunga += bunga;
        d.sisa = Math.max(0, d.sisa + bunga - d.cicilan);
      }
      for (const d of h) {
        if (ekstra <= 0) break;
        if (d.sisa <= 0) continue;
        const bayar = Math.min(ekstra, d.sisa);
        d.sisa -= bayar; ekstra -= bayar;
        break; // seluruh ekstra ke target prioritas teratas
      }
    }
    return { bulan, totalBunga };
  },

  /* ---------- 2.7  Penarikan berkelanjutan ---------- */

  penarikanBelanjaable(hasilKotor, inflasi, pajak = 0) {
    return hasilKotor - inflasi - pajak;
  },

  /* ---------- 2.8  Rebalancing ---------- */

  /** Rebalancing lewat arus kas baru — diutamakan, tanpa biaya jual & pajak. */
  rebalanceViaKasBaru(posisi, targetBobot, kasBaru) {
    const total = posisi.reduce((s, p) => s + p.nilai, 0) + kasBaru;
    const kekurangan = posisi.map(p => {
      const targetNilai = total * (targetBobot[p.kode] || 0);
      return { ...p, targetNilai, kurang: Math.max(0, targetNilai - p.nilai) };
    });
    const totalKurang = kekurangan.reduce((s, p) => s + p.kurang, 0);
    return kekurangan.map(p => ({
      ...p,
      alokasi: totalKurang > 0 ? kasBaru * (p.kurang / totalKurang) : 0
    }));
  },

  /** Rebalancing lewat penjualan bila deviasi melewati ambang. */
  rebalanceViaJual(posisi, targetBobot, ambang = 0.05) {
    const total = posisi.reduce((s, p) => s + p.nilai, 0);
    return posisi.map(p => {
      const bobot = this.bagi(p.nilai, total) || 0;
      const target = targetBobot[p.kode] || 0;
      const deviasi = bobot - target;
      return {
        ...p, bobot, target, deviasi,
        aksi: Math.abs(deviasi) < ambang ? 'tahan' : (deviasi > 0 ? 'jual' : 'beli'),
        jumlah: Math.abs(deviasi) < ambang ? 0 : Math.abs(deviasi * total)
      };
    });
  },

  /* ---------- Portofolio ---------- */

  expectedReturn(bobot) {
    return Object.entries(bobot).reduce((s, [kode, w]) => {
      const a = K.aset[kode];
      return s + (a ? w * a.r : 0);
    }, 0);
  },

  /** Volatilitas sederhana: asumsi korelasi rata-rata 0,3 antar kelas. */
  volatilitasPortofolio(bobot, korelasi = 0.3) {
    const kode = Object.keys(bobot).filter(k => K.aset[k]);
    let v = 0;
    for (const i of kode) for (const j of kode) {
      const rho = i === j ? 1 : korelasi;
      v += bobot[i] * bobot[j] * K.aset[i].sd * K.aset[j].sd * rho;
    }
    return Math.sqrt(Math.max(0, v));
  },

  /** Indeks Herfindahl–Hirschman untuk konsentrasi. */
  hhi(bobot) { return bobot.reduce((s, w) => s + w * w, 0); },

  sharpe(rPortofolio, rBebasRisiko, volatilitas) {
    return this.bagi(rPortofolio - rBebasRisiko, volatilitas);
  },

  interpretasiSharpe(s) {
    if (s === null) return { label: '—', nada: 'netral', pesan: '' };
    if (s < 0.3) return { label: 'Di bawah rata-rata', nada: 'waspada', pesan: 'Return belum sepadan dengan risiko yang diambil.' };
    if (s < 0.5) return { label: 'Tipikal indeks ekuitas', nada: 'sehat', pesan: 'Wajar untuk portofolio long-only jangka panjang.' };
    if (s < 0.7) return { label: 'Baik', nada: 'sehat', pesan: 'Portofolio campuran yang efisien.' };
    if (s <= 1.0) return { label: 'Sangat baik', nada: 'sehat', pesan: 'Di atas rata-rata untuk portofolio long-only.' };
    return { label: 'Luar biasa — verifikasi', nada: 'waspada', pesan: 'Sharpe di atas 1,0 jarang bertahan jangka panjang tanpa leverage atau strategi khusus. Periksa kembali data historisnya.' };
  },

  /* ---------- Arus kas proyek / bisnis ---------- */

  npv(rate, arus) {
    return arus.reduce((s, cf, t) => s + cf / Math.pow(1 + rate, t), 0);
  },

  /** IRR via bisection pada rentang −90% s.d. 1000%. */
  irr(arus) {
    let lo = -0.9, hi = 10;
    const f = r => this.npv(r, arus);
    if (f(lo) * f(hi) > 0) return null;
    for (let i = 0; i < 300; i++) {
      const mid = (lo + hi) / 2;
      if (f(lo) * f(mid) <= 0) hi = mid; else lo = mid;
    }
    return (lo + hi) / 2;
  },

  payback(modal, arusTahunan) {
    if (arusTahunan <= 0) return null;
    return modal / arusTahunan;
  },

  /* ---------- Klasifikasi jalur pengguna (Bagian 0.2) ---------- */

  klasifikasiJalur(p) {
    const returnPasar = p.returnPasar ?? 0.10;
    if (p.punyaUsaha && p.usahaMenyerapModal) {
      if ((p.roicBisnis || 0) > returnPasar * 1.5) {
        return { kode: 'B', nama: 'Entrepreneur', leverage: 'ROIC internal (reinvestasi)',
                 pesan: 'Bisnis Anda masih menyerap modal dengan return jauh di atas pasar. Reinvestasi mengalahkan diversifikasi.' };
      }
      return { kode: 'C', nama: 'Investor', leverage: 'Alokasi aset & disiplin',
               pesan: 'Bisnis mendekati jenuh. Kelebihan kas layak didiversifikasi ke aset finansial.' };
    }
    if (p.portofolioLikuid >= p.penghasilanTahunan * 3 && p.penghasilanTahunan > 0) {
      return { kode: 'C', nama: 'Investor', leverage: 'Alokasi aset, efisiensi pajak, disiplin',
               pesan: 'Portofolio sudah melewati skala kritis. Alokasi dan preservasi menjadi variabel utama.' };
    }
    return { kode: 'A', nama: 'Personal', leverage: 'Savings rate + kenaikan penghasilan',
             pesan: 'Portofolio masih di bawah skala kritis. Kenaikan penghasilan mengalahkan optimasi return.' };
  },

  /** Skala kritis: kapan portofolio menjadi mesin utama (Prinsip P3). */
  skalaKritis(penghasilanTahunan, expectedReturn = 0.10) {
    return this.bagi(penghasilanTahunan, expectedReturn) || 0;
  },

  faseKekayaan(portofolio, penghasilanTahunan, ffTarget) {
    const progres = this.bagi(portofolio, ffTarget) || 0;
    if (progres >= 0.8) return { kode: 3, nama: 'Preserve', fokus: 'Jangan kehilangan yang sudah dibangun',
      detail: 'Diversifikasi, likuiditas, manajemen risiko, pajak, warisan, strategi penarikan.' };
    if (portofolio >= penghasilanTahunan * 3) return { kode: 2, nama: 'Compound', fokus: 'Ubah penghasilan menjadi aset produktif',
      detail: 'Portofolio, reinvestasi bisnis, alokasi aset, konsistensi.' };
    return { kode: 1, nama: 'Build', fokus: 'Perbesar daya hasil (earnings power)',
      detail: 'Skill, karier, bisnis, savings rate. Optimasi portofolio masih sekunder.' };
  }
};

/* ============================================================
   40 — PEMFORMAT & KOMPONEN UI GENERIK
   Renderer bersifat generik: ia membaca spesifikasi kalkulator
   dan membangun formulir + laporan tanpa kode khusus per modul.
   ============================================================ */
const F = {
  nf: new Intl.NumberFormat('id-ID'),
  nf2: new Intl.NumberFormat('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }),

  rp(n) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    const neg = n < 0; const a = Math.abs(Math.round(n));
    return (neg ? '−Rp ' : 'Rp ') + this.nf.format(a);
  },
  /** Ringkas: Rp 1,25 M / Rp 340 jt / Rp 12,4 rb */
  rpRingkas(n) {
    if (n === null || n === undefined || !isFinite(n)) return '—';
    const neg = n < 0; const a = Math.abs(n); const t = neg ? '−Rp ' : 'Rp ';
    if (a >= 1e12) return t + this.nf2.format(a / 1e12) + ' T';
    if (a >= 1e9)  return t + this.nf2.format(a / 1e9) + ' M';
    if (a >= 1e6)  return t + this.nf2.format(a / 1e6) + ' jt';
    if (a >= 1e3)  return t + this.nf2.format(a / 1e3) + ' rb';
    return t + this.nf.format(Math.round(a));
  },
  persen(x, d = 1) {
    if (x === null || x === undefined || !isFinite(x)) return '—';
    return new Intl.NumberFormat('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }).format(x * 100) + '%';
  },
  angka(x, d = 2) {
    if (x === null || x === undefined || !isFinite(x)) return '—';
    return new Intl.NumberFormat('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d }).format(x);
  },
  bulan(x) {
    if (x === null || !isFinite(x)) return '—';
    return this.angka(x, 1) + ' bulan';
  },
  /** Durasi dalam tahun → "6 tahun 4 bulan" */
  durasi(tahun) {
    if (tahun === null || tahun === undefined || !isFinite(tahun)) return 'Tidak tercapai';
    if (tahun <= 0) return 'Sudah tercapai';
    const t = Math.floor(tahun), b = Math.round((tahun - t) * 12);
    if (b === 12) return (t + 1) + ' tahun';
    return (t > 0 ? t + ' tahun' : '') + (b > 0 ? (t > 0 ? ' ' : '') + b + ' bulan' : (t > 0 ? '' : '< 1 bulan'));
  },
  /** Format berdasarkan kode tipe. */
  auto(nilai, tipe) {
    switch (tipe) {
      case 'rupiah': return this.rp(nilai);
      case 'rupiah-ringkas': return this.rpRingkas(nilai);
      case 'persen': return this.persen(nilai);
      case 'persen2': return this.persen(nilai, 2);
      case 'bulan': return this.bulan(nilai);
      case 'tahun': return this.durasi(nilai);
      case 'kali': return this.angka(nilai, 2) + '×';
      case 'angka': return this.angka(nilai, 2);
      case 'bulat': return nilai === null ? '—' : this.nf.format(Math.round(nilai));
      default: return nilai === null || nilai === undefined ? '—' : String(nilai);
    }
  },
  /** Bersihkan input berformat menjadi angka. */
  urai(s) {
    if (typeof s === 'number') return s;
    if (!s) return 0;
    const bersih = String(s).replace(/[^\d,-]/g, '').replace(/\./g, '').replace(',', '.');
    const n = parseFloat(bersih);
    return isFinite(n) ? n : 0;
  },
  esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
};

/* ---------- Komponen HTML ---------- */
const C = {
  metrik(m) {
    const kls = m.nada ? ' ' + m.nada : (m.sorot ? ' sorot' : '');
    return `<div class="metrik${kls}">
      <div class="lbl">${F.esc(m.label)}</div>
      <div class="nil">${m.teks ?? F.auto(m.nilai, m.format)}</div>
      ${m.ket ? `<div class="ket">${F.esc(m.ket)}</div>` : ''}
    </div>`;
  },

  metrikGrid(daftar) {
    return `<div class="metrik-grid">${daftar.filter(Boolean).map(m => this.metrik(m)).join('')}</div>`;
  },

  pesan(p) {
    const ikon = { kritis: '▲', waspada: '▲', sehat: '✓', info: 'i' }[p.nada] || 'i';
    return `<div class="pesan p-${p.nada || 'info'}">
      <span class="ikon">${ikon}</span>
      <div>${p.judul ? `<b>${F.esc(p.judul)}</b> — ` : ''}${p.teks}</div>
    </div>`;
  },

  lencana(status, label) {
    return `<span class="lencana l-${status}">${F.esc(label)}</span>`;
  },

  tabel(t) {
    const kepala = t.kolom.map(k =>
      `<th${k.n ? ' class="n"' : ''}>${F.esc(k.label)}</th>`).join('');
    const badan = t.baris.map(b => {
      const kls = b._tekan ? ' class="tekan"' : '';
      const sel = t.kolom.map(k => {
        const v = b[k.k];
        const isi = k.html ? v : F.esc(k.format ? F.auto(v, k.format) : (v ?? '—'));
        return `<td${k.n ? ' class="n"' : ''}>${isi}</td>`;
      }).join('');
      return `<tr${kls}>${sel}</tr>`;
    }).join('');
    return `<div class="tbl-bungkus"><table>
      <thead><tr>${kepala}</tr></thead><tbody>${badan}</tbody></table></div>`;
  },

  /** Bilah posisi terhadap ambang sehat. */
  bilah(nilai, ambangSehat, arahNaik, format) {
    if (nilai === null) return '';
    const rasio = M.jepit((nilai / (ambangSehat * 2)) || 0, 0, 1);
    const baik = arahNaik ? nilai >= ambangSehat : nilai <= ambangSehat;
    const warna = baik ? 'var(--sehat)' : 'var(--waspada)';
    return `<div class="bilah"><i style="width:${(rasio * 100).toFixed(1)}%;background:${warna}"></i></div>
      <div class="bilah-lbl"><span>0</span><span>ambang sehat ${F.auto(ambangSehat, format)}</span><span>${F.auto(ambangSehat * 2, format)}</span></div>`;
  },

  /** Grafik garis SVG ringan — tanpa pustaka eksternal. */
  garis(seri, opsi = {}) {
    const w = opsi.lebar || 720, h = opsi.tinggi || 220, p = { a: 46, ka: 14, at: 14, b: 26 };
    const semua = seri.flatMap(s => s.titik);
    const maxY = Math.max(...semua.map(t => t.y), 1);
    const maxX = Math.max(...semua.map(t => t.x), 1);
    const px = x => p.a + (x / maxX) * (w - p.a - p.ka);
    const py = y => h - p.b - (y / maxY) * (h - p.at - p.b);
    const kisi = [0, .25, .5, .75, 1].map(f => {
      const y = py(maxY * f);
      return `<line x1="${p.a}" y1="${y}" x2="${w - p.ka}" y2="${y}" stroke="var(--kertas-3)" stroke-width="1"/>
        <text x="${p.a - 7}" y="${y + 3.5}" text-anchor="end" font-size="9.5" fill="var(--teks-3)"
          font-family="var(--mono)">${F.rpRingkas(maxY * f).replace('Rp ', '')}</text>`;
    }).join('');
    const jalur = seri.map(s => {
      const d = s.titik.map((t, i) => `${i ? 'L' : 'M'}${px(t.x).toFixed(1)},${py(t.y).toFixed(1)}`).join(' ');
      return `<path d="${d}" fill="none" stroke="${s.warna}" stroke-width="${s.tebal || 2.2}"
        stroke-dasharray="${s.putus ? '5 4' : ''}" stroke-linejoin="round" stroke-linecap="round"/>`;
    }).join('');
    const sumbuX = [0, .5, 1].map(f => {
      const x = px(maxX * f);
      return `<text x="${x}" y="${h - 8}" text-anchor="middle" font-size="9.5" fill="var(--teks-3)"
        font-family="var(--mono)">${Math.round(maxX * f)} th</text>`;
    }).join('');
    const legenda = seri.map(s =>
      `<span style="display:inline-flex;align-items:center;gap:5px;font-size:11.6px;color:var(--teks-2)">
        <i style="width:14px;height:2.5px;background:${s.warna};display:inline-block;border-radius:2px"></i>${F.esc(s.nama)}</span>`
    ).join('<span style="width:14px"></span>');
    return `<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" style="width:100%;min-width:420px;height:auto" role="img"
      aria-label="Grafik proyeksi">${kisi}${jalur}${sumbuX}</svg></div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px">${legenda}</div>`;
  },

  /** Grafik batang horizontal untuk perbandingan skenario. */
  batang(baris, opsi = {}) {
    const maks = Math.max(...baris.map(b => Math.abs(b.nilai)), 1);
    return `<div style="display:flex;flex-direction:column;gap:9px">` + baris.map(b => `
      <div>
        <div style="display:flex;justify-content:space-between;font-size:12.6px;margin-bottom:4px">
          <span style="color:var(--teks-2)">${F.esc(b.label)}</span>
          <span class="mono" style="font-weight:600;color:${b.warna || 'var(--teks)'}">${b.teks ?? F.auto(b.nilai, opsi.format)}</span>
        </div>
        <div class="bilah" style="height:9px;margin-top:0">
          <i style="width:${((Math.abs(b.nilai) / maks) * 100).toFixed(1)}%;background:${b.warna || 'var(--giok)'}"></i>
        </div>
      </div>`).join('') + `</div>`;
  }
};

/* ---------------------------------------------------------- D3 */
{
  id: 'd3-rasio', kat: 'diagnosis', kode: 'D3', ikon: '◎',
  nama: 'Delapan Rasio Kesehatan Keuangan',
  ringkas: 'Pemeriksaan standar perencana keuangan: likuiditas, tabungan, hutang, investasi, solvabilitas.',
  intro: 'Delapan rasio ini mendeteksi penyakit finansial yang tidak terlihat dari saldo rekening: risiko kekurangan kas, hutang berlebih, terlalu boros atau terlalu pelit, dan gejala kebangkrutan.',
  input: [
    { k: 'asetLikuid', label: 'Aset likuid', tipe: 'rupiah', awal: 200000000, hint: 'Kas, deposito, pasar uang, logam mulia', grup: 'Aset' },
    { k: 'asetGuna', label: 'Mobil & properti tinggal', tipe: 'rupiah', awal: 1720000000, grup: 'Aset' },
    { k: 'asetInvestasi', label: 'Aset investasi', tipe: 'rupiah', awal: 390000000, hint: 'Saham, reksa dana, obligasi, properti investasi', grup: 'Aset' },
    { k: 'hutangPendek', label: 'Hutang jangka pendek', tipe: 'rupiah', awal: 12000000, hint: 'Kartu kredit, KTA, pinjaman online', grup: 'Hutang' },
    { k: 'hutangPanjang', label: 'Hutang jangka panjang', tipe: 'rupiah', awal: 715000000, hint: 'KPR, kredit kendaraan', grup: 'Hutang' },
    { k: 'pendapatanTahunan', label: 'Pendapatan tahunan', tipe: 'rupiah', awal: 420000000, grup: 'Arus Kas' },
    { k: 'tabunganTahunan', label: 'Jumlah ditabung per tahun', tipe: 'rupiah', awal: 96000000, grup: 'Arus Kas' },
    { k: 'pengeluaranBulanan', label: 'Pengeluaran bulanan', tipe: 'rupiah', awal: 22000000, grup: 'Arus Kas' },
    { k: 'cicilanTotal', label: 'Cicilan tahunan termasuk KPR', tipe: 'rupiah', awal: 108000000, grup: 'Cicilan' },
    { k: 'cicilanNonKPR', label: 'Cicilan tahunan di luar KPR', tipe: 'rupiah', awal: 36000000, grup: 'Cicilan' }
  ],
  hitung(v) {
    const totalAset = v.asetLikuid + v.asetGuna + v.asetInvestasi;
    const totalHutang = v.hutangPendek + v.hutangPanjang;
    const nw = totalAset - totalHutang;
    const nwPositif = nw > 0;

    const spek = [
      { nama: 'Rasio Likuiditas', rumus: 'Aset Likuid ÷ Pengeluaran Bulanan', unit: 'bulan',
        nilai: M.bagi(v.asetLikuid, v.pengeluaranBulanan), naik: true, sehat: 3, waspada: 1,
        arti: 'Berapa lama bertahan tanpa pemasukan.' },
      { nama: 'Aset Likuid / Kekayaan Bersih', rumus: 'Aset Likuid ÷ Kekayaan Bersih', unit: 'persen',
        nilai: nwPositif ? M.bagi(v.asetLikuid, nw) : null, naik: true, sehat: 0.15, waspada: 0.10,
        arti: 'Porsi kekayaan yang siap dicairkan.', alasanNA: 'Kekayaan bersih belum positif.' },
      { nama: 'Rasio Tabungan', rumus: 'Tabungan ÷ Pendapatan Tahunan', unit: 'persen',
        nilai: M.bagi(v.tabunganTahunan, v.pendapatanTahunan), naik: true, sehat: 0.10, waspada: 0.05,
        arti: 'Disiplin menyisihkan penghasilan.' },
      { nama: 'Hutang terhadap Aset', rumus: 'Total Hutang ÷ Total Aset', unit: 'persen',
        nilai: M.bagi(totalHutang, totalAset), naik: false, sehat: 0.50, waspada: 0.70,
        arti: 'Porsi aset yang secara efektif milik kreditur.' },
      { nama: 'Kemampuan Pelunasan Hutang', rumus: 'Cicilan Tahunan ÷ Pendapatan Tahunan', unit: 'persen',
        nilai: M.bagi(v.cicilanTotal, v.pendapatanTahunan), naik: false, sehat: 0.35, waspada: 0.45,
        arti: 'Beban cicilan terhadap penghasilan.' },
      { nama: 'Pelunasan Hutang Non-Hipotek', rumus: 'Cicilan non-KPR ÷ Pendapatan Tahunan', unit: 'persen',
        nilai: M.bagi(v.cicilanNonKPR, v.pendapatanTahunan), naik: false, sehat: 0.15, waspada: 0.25,
        arti: 'Beban hutang konsumtif — indikator paling cepat memburuk.' },
      { nama: 'Aset Investasi / Kekayaan Bersih', rumus: 'Aset Investasi ÷ Kekayaan Bersih', unit: 'persen',
        nilai: nwPositif ? M.bagi(v.asetInvestasi, nw) : null, naik: true, sehat: 0.50, waspada: 0.25,
        arti: 'Seberapa produktif kekayaan Anda bekerja.', alasanNA: 'Kekayaan bersih belum positif.' },
      { nama: 'Rasio Solvabilitas', rumus: 'Kekayaan Bersih ÷ Total Aset', unit: 'persen',
        nilai: M.bagi(nw, totalAset), naik: true, sehat: 0.50, waspada: 0.35,
        arti: 'Ketahanan terhadap penurunan nilai aset.' }
    ];

    const nilai = spek.map(s => {
      let status = 'na';
      if (s.nilai !== null && isFinite(s.nilai)) {
        if (s.naik) status = s.nilai >= s.sehat ? 'sehat' : (s.nilai >= s.waspada ? 'waspada' : 'kritis');
        else status = s.nilai <= s.sehat ? 'sehat' : (s.nilai <= s.waspada ? 'waspada' : 'kritis');
      }
      return { ...s, status };
    });

    const dapatDinilai = nilai.filter(r => r.status !== 'na').length;
    const skor = nilai.filter(r => r.status === 'sehat').length;
    const ringkasan = skor >= 7 ? { l: 'Keuangan Anda Sehat', n: 'sehat' }
      : skor >= 5 ? { l: 'Cukup Baik, Ada Ruang Perbaikan', n: 'sehat' }
      : skor >= 3 ? { l: 'Perlu Perbaikan Terarah', n: 'waspada' }
      : { l: 'Butuh Penanganan Segera', n: 'kritis' };

    const kritis = nilai.filter(r => r.status === 'kritis');
    const pesan = [{ nada: ringkasan.n, judul: `Skor ${skor} dari ${dapatDinilai}`, teks: ringkasan.l + '.' }];
    if (kritis.length) pesan.push({ nada: 'kritis', judul: 'Prioritas perbaikan',
      teks: 'Rasio berstatus kritis: ' + kritis.map(r => `<b>${r.nama}</b>`).join(', ') + '. Selesaikan ini lebih dulu sebelum mengoptimasi hal lain.' });
    if (v.cicilanNonKPR > v.cicilanTotal) pesan.push({ nada: 'waspada', judul: 'Data tidak konsisten',
      teks: 'Cicilan di luar KPR melebihi cicilan total. Cicilan total seharusnya mencakup KPR dan seluruh cicilan lain.' });

    return {
      metrik: [
        { label: 'Skor kesehatan', teks: `${skor}/${dapatDinilai}`, sorot: true },
        { label: 'Kekayaan bersih', nilai: nw, format: 'rupiah-ringkas' },
        { label: 'Status keseluruhan', teks: ringkasan.l, nada: ringkasan.n }
      ],
      pesan,
      tabel: { judul: 'Rincian delapan rasio', kolom: [
          { k: 'nama', label: 'Rasio' }, { k: 'rumus', label: 'Rumus' },
          { k: 'hasil', label: 'Hasil', n: true }, { k: 'target', label: 'Ambang sehat', n: true },
          { k: 'st', label: 'Status', html: true }
        ], baris: nilai.map(r => ({
          nama: r.nama, rumus: r.rumus,
          hasil: r.status === 'na' ? '—' : (r.unit === 'bulan' ? F.bulan(r.nilai) : F.persen(r.nilai)),
          target: (r.naik ? '≥ ' : '≤ ') + (r.unit === 'bulan' ? F.angka(r.sehat, 0) + ' bln' : F.persen(r.sehat, 0)),
          st: r.status === 'na' ? C.lencana('netral', 'Tidak tersedia')
            : C.lencana(r.status, { sehat: 'Sehat', waspada: 'Waspada', kritis: 'Kritis' }[r.status])
        })) },
      narasi: `<p>Rasio Hutang/Aset dan Solvabilitas selalu berjumlah 100% — keduanya sisi mata uang yang sama, tetapi membingkai pertanyaan berbeda: <i>berapa yang bukan milik saya</i> versus <i>berapa yang benar-benar milik saya</i>.</p>
        <p>Rasio yang tidak dapat dinilai ditandai eksplisit, bukan diisi angka menyesatkan. Ketika kekayaan bersih negatif, persentase terhadapnya kehilangan makna.</p>`
    };
  }
},

{
  id: 'd4-skor', kat: 'diagnosis', kode: 'D4', ikon: '◉',
  nama: 'Skor Kesehatan Keuangan 0–100',
  ringkas: 'Skor komposit tertimbang dari delapan komponen, dengan status Kritis hingga Prima.',

    { k: 'bulanTarget', label: 'Target dana darurat', tipe: 'angka', awal: 6, satuan: 'bulan' },
    { k: 'dsr', label: 'Rasio cicilan / penghasilan', tipe: 'persen', awal: 0.26 },
    { k: 'proteksi', label: 'Kelengkapan proteksi', tipe: 'pilih', awal: 'sebagian', opsi: [
      { v: 'lengkap', l: 'Kesehatan + jiwa memadai' }, { v: 'sebagian', l: 'Hanya salah satu / kurang memadai' }, { v: 'tidak', l: 'Belum ada' }
    ]},
    { k: 'pendanaanTujuan', label: 'Tujuan keuangan yang sudah terdanai', tipe: 'persen', awal: 0.45 },
    { k: 'porsiInvestasi', label: 'Aset investasi / kekayaan bersih', tipe: 'persen', awal: 0.32 },
    { k: 'posisiTerbesar', label: 'Bobot posisi terbesar di portofolio', tipe: 'persen', awal: 0.34 },
    { k: 'disiplin', label: 'Konsistensi 12 bulan terakhir', tipe: 'pilih', awal: 'sebagian', opsi: [
      { v: 'penuh', l: 'Menabung & investasi rutin tanpa putus' },
      { v: 'sebagian', l: 'Rutin tetapi sempat terputus' },
      { v: 'tidak', l: 'Tidak rutin / sering menarik kembali' }
    ]}
  ],
  hitung(v) {
    const s = (x) => M.jepit(x, 0, 1);
    const komp = [
      { nama: 'Arus kas & savings rate', bobot: K.bobotSkor.arusKas, capai: s(v.savingsRate / 0.4) },
      { nama: 'Dana darurat', bobot: K.bobotSkor.danaDarurat, capai: s(v.bulanDarurat / (v.bulanTarget || 6)) },
      { nama: 'Beban hutang', bobot: K.bobotSkor.hutang, capai: s(1 - (v.dsr / 0.40)) },
      { nama: 'Proteksi', bobot: K.bobotSkor.proteksi, capai: { lengkap: 1, sebagian: 0.5, tidak: 0 }[v.proteksi] },
      { nama: 'Pendanaan tujuan', bobot: K.bobotSkor.pendanaanTujuan, capai: s(v.pendanaanTujuan) },
      { nama: 'Porsi aset produktif', bobot: K.bobotSkor.investasi, capai: s(v.porsiInvestasi / 0.5) },
      { nama: 'Risiko konsentrasi', bobot: K.bobotSkor.konsentrasi, capai: s(1 - Math.max(0, (v.posisiTerbesar - 0.15)) / 0.35) },
      { nama: 'Disiplin finansial', bobot: K.bobotSkor.disiplin, capai: { penuh: 1, sebagian: 0.6, tidak: 0.2 }[v.disiplin] }
    ];
    const skor = komp.reduce((t, k) => t + k.bobot * k.capai, 0);
    const tingkat = skor >= 85 ? { l: 'Prima', n: 'sehat' } : skor >= 70 ? { l: 'Kuat', n: 'sehat' }
      : skor >= 55 ? { l: 'Sehat', n: 'sehat' } : skor >= 40 ? { l: 'Lemah', n: 'waspada' } : { l: 'Kritis', n: 'kritis' };
    PROFIL.skor = skor;
    const terlemah = [...komp].sort((a, b) => (a.capai - b.capai))[0];

    return {
      metrik: [
        { label: 'Skor kesehatan keuangan', teks: F.angka(skor, 0) + ' / 100', sorot: true },
        { label: 'Tingkat', teks: tingkat.l, nada: tingkat.n },
        { label: 'Komponen terlemah', teks: terlemah.nama, nada: 'waspada' }
      ],
      pesan: [
        { nada: tingkat.n, judul: `Tingkat ${tingkat.l}`, teks: `Skor komposit ${F.angka(skor, 0)}. Skor tunggal hanya berguna untuk melihat arah; yang menentukan tindakan adalah komponen terlemah.` },
        { nada: 'waspada', judul: 'Prioritas tunggal', teks: `Perbaiki <b>${terlemah.nama}</b> lebih dulu. Menaikkan komponen ini dari ${F.persen(terlemah.capai, 0)} ke penuh menambah sekitar ${F.angka(terlemah.bobot * (1 - terlemah.capai), 0)} poin — dampak terbesar per satuan usaha.` }
      ],
      grafikHtml: C.batang(komp.map(k => ({
        label: `${k.nama} (bobot ${k.bobot})`,
        nilai: k.bobot * k.capai,
        teks: `${F.angka(k.bobot * k.capai, 1)} / ${k.bobot}`,
        warna: k.capai >= 0.8 ? 'var(--sehat)' : k.capai >= 0.5 ? 'var(--waspada)' : 'var(--kritis)'
      })), {}),
      grafikJudul: 'Kontribusi tiap komponen terhadap skor'
    };
  }
}
