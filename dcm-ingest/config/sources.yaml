# =============================================================================
#  DAILY CRYPTO MEDIA — REGISTRI SUMBER
# =============================================================================
#  Pipeline ini SENGAJA hanya menyimpan judul, kutipan pendek dari feed, dan
#  tautan kanonis. Tabel Article tidak punya kolom untuk isi artikel penuh.
#  Itu batasan struktural, bukan konvensi. Jangan menambah kolom body.
#
#  PENYARING TOPIK TIDAK ADA. Skor dihitung dari relevansi Indonesia,
#  kesegaran, dan kualitas kutipan — bukan dari apakah artikelnya soal kripto.
#  Konsekuensinya: JANGAN menambahkan feed berita umum. Feed semacam itu akan
#  mengisi halaman depan dengan berita non-kripto berskor tinggi. Setiap
#  sumber di sini harus feed yang khusus kripto atau keuangan digital.
#
#  Sejak penyeimbangan penerbit dipasang di export.py, tiap sumber mendapat
#  giliran yang sama pada 60 kursi halaman depan. Menambah sumber berarti
#  memperkecil porsi tiap sumber — pertimbangan sadar, bukan efek samping.
#
#  needs_permission: true menandai sumber yang mensyaratkan izin tertulis
#  untuk sindikasi komersial. active: false menghentikan polling sepenuhnya,
#  dipakai untuk endpoint yang mati — bukan untuk izin yang belum turun.
# =============================================================================

defaults:
  user_agent: "DailyCryptoMediaBot/1.0 (+https://dailycryptomedia.com/bot; redaksi@dailycryptomedia.com)"
  timeout_seconds: 20
  min_interval_seconds: 3.0
  max_items_per_poll: 40
  respect_robots: true

sources:

  # ---------------------------------------------------------------------
  # SUMBER BERBAHASA INDONESIA — tidak perlu terjemahan
  # ---------------------------------------------------------------------

  - slug: coindesk-id
    name: "CoinDesk Indonesia"
    homepage: "https://www.coindesk.com/id"
    lang: id
    feed_candidates:
      - "https://www.coindesk.com/id/arc/outboundfeeds/rss/"
      - "https://www.coindesk.com/arc/outboundfeeds/rss/"
    fallback_lang: en
    publish: true
    needs_permission: true
    attribution: "CoinDesk"
    license_note: >
      Sindikasi komersial memerlukan perjanjian. Mode aman: judul, kutipan
      feed, dan tautan balik. Jangan menyalin isi artikel.

  - slug: beincrypto-id
    name: "BeInCrypto Indonesia"
    homepage: "https://id.beincrypto.com/"
    lang: id
    feed_candidates:
      - "https://id.beincrypto.com/feed/"
      - "https://id.beincrypto.com/rss/"
    publish: true
    needs_permission: true
    attribution: "BeInCrypto Indonesia"
    license_note: "Feed WordPress. Konfirmasi ketentuan sindikasi ke redaksi."

  - slug: blockchainmedia
    name: "Blockchainmedia.id"
    homepage: "https://blockchainmedia.id/"
    lang: id
    feed_candidates:
      - "https://blockchainmedia.id/feed/"
      - "https://blockchainmedia.id/rss/"
    publish: true
    needs_permission: true
    attribution: "Blockchainmedia.id"
    license_note: "Media siber terdaftar. Tunduk pada Pedoman Media Siber Dewan Pers."

  - slug: coinvestasi
    name: "Coinvestasi"
    homepage: "https://coinvestasi.com/"
    lang: id
    # DINONAKTIFKAN 15 Agustus 2026. Tidak menyediakan RSS publik. Situsnya
    # bukan WordPress. Diuji dan semuanya mengembalikan halaman 404 sendiri:
    #   /feed  /feed/  /rss  /rss.xml  /atom.xml  /index.xml
    #   /berita-terkini/feed
    # Berandanya juga tidak mengumumkan feed lewat tag autodiscovery.
    active: false
    feed_candidates:
      - "https://coinvestasi.com/feed/"
    publish: false
    needs_permission: true
    attribution: "Coinvestasi"
    license_note: "Tidak ada feed publik. Perlu kontak redaksi untuk akses."

  # ---------------------------------------------------------------------
  # SUMBER BERBAHASA INGGRIS — masuk antrean terjemahan Gemini
  # ---------------------------------------------------------------------

  - slug: cointelegraph
    name: "Cointelegraph"
    homepage: "https://cointelegraph.com/"
    lang: en
    feed_candidates:
      - "https://cointelegraph.com/rss"
    topic_feeds:
      bitcoin:  "https://cointelegraph.com/rss/tag/bitcoin"
      defi:     "https://cointelegraph.com/rss/tag/defi"
      regulasi: "https://cointelegraph.com/rss/tag/regulation"
    publish: true
    needs_permission: true
    attribution: "Cointelegraph"
    license_note: >
      Feed publik. Terjemahan adalah karya turunan, jadi yang diterjemahkan
      hanya judul; ringkasan ditulis ulang secara orisinal oleh model.

  - slug: decrypt
    name: "Decrypt"
    homepage: "https://decrypt.co/"
    lang: en
    feed_candidates:
      - "https://decrypt.co/feed"
      - "https://decrypt.co/rss"
    publish: true
    needs_permission: true
    attribution: "Decrypt"
    license_note: "Periksa ketentuan penggunaan sebelum sindikasi komersial."

  - slug: theblock
    name: "The Block"
    homepage: "https://www.theblock.co/"
    lang: en
    feed_candidates:
      - "https://www.theblock.co/rss.xml"
      - "https://www.theblock.co/feed"
    publish: true
    needs_permission: true
    attribution: "The Block"
    license_note: >
      Sebagian konten di balik langganan Pro. Item berbayar dilewati pipeline
      karena kutipannya tidak tersedia publik.

  # --- ditambahkan 19 Agustus 2026, semuanya lolos uji Diagnosa ----------

  - slug: cryptoslate
    name: "CryptoSlate"
    homepage: "https://cryptoslate.com/"
    lang: en
    # Terverifikasi: 200, application/rss+xml, 10 item. Feednya pendek, jadi
    # sumbangannya sedikit tapi konsisten.
    feed_candidates:
      - "https://cryptoslate.com/feed/"
    publish: true
    needs_permission: true
    attribution: "CryptoSlate"
    license_note: "Feed publik. Konfirmasi ketentuan sindikasi sebelum skala penuh."

  - slug: blockworks
    name: "Blockworks"
    homepage: "https://blockworks.co/"
    lang: en
    # Terverifikasi: 200, text/xml, 50 item. Kuat di sisi institusional dan
    # struktur pasar — melengkapi celah liputan sumber lain.
    feed_candidates:
      - "https://blockworks.co/feed"
    publish: true
    needs_permission: true
    attribution: "Blockworks"
    license_note: "Feed publik. Konfirmasi ketentuan sindikasi sebelum skala penuh."

  - slug: thedefiant
    name: "The Defiant"
    homepage: "https://thedefiant.io/"
    lang: en
    # Terverifikasi: 200, application/rss+xml, 100 item. Fokus DeFi, RWA, dan
    # tokenisasi. Alamat /api/feed memberi isi identik; cukup satu saja.
    feed_candidates:
      - "https://thedefiant.io/feed"
    publish: true
    needs_permission: true
    attribution: "The Defiant"
    license_note: "Feed publik. Konfirmasi ketentuan sindikasi sebelum skala penuh."

  # ---------------------------------------------------------------------
  # DITOLAK SAAT PENGUJIAN 19 Agustus 2026 — jangan dicoba ulang tanpa alasan
  # ---------------------------------------------------------------------
  #  Kontan       rss.kontan.co.id  -> gagal handshake SSL. Selain itu
  #                                    ketentuan RSS-nya menyatakan hanya
  #                                    untuk penggunaan non-komersial.
  #  Bisnis.com   /rss              -> 403, Cloudflare
  #  finansial.bisnis.com /rss      -> 403, Cloudflare
  #  CNBC Indonesia /market/rss     -> 403, Cloudflare
  #  OJK          siaran pers       -> firewall aplikasi menolak bot
  #  Katadata     /rss              -> feed SAH tetapi berita umum, bukan
  #                                    kripto. Akan mengisi halaman depan
  #                                    dengan artikel di luar topik karena
  #                                    tidak ada penyaring topik di kode.

# =============================================================================
#  PEMETAAN RUBRIK
# =============================================================================
rubrics:
  regulasi:
    label: "Regulasi"
    keywords: [ojk, bappebti, regulation, regulator, sec, lawmaker, bill, undang-undang,
                peraturan, kebijakan, policy, license, izin, sanction, pajak, tax,
                compliance, kepatuhan, mica, enforcement, pengadilan, court, lawsuit]
  tokenisasi:
    label: "Tokenisasi"
    keywords: [tokenization, tokenized, tokenisasi, rwa, real-world asset, stablecoin,
                treasury, obligasi, bond, custody, kustodi, emas, gold, securitization]
  bitcoin:
    label: "Bitcoin"
    keywords: [bitcoin, btc, satoshi, halving, mining, penambangan, ordinal, lightning]
  defi:
    label: "DeFi"
    keywords: [defi, lending, protocol, liquidity, likuiditas, yield, imbal hasil,
                dex, amm, staking, tvl, vault, exploit, peretasan]
  nft:
    label: "NFT & Gaming"
    keywords: [nft, gaming, game, metaverse, collectible, koleksi, opensea, mint]
  web3:
    label: "Web3"
    keywords: [web3, wallet, dompet, layer 2, layer-2, rollup, zk, infrastructure,
                infrastruktur, node, validator, jaringan, interoperability]
  bisnis:
    label: "Bisnis"
    keywords: [funding, pendanaan, raise, acquisition, akuisisi, ipo, merger, revenue,
                pendapatan, partnership, kemitraan, hire, layoff, penggalangan dana]
  pasar:
    label: "Pasar"
    keywords: [price, harga, rally, surge, plunge, anjlok, melonjak, etf, inflow,
                outflow, market, pasar, trading, perdagangan, volume, futures,
                berjangka, analisis, exchange, bursa, likuidasi, koreksi]

# =============================================================================
#  SKOR RELEVANSI INDONESIA
# =============================================================================
relevance_boost:
  indonesia:      [indonesia, indonesian, jakarta, rupiah, idr, ojk, bappebti,
                    bi, bank indonesia, kominfo, ihsg, bursa efek, idx]
  regional:       [southeast asia, asia tenggara, asean, singapore, singapura,
                    malaysia, thailand, vietnam, filipina, philippines]
  weights:
    indonesia: 40
    regional: 15
    recency_hours_halflife: 8
