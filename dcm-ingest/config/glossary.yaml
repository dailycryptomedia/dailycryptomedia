# ---------------------------------------------------------------------------
# NAMA LEMBAGA — jangan diterjemahkan, beri keterangan pada penyebutan pertama
# ---------------------------------------------------------------------------
institutions:
  SEC: "Komisi Sekuritas dan Bursa Amerika Serikat (SEC)"
  CFTC: "Komisi Perdagangan Berjangka Komoditas AS (CFTC)"
  Fed: "bank sentral Amerika Serikat (The Fed)"
  Federal Reserve: "bank sentral Amerika Serikat (The Fed)"
  ECB: "Bank Sentral Eropa (ECB)"
  IMF: "Dana Moneter Internasional (IMF)"
  FATF: "Satuan Tugas Aksi Keuangan (FATF)"
  MiCA: "regulasi MiCA Uni Eropa"
  OJK: "Otoritas Jasa Keuangan (OJK)"
  Bappebti: "Bappebti"
  DOJ: "Departemen Kehakiman AS (DOJ)"
  IRS: "otoritas pajak AS (IRS)"

# ---------------------------------------------------------------------------
# GAYA PENULISAN JUDUL
# ---------------------------------------------------------------------------
style:
  headline:
    - "Gunakan kalimat aktif. 'OJK terbitkan aturan', bukan 'Aturan diterbitkan OJK'."
    - "Maksimal 95 karakter. Judul panjang terpotong di kartu berita."
    - "Sentence case, bukan Title Case. Hanya huruf pertama dan nama diri."
    - "Jangan menambah tanda seru, emoji, atau kata seperti 'MENGEJUTKAN'."
    - "Angka besar ditulis singkat: 'Rp1,8 triliun', bukan 'Rp1.800.000.000'."
    - "Nilai dolar dipertahankan dalam dolar, jangan dikonversi ke rupiah."
    - "Jangan menambah informasi yang tidak ada pada judul asli."
  summary:
    - "Dua kalimat, maksimal 220 karakter total."
    - "Tulis ulang secara orisinal. Jangan menerjemahkan kalimat per kalimat."
    - "Jawab: apa yang terjadi, dan mengapa itu penting bagi pembaca Indonesia."
    - "Nada berita lurus. Tanpa ajakan, tanpa penilaian, tanpa nasihat investasi."
    - "Bila kutipan sumber terlalu tipis untuk diringkas, kembalikan string kosong."
