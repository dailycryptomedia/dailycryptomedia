# =============================================================================
#  GLOSARIUM TERJEMAHAN KRIPTO — GAYA SELINGKUNG DAILY CRYPTO MEDIA
# =============================================================================
#  Masalah terbesar terjemahan mesin di berita kripto Indonesia bukan tata
#  bahasa, melainkan istilah yang diterjemahkan padahal seharusnya dibiarkan.
#  "Staking" jadi "mempertaruhkan", "bullish" jadi "kelakuan banteng". Pembaca
#  kripto Indonesia memakai campuran: istilah teknis tetap Inggris, istilah
#  keuangan umum diterjemahkan.
#
#  Glosarium ini disuntikkan ke prompt terjemahan. Urutan penting: `keep`
#  diperiksa lebih dulu, baru `translate`.
# =============================================================================

# ---------------------------------------------------------------------------
# TETAP BAHASA INGGRIS
# Istilah yang sudah jadi kosakata sehari-hari komunitas kripto Indonesia.
# Menerjemahkannya justru membuat teks terasa asing.
# ---------------------------------------------------------------------------
keep:
  - staking
  - stablecoin
  - airdrop
  - halving
  - mining          # "penambangan" masih dipakai, tetapi "mining" lebih lazim
  - hashrate
  - blockchain
  - smart contract
  - DeFi
  - NFT
  - token
  - altcoin
  - memecoin
  - bullish
  - bearish
  - rug pull
  - whale
  - gas fee
  - layer 2
  - rollup
  - validator
  - node
  - wallet          # "dompet" boleh dipakai bergantian; keduanya diterima
  - private key
  - seed phrase
  - exchange        # lihat catatan di bawah: konteks menentukan
  - listing
  - delisting
  - burn
  - minting
  - yield farming
  - liquidity pool
  - market maker
  - order book
  - spot
  - futures
  - leverage
  - long
  - short
  - ETF
  - custody
  - oracle
  - bridge
  - testnet
  - mainnet
  - fork
  - governance
  - DAO
  - KYC
  - AML
  - Web3
  - metaverse
  - tokenomics
  - whitepaper
  - roadmap

# ---------------------------------------------------------------------------
# WAJIB DITERJEMAHKAN
# Istilah keuangan umum yang punya padanan mapan di media ekonomi Indonesia.
# Membiarkannya dalam bahasa Inggris membuat tulisan terkesan malas.
# ---------------------------------------------------------------------------
translate:
  market capitalization: "kapitalisasi pasar"
  market cap: "kapitalisasi pasar"
  trading volume: "volume perdagangan"
  crypto exchange: "bursa kripto"
  digital asset: "aset digital"
  crypto asset: "aset kripto"
  cryptocurrency: "aset kripto"
  regulator: "regulator"
  regulation: "regulasi"
  lawmaker: "anggota parlemen"
  lawsuit: "gugatan"
  settlement: "penyelesaian"
  enforcement action: "tindakan penegakan"
  compliance: "kepatuhan"
  disclosure: "keterbukaan informasi"
  custodian: "kustodian"
  yield: "imbal hasil"
  interest rate: "suku bunga"
  inflation: "inflasi"
  institutional investor: "investor institusi"
  retail investor: "investor ritel"
  asset manager: "manajer investasi"
  hedge fund: "dana lindung nilai"
  venture capital: "modal ventura"
  funding round: "putaran pendanaan"
  valuation: "valuasi"
  acquisition: "akuisisi"
  partnership: "kemitraan"
  inflow: "aliran dana masuk"
  outflow: "aliran dana keluar"
  all-time high: "rekor tertinggi"
  all-time low: "rekor terendah"
  price target: "target harga"
